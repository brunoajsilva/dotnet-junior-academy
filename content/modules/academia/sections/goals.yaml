id: goals
title: Objetivos
blocks:
  - type: paragraph
    text: No fim da Academia consegues ler, alterar e criar código backend em .NET dentro da equipa. Cada módulo acrescenta uma capacidade concreta.
  - type: outcomes
    outcomes:
      - moduleId: csharp
        title: Ler e escrever C#
        summary: Tipos, decisões, ciclos, strings e métodos. Modelar um domínio com classes, records e interfaces. Consultar com LINQ, tratar erros e usar async/await.
        learnMore:
          explanation: "Resultado verificável: uma aplicação de consola completa, feita a partir de um enunciado, que regista contas e calcula totais por cliente."
      - moduleId: dotnet
        title: Construir e organizar uma API
        summary: Como o .NET executa o código, ASP.NET Core, Dependency Injection, Entity Framework Core, testes e camadas.
        learnMore:
          explanation: "Resultado verificável: uma Web API que guarda contas numa base de dados SQL Server, com testes unitários a passar e o código organizado em camadas."
      - moduleId: auth
        title: Proteger uma API
        summary: A diferença entre Basic Auth e OAuth 2.0, como funciona um JWT e como emitir, validar e autorizar com tokens.
        learnMore:
          explanation: "Resultado verificável: uma API pequena que faz login, emite um JWT, protege endpoints e distingue clientes de gestores, testada com o Bruno."
      - moduleId: projeto
        title: Juntar tudo num projeto real
        summary: "Uma API de um banco com Clean Architecture, construída de raiz: dois dias guiados e depois um enunciado com mais user stories do que as que cabem no tempo, para planeares e escolheres."
        learnMore:
          explanation: "Resultado verificável: uma solução com cinco projetos, migrations, autenticação JWT, as user stories que escolheste no teu plano, tratamento de erros por middleware e testes aos handlers."
