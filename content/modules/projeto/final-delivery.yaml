title: Entrega final
intro: "Último dia: entregas o projeto e fazemos uma review em conjunto. Não há tarefas novas. O que se revê é o que construíste até ao fim do dia 5."
deliverables:
  - title: A solução BankingApp
    description: O código dos cinco projetos, com as migrations, a compilar sem avisos e com os testes a passar.
  - title: O plano final
    description: As user stories que escolheste, as estimativas, os riscos, as dependências, o que ficou de fora e o que mudou ao longo da semana.
  - title: A coleção do Bruno
    description: Um pedido por endpoint que implementaste, para que o projeto possa ser experimentado sem ler o código.
reviewSteps:
  - title: Demonstração
    description: Mostras a API a funcionar e explicas o percurso de um pedido, do cabeçalho Authorization à base de dados.
  - title: Review do código
    description: Percorremos o código em conjunto. Há perguntas de «porquê» sobre as decisões que tomaste.
  - title: Plano contra realidade
    description: Comparas o que estimaste com o que aconteceu e dizes o que farias diferente.
planVersusReality:
  - Quantas horas estimaste no total e quantas gastaste?
  - Qual foi a user story em que mais erraste a estimativa? Porquê?
  - O que cortaste, e quando decidiste cortar?
  - O que farias diferente no planeamento?
reviewQuestions:
  - Porque é que a interface do repositório fica na Application e a implementação na Infrastructure?
  - Porque guardamos o hash da password e não a password?
  - O que acontece se a gravação da transferência falhar a meio?
  - Porque devolve o sistema not_found e não forbidden para a conta de outro cliente?
  - Que parte do teu código mudarias se trocasses SQL Server por outra base de dados?
