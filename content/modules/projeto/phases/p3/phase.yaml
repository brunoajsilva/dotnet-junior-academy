learnMore:
  explanation: "O número de user stories é propositadamente alto. Se concluíres que consegues fazer todas em 6 dias, estimaste mal. O que se avalia é a qualidade do plano e da execução: uma user story pronta e bem testada vale mais do que cinco a meio."
  tryIt: Antes de estimares, lê todas as user stories e tenta adivinhar quais têm mais risco. No fim do projeto, compara com o que realmente aconteceu.
