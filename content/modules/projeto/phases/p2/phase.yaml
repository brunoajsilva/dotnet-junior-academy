  - title: "Bruno: configurar o Authorize passo a passo"
    intro: O Bruno guarda a coleção em ficheiros de texto (.bru), que podes pôr no repositório, em docs/bruno. O fluxo é fazer Login, guardar o token numa variável e usá-lo como Bearer Token.
    brunoRequests:
      - title: Instalar e criar a coleção
        description: Instala o Bruno (usebruno.com). Em Collections escolhe Create Collection, dá-lhe o nome BankingApp e guarda-a numa pasta do repositório, por exemplo docs/bruno.
      - title: Criar o ambiente Local
        description: No canto superior direito, abre o seletor de ambientes e escolhe Configure. Cria o ambiente Local com a variável baseUrl, com o endereço https com que a Api arranca (está no launchSettings.json). Depois seleciona o ambiente Local.
      - title: Pedido Register (anónimo)
        description: "New Request, método POST, URL {{baseUrl}}/api/auth/register. No separador Body escolhe JSON e escreve o corpo. O separador Auth fica em No Auth. Envia: esperas HTTP 200 com success true."
      - title: Pedido Login e guardar o token
        description: Novo pedido POST {{baseUrl}}/api/auth/login com email e password. No separador Vars, secção Post Response, acrescenta a variável token com o valor res.body.data.accessToken (o token vem dentro de data). Cada vez que fizeres Login, o token novo fica guardado.
      - title: Pedido RetrieveDashboard (autenticado)
        description: "Novo pedido POST {{baseUrl}}/api/dashboard/retrieve, com o corpo JSON {}. No separador Auth escolhe Bearer Token e escreve {{token}} no campo Token. O Bruno envia o cabeçalho Authorization: Bearer <token>."
      - title: Experimentar os dois resultados
        description: "Corre o Login e depois o RetrieveDashboard: esperas success true com as contas em data. Muda o Auth do RetrieveDashboard para No Auth e envia outra vez: continua a ser HTTP 200, mas com success false e o erro unauthorized. Isso prova que o [Authorize] está a funcionar."
      - title: Se der erro de certificado
        description: "Em desenvolvimento, o certificado HTTPS é local. Na primeira execução o IDE pergunta se queres confiar nele: aceita. Se o Bruno continuar a recusar, desativa a verificação do certificado SSL nas preferências (só em desenvolvimento)."
      - title: "Opcional: autenticação ao nível da coleção"
        description: Nas definições da coleção, separador Auth, escolhe Bearer Token com {{token}}. Nos pedidos que precisam de token, põe o modo Inherit. Evita repetir a configuração em cada pedido.
    files:
