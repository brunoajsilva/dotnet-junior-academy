      - "Repetir o Register com o mesmo email e NIF: success false com dois erros conflict"
      - "POST /api/auth/login com password errada: success false, erro unauthorized"
      - "POST /api/dashboard/retrieve sem token: success false, erro unauthorized (e HTTP 200)"
      - "POST /api/dashboard/retrieve com o token do Login: success true com uma conta e saldo 0"
    expectedOutcome: |-
