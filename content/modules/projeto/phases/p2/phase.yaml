sections:
  - title: Como funciona o token JWT
    intro: No login, a API devolve um token assinado. O cliente envia-o em cada pedido, no cabeçalho Authorization. A API valida a assinatura e a validade, e fica a saber quem fez o pedido sem ir à base de dados.
    files:
      - name: Um JWT descodificado
        language: sh
        codeFile: code/um-jwt-descodificado.sh
  - title: Pacotes e configuração do JWT
    intro: "O token é assinado com uma chave que fica no appsettings.json, na secção Jwt. Para a formação, é a forma mais simples: uma chave de desenvolvimento, que muda de cada vez que quiseres. Num projeto real, esta chave seria um segredo fora do repositório (variável de ambiente ou cofre), mas isso fica para outro dia."
    steps:
      - Instalar os pacotes do JWT e do hash de passwords
      - Acrescentar a secção Jwt ao appsettings.json, com a Key (pelo menos 32 caracteres)
    files:
      - name: Instalar dependências
        language: sh
        codeFile: code/instalar-dependencias.sh
      - name: BankingApp.Api/appsettings.json
        language: json
        codeFile: code/BankingApp.Api/appsettings.json
