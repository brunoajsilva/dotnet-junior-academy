      register repetido -> success: false  [conflict, conflict]
      login errado     -> success: false  [unauthorized]
      dashboard s/ token -> success: false [unauthorized]
      dashboard c/ token -> success: true
      (todos com HTTP 200)
learnMore:
  explanation: |-
    Este passo aplica, na BankingApp, o que fizeste no AuthLab. O JWT (JSON Web Token) é o formato do token; o esquema Bearer, usado no cabeçalho Authorization, é a forma de o enviar. A própria API emite o token, em vez de um servidor de identidade externo. Num banco real usar-se-ia um servidor de identidade; aqui aprendes a base.

    A password nunca é guardada: guarda-se o hash. O token só prova quem és até expirar (ExpiresMinutes), por isso é curto.
  pitfall: Usar a chave de formação num projeto real. Quem tiver a chave consegue fabricar tokens válidos para qualquer cliente, por isso em produção ela vem de um cofre ou de uma variável de ambiente.
  tryIt: Copia o token do Login para jwt.io e vê os claims. Percebe porque nunca se põem segredos no payload.
