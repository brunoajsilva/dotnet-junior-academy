id: auth-5
title: "Hands-on I: gerar e validar um JWT"
intro: "Constróis de raiz uma Web API pequena, o AuthLab: configuras a autenticação JWT, crias no controller um método que gera o token e outro que só responde a quem o enviar. Não é a BankingApp: serve para perceberes cada peça antes do projeto."
lessons:
