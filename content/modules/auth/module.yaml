title: Autenticação e Autorização
shortTitle: Autenticação e Autorização
tagline: A diferença entre Basic Auth e OAuth 2.0, como funciona um JWT e um hands-on onde emites, validas e proteges com tokens.
chapters:
  - $ref: chapters/auth-1/chapter.yaml
  - $ref: chapters/auth-2/chapter.yaml
  - $ref: chapters/auth-3/chapter.yaml
