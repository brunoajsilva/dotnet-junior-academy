quiz:
  - question: Que tipo deves usar para guardar um saldo bancário?
    options:
      - double
      - decimal
      - float
      - int
    correctIndex: 1
    explanation: decimal trabalha em base 10 e não tem os erros de arredondamento de double ou float.
  - question: O que devolve 7 / 2 quando os dois valores são int?
    options:
      - "3.5"
      - "4"
      - "3"
      - Lança uma exceção
    correctIndex: 2
    explanation: A divisão entre inteiros é inteira. Para 3.5 um dos operandos tem de ser decimal ou double.
  - question: O que faz email ?? "n/a" quando email é null?
    options:
      - Lança NullReferenceException
      - Devolve "n/a"
      - Devolve null
      - Não compila
    correctIndex: 1
    explanation: ?? devolve o valor da direita quando o da esquerda é null.
  - question: Qual o ciclo que corre pelo menos uma vez?
    options:
      - for
      - foreach
      - while
      - do-while
    correctIndex: 3
    explanation: do-while testa a condição no fim de cada volta.
