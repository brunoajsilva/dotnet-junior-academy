quiz:
  - question: Quando é que uma consulta LINQ é efetivamente executada?
    options:
      - Quando é definida
      - Quando é enumerada (ToList, foreach, Count...)
      - Quando o programa arranca
      - Nunca, é só uma descrição
    correctIndex: 1
    explanation: "Execução diferida: a consulta corre quando enumeras."
  - question: Qual a diferença entre throw; e throw ex; dentro de um catch?
    options:
      - Nenhuma
      - throw; preserva a stack trace original
      - throw ex; é mais rápido
      - throw; só funciona em async
    correctIndex: 1
    explanation: throw ex; reescreve a stack trace e perdes o ponto onde o erro nasceu.
  - question: Como corres três chamadas async independentes ao mesmo tempo?
    options:
      - await em cada uma, uma a seguir à outra
      - Arrancar as Tasks e fazer await Task.WhenAll
      - Usar async void
      - Usar um ciclo for
    correctIndex: 1
    explanation: Primeiro arrancas as tarefas, depois esperas por todas.
  - question: O que faz o CancellationToken?
    options:
      - Cancela sozinho qualquer operação
      - Avisa quem executa; é este que tem de o verificar
      - Apaga a Task
      - Torna o método síncrono
    correctIndex: 1
    explanation: O cancelamento é cooperativo.
