<title>.NET Backend Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content=".NET Backend Academy interativa: introdução, C#, .NET, autenticação e projeto final com Clean Architecture.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Design: quiet editorial layout for reading and practice. One accent, hairlines instead of boxes,
   a serif for page titles, Inter for everything else, comfortable measure (about 70 characters). */
:root{
  color-scheme:light;
  /* Material Design 3 color roles (seed: violet-indigo). Light scheme. */
  --md-primary:#4A47C2; --md-on-primary:#FFFFFF; --md-primary-container:#E3E0FF; --md-on-primary-container:#0E0A68;
  --md-secondary-container:#E4E1F9; --md-on-secondary-container:#1A1A2E;
  --md-surface:#FCF8FF; --md-surface-lowest:#FFFFFF; --md-surface-low:#F6F2FB; --md-surface-container:#F0ECF5; --md-surface-high:#EAE6EF; --md-surface-highest:#E4E1E9;
  --md-on-surface:#1B1B21; --md-on-surface-variant:#47464F; --md-outline:#777680; --md-outline-variant:#C8C5D0;
  --md-error:#BA1A1A; --md-error-container:#FFDAD6; --md-on-error-container:#410002;
  --md-scrim:rgba(14,13,20,.42);
  /* legacy names mapped onto the roles, so every component follows the scheme */
  --bg:var(--md-surface); --surface:var(--md-surface-low); --surface2:var(--md-surface-container); --fg:var(--md-on-surface); --muted:var(--md-on-surface-variant); --faint:#6A6974; --line:var(--md-outline-variant); --line2:#B3B0BD;
  --accent:var(--md-primary); --accent-soft:var(--md-primary-container); --accent-fg:var(--md-on-primary);
  --ok:#14724F; --ok-soft:#E1F3EA; --warn:#8F4D00; --warn-soft:#FDEFD9; --bad:var(--md-error); --bad-soft:var(--md-error-container);
  --code-bg:var(--md-surface-container); --code-fg:#23222B; --code-mute:#6A6974; --c-str:#0B6B62; --c-kw:#6B2FD6; --c-ty:#1D4ED8; --c-num:#A24A00; --c-com:#74737E;
  --c-x0:#0F766E; --c-x1:#BE123C; --c-x2:#92400E; --c-x3:#1E40AF; --c-x4:#4D7C0F; --c-x5:#A21CAF; --c-academia:#14724F; --c-csharp:#5B3FD0; --c-dotnet:#1D5BD8; --c-auth:#BE185D; --c-projeto:#C2410C; --on-c:#FFFFFF;
  --l-domain:#B35C00; --l-application:#14724F; --l-infra:#1D5BD8; --l-api:#7C3AED; --l-tests:#5C606B;
  --tb-bg:rgba(246,242,251,.82); --shadow-1:0 1px 2px rgba(20,18,40,.10),0 1px 3px 1px rgba(20,18,40,.06); --shadow-2:0 1px 2px rgba(20,18,40,.12),0 2px 6px 2px rgba(20,18,40,.08);
  --f-serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-display:var(--f-body);
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  --tb:78px; --r:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:1.0625rem;line-height:1.7;-webkit-text-size-adjust:100%;font-feature-settings:"cv11","ss03";-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4,h5{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.018em;font-weight:600;line-height:1.2}
p{margin:0}
a{color:var(--accent);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
code,.mono{font-family:var(--f-mono);font-size:.88em}
.pad{padding-left:max(clamp(20px,3vw,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(20px,3vw,48px),env(safe-area-inset-right,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;padding-top:14px;pointer-events:none}
.topbar .in{pointer-events:auto;height:64px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;max-width:1760px;margin:0 auto;background:var(--tb-bg);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow-2);padding:0 12px 0 20px}
.brand{display:flex;align-items:center;background:none;border:0;padding:4px 6px;margin-left:-6px;font-size:1rem;color:var(--fg)}
.brand svg{flex:none}
.brand .wm{font-weight:560;letter-spacing:-.02em;white-space:nowrap;font-size:1.06rem}
.brand .wm b{font-weight:750;color:var(--c-dotnet)}
.sp{flex:1}
.ibtn{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--muted);font-size:.88rem}
.ibtn:hover{border-color:var(--line2);color:var(--fg)}
.ibtn kbd{font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--faint)}
.menu-btn{display:none}
.pill{font-size:.8rem;color:var(--muted);white-space:nowrap;padding:8px 14px;background:var(--surface2);border-radius:999px}
.pill b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}

/* shell */
.shell{max-width:1760px;margin:0 auto;display:grid;grid-template-columns:264px minmax(0,1fr);gap:clamp(40px,4.5vw,80px);padding-block:40px 96px}
.side{position:sticky;top:calc(var(--tb) + env(safe-area-inset-top,0px) + 20px);align-self:start;max-height:calc(100vh - var(--tb) - 40px);overflow:auto;padding-right:8px}
.side h2{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 12px 10px;font-weight:600}
.mod{margin-bottom:2px}
.mod>a{display:flex;align-items:baseline;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.92rem}
.mod>a:hover{background:var(--surface2);color:var(--fg)}
.mod>a .n{flex:none;width:1.2em;font-family:var(--f-mono);font-size:.78rem;color:var(--mc);font-weight:600}
.mod>a .t{flex:1;min-width:0}
.mod>a .pc{font-size:.72rem;color:var(--faint);font-variant-numeric:tabular-nums}
.mod.cur>a{color:var(--fg);font-weight:600}
.sub{list-style:none;margin:2px 0 12px 21px;padding:0 0 0 10px;border-left:1px solid var(--line)}
.sub a{display:flex;gap:9px;align-items:baseline;padding:4px 8px;border-radius:6px;text-decoration:none;color:var(--muted);font-size:.84rem;line-height:1.4}
.sub a:hover{color:var(--fg)}
.sub a.cur{color:var(--fg);font-weight:600;background:var(--surface2)}
.sub a .d{flex:none;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line2);transform:translateY(-1px)}
.sub a .d.full{background:var(--ok);border-color:var(--ok)}
.sub a .d.part{border-color:var(--ok);background:linear-gradient(90deg,var(--ok) 50%,transparent 50%)}
main{min-width:0}
/* module switcher (floating bar) */
.modnav{display:flex;justify-content:center;gap:4px;min-width:0}
.modnav a{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 15px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.92rem;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.modnav a .n{font-family:var(--f-mono);font-size:.74rem;color:var(--mc);font-weight:600}
.modnav a:hover{color:var(--fg);background:var(--surface2)}
.modnav a.cur{color:var(--fg);font-weight:650;background:color-mix(in srgb,var(--mc) 16%,var(--md-surface-high))}
.modnav a i{position:absolute;left:15px;bottom:5px;height:2px;border-radius:2px;background:var(--mc);width:calc((100% - 30px)*var(--p,0));opacity:.85}
/* contextual side menu */
.side .ctx{padding-right:4px}
.side .ctx .eyebrow{color:var(--mc,var(--faint));margin:0 0 6px 10px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:650}
.side .ctitle{font-family:var(--f-serif);font-weight:400;font-size:1.9rem;line-height:1.08;letter-spacing:-.015em;text-transform:none;color:var(--fg);margin:0 0 16px 10px}
.side .ctitle a{color:inherit;text-decoration:none}
.side .cbar{height:4px;background:var(--surface2);border-radius:4px;margin:0 10px;overflow:hidden}
.side .cbar i{display:block;height:100%;background:var(--mc);border-radius:4px}
.side .cmeta{margin:8px 10px 0;font-size:.76rem;color:var(--faint);font-variant-numeric:tabular-nums}
.ctx .sub{margin:20px 0 0;padding:0;border-left:0}
.ctx .sub a{padding:8px 10px;font-size:.9rem;border-radius:8px;gap:11px}
.ctx .sub a:hover{background:var(--surface2)}
.ctx .sub a.cur{background:color-mix(in srgb,var(--mc) 9%,var(--surface));box-shadow:inset 3px 0 0 var(--mc);font-weight:600}
.ctx .sub a .d{width:9px;height:9px;transform:translateY(1px)}
.ctx .sub a .d.full{background:var(--mc);border-color:var(--mc)}
.ctx .sub a .d.part{border-color:var(--mc);background:linear-gradient(90deg,var(--mc) 50%,transparent 50%)}
.mlist{list-style:none;margin:10px 0 0;padding:0}
.mlist a{display:grid;grid-template-columns:1.6rem 1fr auto;align-items:baseline;gap:8px;padding:10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
.mlist a:hover{background:var(--surface2);color:var(--fg)}
.mlist .n{font-family:var(--f-mono);font-size:.78rem;color:var(--mc);font-weight:600}
.mlist .pc{font-size:.72rem;color:var(--faint)}
.side-all{display:none}
.sub .gh{margin:0 10px 6px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:650}
.sub .gsep{margin:14px 10px 12px;border-top:1px solid var(--line);height:0}

.scrim{display:none}

/* page headers */
.crumb{font-size:.82rem;color:var(--faint);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}
.crumb a{color:var(--faint);text-decoration:none}
.crumb a:hover{color:var(--fg)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--mc,var(--accent));margin-bottom:14px}
.ph h1{font-family:var(--f-serif);font-weight:400;font-size:clamp(2.3rem,5vw,3.4rem);line-height:1.04;letter-spacing:-.02em}
.ph .lead{margin-top:18px;color:var(--muted);font-size:1.18rem;line-height:1.6;max-width:60ch}
.bar{height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mc,var(--accent));border-radius:99px;transition:width .3s}
.ph .barrow{display:flex;align-items:center;gap:14px;margin-top:26px;max-width:340px;font-size:.8rem;color:var(--faint)}
.ph .barrow .bar{flex:1}

/* home */
.hero{padding:0 0 40px}
.hero h1{font-family:var(--f-serif);font-weight:400;font-size:clamp(2.8rem,7vw,4.6rem);line-height:1;letter-spacing:-.025em;max-width:13ch}
.hero p{margin-top:22px;max-width:52ch;color:var(--muted);font-size:1.2rem;line-height:1.6}
.hero .eyebrow{font-size:.72rem;line-height:1.4;margin:0 0 18px;color:var(--faint);max-width:none}
.hero .cta{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-weight:550;font-size:.95rem;text-decoration:none}
.btn:hover{border-color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.mods{display:grid;border-top:1px solid var(--line)}
.mcard{display:grid;grid-template-columns:5.2rem minmax(0,1fr) auto;gap:6px 20px;align-items:baseline;padding:26px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg);min-width:0}
.mcard:hover{background:linear-gradient(90deg,transparent,var(--surface) 8%,var(--surface) 92%,transparent)}
.mcard .k{grid-row:1/3;white-space:nowrap;font-family:var(--f-mono);font-size:.76rem;color:var(--mc);font-weight:600;padding-top:.55em}
.mcard h3{font-size:1.5rem;letter-spacing:-.022em}
.mcard p{grid-column:2;color:var(--muted);font-size:.98rem;line-height:1.55;max-width:58ch}
.mcard .meta{grid-column:2;font-size:.8rem;color:var(--faint);margin-top:4px}
.mcard .go{grid-column:3;grid-row:1/3;align-self:center;display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--faint);min-width:92px}
.mcard .go .bar{flex:1}

/* chapter list */
.chlist{display:grid;margin-top:40px;border-top:1px solid var(--line)}
.chcard{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:18px;align-items:baseline;padding:22px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.chcard:hover h3{color:var(--accent)}
.chcard .num{font-family:var(--f-mono);font-size:.9rem;color:var(--mc);font-weight:600}
.chcard h3{font-size:1.2rem}
.chcard p{color:var(--muted);font-size:.95rem;margin-top:4px;line-height:1.55}
.chcard .st{font-size:.78rem;color:var(--faint);text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:.7rem;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);margin-right:6px;letter-spacing:.01em}
.tag.ex{border-color:var(--warn);color:var(--warn)}
.tag.qz{border-color:var(--accent);color:var(--accent)}

/* lessons: open sections separated by hairlines, no boxes */
.lessons{display:grid;margin-top:44px;border-top:1px solid var(--line)}
.lesson{padding:40px 0 44px;border-bottom:1px solid var(--line);min-width:0;scroll-margin-top:calc(var(--tb) + 16px)}
.lh{display:flex;align-items:baseline;gap:16px;margin-bottom:22px}
.lh .ix{flex:none;font-family:var(--f-mono);font-size:.8rem;color:var(--faint);width:1.8rem}
.lh h3{flex:1;min-width:0;font-size:1.5rem;letter-spacing:-.022em}
.seenbtn{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--faint);font-size:.78rem;font-weight:550}
.seenbtn:hover{border-color:var(--ok);color:var(--ok)}
.seenbtn[aria-pressed="true"]{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.lbody{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.pts li{position:relative;padding-left:22px;font-size:1rem;color:var(--fg)}
.pts li::before{content:"";position:absolute;left:3px;top:.78em;width:6px;height:6px;border-radius:50%;background:var(--mc,var(--accent))}
.lfoot{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.more{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 16px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-weight:550;font-size:.88rem}
.more:hover{border-color:var(--accent);color:var(--accent)}
.more svg{transition:transform .2s}
.more:hover svg{transform:translateX(3px)}
.lesson.exercise{margin:0 -24px;padding-left:24px;padding-right:24px;background:linear-gradient(var(--surface),var(--surface));border-left:3px solid var(--warn);border-radius:0 12px 12px 0}
.ex-badge{display:inline-block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:650;color:var(--warn);margin-bottom:10px}

/* code: light, quiet */
.code{border-radius:var(--r);background:var(--code-bg);color:var(--code-fg);overflow:hidden;min-width:0;border:1px solid var(--line)}
.code .ch{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:.74rem;color:var(--code-mute)}
.code .ch .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.copy{border:1px solid var(--line2);background:var(--surface);color:var(--muted);border-radius:6px;font-size:.7rem;padding:2px 9px;font-family:var(--f-body)}
.copy:hover{color:var(--fg);border-color:var(--fg)}
.code pre{margin:0;padding:16px 18px;overflow-x:auto;font-family:var(--f-mono);font-size:.82rem;line-height:1.65;tab-size:4}
.code pre.sm{font-size:.78rem}
pre .k{color:var(--c-kw)}pre .s{color:var(--c-str)}pre .t{color:var(--c-ty)}pre .n{color:var(--c-num)}pre .c{color:var(--c-com);font-style:italic}
.tabs{display:flex;gap:0;overflow-x:auto;padding:0 6px;border-bottom:1px solid var(--line);background:var(--surface2)}
.tabs button{flex:none;border:0;background:transparent;color:var(--code-mute);font-family:var(--f-mono);font-size:.74rem;padding:9px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.term{margin:0;padding:14px 18px;border-radius:var(--r);background:var(--code-bg);border:1px solid var(--line);color:var(--code-fg);font-family:var(--f-mono);font-size:.82rem;line-height:1.6;overflow-x:auto;white-space:pre}

/* cards, flow, tables, callouts */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0 28px}
.cgrid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.icard{padding:16px 0 18px;border-top:1px solid var(--line);min-width:0}
.icard h4{font-size:1rem;margin-bottom:6px}
.icard p,.icard li{font-size:.95rem;color:var(--muted);line-height:1.6}
.icard p+p{margin-top:6px}
.icard ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.icard .code{margin-top:10px}
.flow{display:flex;flex-wrap:wrap;gap:10px 0;margin-bottom:18px;align-items:stretch}
.fstep{position:relative;flex:1 1 130px;min-width:0;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);margin-right:26px}
.fstep:last-child{margin-right:0}
.fstep:not(:last-child)::after{content:"→";position:absolute;right:-24px;top:50%;transform:translateY(-50%);color:var(--faint);width:22px;text-align:center}
.fstep b{display:block;font-size:.92rem;margin-bottom:2px}
.fstep span{font-size:.82rem;color:var(--muted);line-height:1.45;display:block}
.note{margin-top:16px;padding:14px 18px;border-radius:var(--r);overflow-wrap:anywhere;grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);font-size:.95rem;display:grid;gap:4px;color:var(--muted)}
.note.warn{border-left:3px solid var(--warn)}
.tbl{overflow-x:auto;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.tbl table{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:11px 14px 11px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.tbl th{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:550;white-space:nowrap}
.tbl.mono td:first-child{font-family:var(--f-mono);font-size:.84rem}

/* exercise steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.step{display:flex;gap:14px;align-items:flex-start;padding:9px 10px;margin:0 -10px;border-radius:8px;border:0;background:transparent;cursor:pointer;text-align:left;width:calc(100% + 20px)}
.step:hover{background:var(--surface2)}
.step .bx{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;margin-top:3px;color:transparent;background:var(--surface)}
.step[aria-checked="true"] .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.step[aria-checked="true"] .tx{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line2)}
.step .tx{flex:1;min-width:0;overflow-wrap:anywhere;font-size:1rem}
.step .tx b{font-weight:600}
.reveal{margin-top:18px}
.reveal>button{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border:1px solid var(--line2);border-radius:99px;background:var(--surface);color:var(--fg);font-size:.86rem;font-weight:550}
.reveal>button:hover{border-color:var(--accent);color:var(--accent)}
.reveal .panel{margin-top:10px}
.extra{margin-top:18px;padding-left:16px;border-left:2px solid var(--accent);font-size:.95rem;color:var(--muted)}
.extra b{color:var(--accent);font-weight:600}
.ents{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:18px}
.ent{padding:9px 14px;border-radius:var(--r);border:1px solid var(--line2);background:var(--surface);text-align:center}
.ent b{display:block;font-family:var(--f-mono);font-size:.86rem}
.ent span{font-size:.76rem;color:var(--muted)}
.rel{font-size:.76rem;color:var(--faint)}

/* pyramid & layers */
.pyr{display:grid;gap:6px;justify-items:center;margin-bottom:16px}
.pyr div{padding:10px 14px;border-radius:8px;text-align:center;color:#fff;font-size:.9rem}
.pyr div b{display:block}
.pyr div:nth-child(1){width:42%;background:#7C3AED}.pyr div:nth-child(2){width:68%;background:#1D5BD8}.pyr div:nth-child(3){width:100%;background:#14724F}
.rings{display:grid;place-items:center;margin-bottom:6px}
.ring{border-radius:18px;padding:34px 16px 16px;position:relative;text-align:center;width:100%}
.ring .lb{position:absolute;top:8px;left:0;right:0;font-size:.76rem;font-weight:650}
.ring.r1{background:var(--l-infra);color:var(--on-c)}.ring.r2{background:var(--l-application);color:#fff;width:100%}.ring.r3{background:var(--l-domain);color:#fff}

/* quiz */
.quiz{margin-top:56px;padding:28px 28px 20px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.quiz h2{font-size:1.35rem;margin-bottom:4px}
.quiz .sub2{color:var(--muted);font-size:.92rem;margin-bottom:12px}
.q{padding:20px 0;border-top:1px solid var(--line)}
.q p.qt{font-weight:600;margin-bottom:12px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;text-align:left;width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.95rem}
.opt:hover:not(:disabled){border-color:var(--fg)}
.opt:disabled{cursor:default;color:var(--muted)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--fg)}
.why{margin-top:12px;font-size:.92rem;color:var(--muted)}
.score{margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:600}

/* outro / pager */
.outro{margin-top:56px}
.outro h2{font-size:1.4rem;margin-bottom:6px}
.pager{display:flex;gap:12px;justify-content:space-between;margin-top:64px;flex-wrap:wrap}
.pager a{flex:1 1 240px;display:flex;flex-direction:column;gap:3px;padding:16px 0;border-top:1px solid var(--line2);text-decoration:none;color:var(--fg);min-width:0}
.pager a:hover span{color:var(--accent)}
.pager a small{color:var(--faint);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.pager a span{font-weight:550;font-size:1.02rem}
.pager a.nx{text-align:right}

/* academia blocks */
.blk{margin-top:44px}
.blk>h3{font-size:1.3rem;margin-bottom:6px}
.prose{max-width:64ch;font-size:1.08rem;line-height:1.75}
.prose+.prose{margin-top:16px}
.cardbtn{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px 0 20px;border:0;border-top:1px solid var(--line);background:transparent;min-width:0}
.cardbtn h4{font-size:1.05rem}
.cardbtn p{color:var(--muted);font-size:.95rem;line-height:1.55}
.cardbtn .go{margin-top:auto;padding-top:6px;color:var(--accent);font-weight:550;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.cardbtn:hover h4{color:var(--accent)}
.outc{display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:16px;padding:24px 0;border-top:1px solid var(--line);align-items:start}
.outc .n{font-family:var(--f-mono);font-size:.9rem;font-weight:600;color:var(--mc);padding-top:.3em}
.outc h4{font-size:1.2rem}.outc p{color:var(--muted);font-size:.97rem;margin-top:4px;max-width:58ch;line-height:1.6}
.outc .more{margin-top:12px;min-height:34px;font-size:.82rem}
.plan{display:grid;gap:0;border-top:1px solid var(--line)}
.pm{padding:22px 0;border-bottom:1px solid var(--line)}
.pm h4{display:flex;align-items:baseline;gap:12px;font-size:1.1rem;margin-bottom:12px}
.pm h4 .n{font-family:var(--f-mono);font-size:.84rem;color:var(--mc)}
.pm ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pm li a{display:inline-block;padding:5px 12px;border-radius:99px;border:1px solid var(--line);text-decoration:none;color:var(--muted);font-size:.84rem}
.pm li a:hover{border-color:var(--accent);color:var(--accent)}
.sw{display:grid;gap:0;border-top:1px solid var(--line)}
.swi{border-bottom:1px solid var(--line);padding:20px 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.swi h4{font-size:1.05rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swi p{color:var(--muted);font-size:.94rem;line-height:1.6}
.swi .cmd{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.84rem}
.swi .cmd code{background:var(--code-bg);border:1px solid var(--line);padding:3px 9px;border-radius:6px;max-width:100%;overflow-x:auto;white-space:nowrap}
.swi .exp{color:var(--muted)}
.swi .acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-block;font-size:.66rem;font-weight:650;padding:1px 8px;border-radius:99px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line2);color:var(--muted)}
.chip.req{border-color:var(--accent);color:var(--accent)}
.chk{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line2);background:var(--surface);display:grid;place-items:center;color:transparent;padding:0;margin-top:2px}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chk:hover{border-color:var(--ok)}
.minibtn{min-height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);font-size:.78rem;font-weight:550;color:var(--muted)}
.minibtn:hover{border-color:var(--accent);color:var(--accent)}

/* project: architecture */
.arch{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:16px}
.stack{display:grid;gap:8px}
.lay{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);position:relative}
.lay .dot{flex:none;width:10px;height:10px;border-radius:3px;background:var(--lc)}
.lay b{font-family:var(--f-mono);font-size:.84rem;font-weight:500}
.lay small{display:block;color:var(--muted);font-size:.78rem}
.lay:hover{border-color:var(--lc)}
.lay[aria-pressed="true"]{border-color:var(--lc);box-shadow:inset 3px 0 0 var(--lc)}
.lay.ref{border-style:dashed;border-color:var(--lc)}
.arr{text-align:center;color:var(--faint);font-size:.72rem;line-height:1}
.lpanel{padding:22px;border:1px solid var(--line);border-radius:12px;background:var(--surface);position:sticky;top:calc(var(--tb) + env(safe-area-inset-top,0px) + 20px)}
.lpanel h4{font-size:1.1rem;margin-bottom:2px;color:var(--lc);font-family:var(--f-mono);font-weight:500}
.lpanel .role{font-size:.8rem;color:var(--muted);margin-bottom:10px}
.lpanel p{font-size:.94rem;line-height:1.6}
.lpanel h5{margin:16px 0 6px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.lpanel ul{margin:0;padding-left:18px;font-size:.9rem;display:grid;gap:3px}
.lpanel .never{padding:8px 12px;border-radius:8px;background:var(--bad-soft);font-size:.88rem}
.lchip{display:inline-block;font-size:.7rem;font-weight:650;padding:2px 10px;border-radius:99px;color:#fff;background:var(--lc)}
.stepper{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:22px;margin-top:16px}
.stepper .dots{display:flex;gap:5px;margin-bottom:16px}
.stepper .dots button{flex:1;height:4px;border-radius:99px;border:0;background:var(--line);padding:0}
.stepper .dots button.on{background:var(--accent)}
.stepper .dots button.done{background:color-mix(in srgb,var(--accent) 40%,var(--line))}
.stepper h4{font-size:1.15rem;margin:10px 0 6px}
.stepper p{color:var(--muted);font-size:.97rem}
.stepper .ctl{display:flex;gap:8px;margin-top:18px}
.uses{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:24px;font-size:.82rem;color:var(--faint)}
.uses a{padding:3px 11px;border-radius:99px;border:1px solid var(--line);text-decoration:none;color:var(--muted);font-size:.8rem}
.uses a:hover{border-color:var(--accent);color:var(--accent)}

/* project: days, phases, sections, trees, features */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0 28px;margin-top:8px}
.day{padding:16px 0 20px;border-top:1px solid var(--line2);text-decoration:none;color:var(--fg);display:block}
.day small{display:block;font-family:var(--f-mono);font-size:.74rem;color:var(--c-projeto);font-weight:600;margin-bottom:4px}
.day h4{font-size:1.02rem;margin-bottom:4px}
.day p{font-size:.88rem;color:var(--muted);line-height:1.55}
.day:hover h4{color:var(--accent)}
.phases{display:grid;border-top:1px solid var(--line)}
.ph-card{display:grid;grid-template-columns:5.4rem minmax(0,1fr) auto;gap:18px;align-items:baseline;padding:22px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.ph-card:hover h3{color:var(--accent)}
.ph-card .num{font-family:var(--f-mono);font-size:.78rem;color:var(--c-projeto);font-weight:600}
.ph-card h3{font-size:1.15rem}.ph-card p{color:var(--muted);font-size:.93rem;margin-top:4px;line-height:1.55}
.sec{margin-top:52px;padding-top:28px;border-top:1px solid var(--line)}
.sec>h2{font-size:1.4rem;letter-spacing:-.022em;display:flex;gap:14px;align-items:baseline}
.sec>h2 .ix{font-family:var(--f-mono);font-size:.78rem;font-weight:500;color:var(--faint)}
.sec .intro{margin-top:10px;color:var(--muted);max-width:62ch;font-size:1rem;line-height:1.7}
.sec .steps,.sec .code,.sec .reveal,.sec .tbl{margin-top:18px}
.bruno{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:0;counter-reset:b}
.bruno li{counter-increment:b;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.bruno li::before{content:counter(b);font-family:var(--f-mono);font-size:.8rem;color:var(--c-projeto);font-weight:600;padding-top:.2em}
.bruno h4{font-size:1rem;margin-bottom:2px}
.bruno p{color:var(--muted);font-size:.94rem;line-height:1.6}
.treebox{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:start;margin-top:16px}
.tree{font-family:var(--f-mono);font-size:.78rem;line-height:1.5;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 8px;overflow-x:auto}
.tree ul{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid var(--line)}
.tree>ul{padding-left:0;border-left:0}
.tree details>summary{list-style:none;cursor:pointer;padding:3px 6px;border-radius:5px;display:flex;gap:6px;align-items:center;color:var(--fg);white-space:nowrap}
.tree details>summary::-webkit-details-marker{display:none}
.tree details>summary::before{content:"▸";font-size:.62rem;color:var(--faint);transition:transform .15s;display:inline-block;width:.7em}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree summary:hover,.tfile:hover{background:var(--surface2)}
.tdir{font-weight:500}
.tree summary.grp{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:650;margin-top:8px}
.tree li.proj{margin:14px 0 4px;border:1px solid color-mix(in srgb,var(--lc) 28%,var(--line));border-left:4px solid var(--lc);border-radius:10px;background:color-mix(in srgb,var(--lc) 4%,#fff);padding:4px 8px 8px 6px}
.tree li.proj>details>summary{font-weight:700;color:var(--lc);font-size:.82rem;padding:8px 8px 6px}
.tree li.proj>details>summary:hover{background:color-mix(in srgb,var(--lc) 8%,#fff)}
.tree li.proj>details>ul{border-left:0;padding-left:8px}
.tree li.proj .tfile[aria-pressed="true"]{background:color-mix(in srgb,var(--lc) 14%,#fff);color:var(--fg)}
.tree li.proj .tfile.has::after{background:var(--lc)}
.tfile{display:flex;gap:7px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:3px 6px 3px 19px;border-radius:5px;font:inherit;color:var(--muted);white-space:nowrap}
.tfile[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.tfile.has::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}
.ttag{font-family:var(--f-body);font-size:.6rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;padding:0 6px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.ttag.novo{color:var(--ok);border-color:var(--ok)}.ttag.alterado{color:var(--warn);border-color:var(--warn)}.ttag.apagar{color:var(--bad);border-color:var(--bad)}
.tpanel{position:sticky;top:calc(var(--tb) + env(safe-area-inset-top,0px) + 20px);min-width:0}
.tpanel h4{font-family:var(--f-mono);font-weight:500;font-size:.9rem;word-break:break-all;margin-bottom:6px}
.tpanel p{color:var(--muted);font-size:.94rem;line-height:1.6;margin-bottom:12px}
.tpanel .empty{color:var(--faint);font-size:.9rem}
.feats{margin-top:20px;border-top:1px solid var(--line2)}
.feat{border-bottom:1px solid var(--line)}
.feat>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:18px 4px}
.feat>summary::-webkit-details-marker{display:none}
.feat>summary:hover h3{color:var(--accent)}
.feat .fid{font-family:var(--f-mono);font-size:.82rem;font-weight:600;color:var(--c-projeto)}
.feat h3{font-size:1.12rem}
.feat .st{font-size:.9rem;color:var(--muted);margin-top:2px;line-height:1.5}
.feat .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.val{font-size:.66rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.val.Alto{color:var(--ok);border-color:var(--ok)}.val.Médio{color:var(--warn);border-color:var(--warn)}
.pickbtn{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border:1px solid var(--line2);border-radius:99px;background:var(--surface);font-size:.74rem;font-weight:550;color:var(--muted)}
.pickbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.feat .fbody{padding:6px 4px 30px 3.5rem;display:grid;gap:20px}
.feat h5{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;font-weight:600}
.feat .ep{font-family:var(--f-mono);font-size:.84rem;line-height:1.7;word-break:break-word}
.feat ul.rl{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.feat ul.rl li{position:relative;padding-left:20px;font-size:.97rem}
.feat ul.rl li::before{content:"";position:absolute;left:2px;top:.78em;width:5px;height:5px;border-radius:50%;background:var(--c-projeto)}
.planbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 0;font-size:.9rem;color:var(--muted);border-bottom:1px solid var(--line)}
.planbar b{color:var(--fg)}
.planlist{font-family:var(--f-mono);font-size:.84rem;color:var(--fg)}
.ol{margin:0;padding:0;list-style:none;display:grid;gap:0;counter-reset:o}
.ol li{counter-increment:o;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:1rem}
.ol li::before{content:counter(o);font-family:var(--f-mono);font-size:.8rem;color:var(--faint);padding-top:.2em}


/* drawer & search */
.dr-scrim{position:fixed;inset:0;background:var(--md-scrim);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.dr-scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);max-width:100vw;overflow:hidden;background:var(--surface);z-index:90;transform:translateX(100%);transition:transform .25s ease,visibility .25s;display:flex;flex-direction:column;visibility:hidden;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none;visibility:visible;box-shadow:var(--shadow-2)}
.drawer .dh{display:flex;align-items:center;gap:12px;padding:14px 20px 12px max(24px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.drawer .dh .eyebrow{margin:0;color:var(--faint);flex:1}
.drawer .db{overflow:auto;padding:28px max(28px,env(safe-area-inset-right,0px)) calc(36px + env(safe-area-inset-bottom,0px)) max(28px,env(safe-area-inset-left,0px));display:grid;gap:18px;align-content:start;grid-template-columns:minmax(0,1fr)}
.drawer h2{font-family:var(--f-serif);font-weight:400;font-size:2rem;line-height:1.1;letter-spacing:-.015em}
.drawer .db p{font-size:1.02rem;line-height:1.75;overflow-wrap:anywhere;min-width:0}
.drawer .db *{min-width:0;max-width:100%}
.drawer .db .pre{white-space:pre-line}
.callout{padding:14px 0 14px 16px;font-size:.96rem;border-left:2px solid var(--line2)}
.callout b{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.callout.pit{border-left-color:var(--warn)}.callout.pit b{color:var(--warn)}
.callout.try{border-left-color:var(--accent)}.callout.try b{color:var(--accent)}
.sbox{position:fixed;left:50%;top:max(10vh,calc(env(safe-area-inset-top,0px) + 12px));transform:translateX(-50%);width:min(620px,calc(100% - 32px));max-height:76vh;background:var(--surface);border:1px solid var(--line);border-radius:14px;z-index:95;box-shadow:0 24px 60px rgba(20,21,26,.22);display:none;flex-direction:column;overflow:hidden}
.sbox.on{display:flex}
.sbox input{border:0;border-bottom:1px solid var(--line);padding:18px 20px;font:inherit;font-size:1.05rem;background:transparent;color:var(--fg);outline:none}
.sres{overflow:auto;padding:8px}
.sres a{display:block;padding:10px 14px;border-radius:8px;text-decoration:none;color:var(--fg)}
.sres a:hover,.sres a.hot{background:var(--surface2)}
.sres small{display:block;color:var(--faint);font-size:.76rem}
.sres em{font-style:normal;color:var(--muted);font-size:.84rem;display:block}
.sempty{padding:20px;color:var(--muted);text-align:center}

@media (max-width:1180px){.modnav a .t{display:none}.modnav a{padding:0 14px}.modnav a .n{font-size:.9rem}}
@media (max-width:1000px){.arch,.treebox{grid-template-columns:minmax(0,1fr)}.lpanel,.tpanel{position:static}}
@media (max-width:920px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0;padding-block:28px 56px}
  .menu-btn{display:inline-flex}
  .modnav{display:none}
  .topbar .in{display:flex;padding:0 12px 0 10px}
  .topbar .in .brand{flex:1}
  .side .side-ctx{display:none}.side .side-all{display:block}
  .side{position:fixed;z-index:70;left:0;top:0;bottom:0;width:min(86vw,320px);max-height:none;background:var(--surface);padding:calc(20px + env(safe-area-inset-top,0px)) 14px 24px max(14px,env(safe-area-inset-left,0px));transform:translateX(-102%);transition:transform .25s;border-right:1px solid var(--line)}
  .side.on{transform:none;box-shadow:var(--shadow-2)}
  .scrim{display:block;position:fixed;inset:0;background:var(--md-scrim);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1;pointer-events:auto}
  .pill{display:none}
  }
@media (max-width:620px){
  .lesson.exercise{margin:0 -20px;padding-left:20px;padding-right:20px}
  .lh{flex-wrap:wrap;gap:8px 12px}.lh h3{flex-basis:calc(100% - 3rem)}.seenbtn{margin-left:2.6rem}

<script>
(function(){
"use strict";
var DATA=/*DATA*/null;
var MODS=DATA.modules, BYID={};
MODS.forEach(function(m){BYID[m.id]=m});
/* modules without a dedicated colour (new ones authored as JSON) cycle through --c-x0..x5 */
(function(){var known={academia:1,csharp:1,dotnet:1,auth:1,projeto:1},n=0;MODS.forEach(function(m){if(!known[m.id]){document.documentElement.style.setProperty("--c-"+m.id,"var(--c-x"+(n%6)+")");n++}})})();
var KEY="academia-dotnet-v1";

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function paras(t){return String(t).split(/\n\n+/).map(function(p){return '<p class="pre">'+esc(p)+'</p>'}).join("")}
var ARROW='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
var TICK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>';

/* ---------- state ---------- */
var P={seen:{},steps:{},quiz:{},sw:{},acc:{},ans:{},pick:{},last:""};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in P)if(o[k]!=null)P[k]=o[k]}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}

/* ---------- code highlight ---------- */
var KW={};("abstract as async await base bool break case catch char class const continue decimal default do double else enum false finally float for foreach if in init int interface internal is long namespace new null object out override private protected public readonly record ref return sealed short static string struct switch this throw true try using var virtual void while and or not when with get set required global args yield").split(" ").forEach(function(w){KW[w]=1});
function hlCs(c){
  var re=/(\/\/[^\n]*)|("""[\s\S]*?"""|\$?@?"(?:[^"\\\n]|\\.)*")|(\b\d[\d_]*(?:\.\d+)?[mMfFdDlLuU]?\b)|(\b[A-Za-z_]\w*\b)/g,out="",last=0,m;
  while((m=re.exec(c))){
    out+=esc(c.slice(last,m.index));last=re.lastIndex;
    if(m[1])out+='<span class="c">'+esc(m[1])+'</span>';
    else if(m[2])out+='<span class="s">'+esc(m[2])+'</span>';
    else if(m[3])out+='<span class="n">'+esc(m[3])+'</span>';
    else{var w=m[4];
      if(KW[w])out+='<span class="k">'+w+'</span>';
      else if(/^[A-Z]/.test(w)&&c.charAt(last)!=="(")out+='<span class="t">'+w+'</span>';
      else out+=w}
  }
  return out+esc(c.slice(last));
}
function hlSh(c){
  return c.split("\n").map(function(l){
    if(/^\s*#/.test(l))return '<span class="c">'+esc(l)+'</span>';
    var i=l.indexOf("   #"),cm="";if(i>0){cm='<span class="c">'+esc(l.slice(i))+'</span>';l=l.slice(0,i)}
    var h=esc(l).replace(/^(\s*)([\w.-]+)/,'$1<span class="k">$2</span>').replace(/(\s)(--?[a-zA-Z][\w-]*)/g,'$1<span class="n">$2</span>');
    return h+cm}).join("\n");
}
function hlJson(c){return esc(c).replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?/g,function(a,s,k){return k?'<span class="t">'+s+'</span>'+k:'<span class="s">'+s+'</span>'}).replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>')}
function hlXml(c){return esc(c).replace(/(&lt;\/?[\w.:]+)/g,'<span class="k">$1</span>').replace(/(&quot;[^&]*?&quot;)/g,'<span class="s">$1</span>')}
function hlHttp(c){return c.split("\n").map(function(l){
  if(/^\s*#/.test(l))return '<span class="c">'+esc(l)+'</span>';
  return esc(l).replace(/^(GET|POST|PUT|DELETE|PATCH)\b/,'<span class="k">$1</span>').replace(/^([\w-]+)(:)/,'<span class="t">$1</span>$2').replace(/(&quot;[^&]*?&quot;)(\s*:)?/g,function(a,s,k){return k?'<span class="t">'+s+'</span>'+k:'<span class="s">'+s+'</span>'})}).join("\n")}
function hl(code,lang){return lang==="sh"?hlSh(code):lang==="json"?hlJson(code):lang==="xml"?hlXml(code):lang==="http"?hlHttp(code):(lang==="txt"||lang==="bru")?esc(code):hlCs(code)}
var CID=0;
function codeBlock(code,lang,name,sm){
  var id="cb"+(++CID);
  return '<div class="code"><div class="ch"><span class="fn">'+esc(name||(lang==="sh"?"Terminal":lang==="cs"?"C#":lang==="xml"?".csproj":lang))+'</span><button class="copy" data-act="copy" data-t="'+id+'">Copiar</button></div><pre class="'+(sm?"sm":"")+'" id="'+id+'"><code>'+hl(code,lang)+'</code></pre></div>';
}
function multiCode(files,uid){
  if(files.length===1)return codeBlock(files[0].code,files[0].lang,files[0].name);
  var tabs='<div class="tabs" role="tablist">'+files.map(function(f,i){return '<button role="tab" aria-selected="'+(i===0)+'" data-act="tab" data-u="'+uid+'" data-i="'+i+'">'+esc(f.name.split("/").pop())+'</button>'}).join("")+'</div>';
  var panes=files.map(function(f,i){var id="cb"+(++CID);return '<div data-pane="'+uid+'-'+i+'" '+(i?"hidden":"")+'><div class="ch"><span class="fn">'+esc(f.name)+'</span><button class="copy" data-act="copy" data-t="'+id+'">Copiar</button></div><pre id="'+id+'"><code>'+hl(f.code,f.lang)+'</code></pre></div>'}).join("");
  return '<div class="code">'+tabs+panes+'</div>';
}

/* ---------- structure & routes ---------- */
var ROUTES=[],RT={};
window.ACADEMY={routes:function(){return ROUTES.map(function(r){return r.id})}};/* used by tests/smoke.js */
function addRoute(id,mod,title,sub){var r={id:id,mod:mod,t:title,sub:sub||""};ROUTES.push(r);RT[id]=r;return r}
MODS.forEach(function(m){
  if(m.kind==="intro"){m.sections.forEach(function(s){addRoute("academia-"+s.id,m.id,s.title)})}
  else if(m.kind==="course"){addRoute(m.id,m.id,m.title+": visão geral");m.chapters.forEach(function(c){addRoute(c.id,m.id,c.t)})}
  else{addRoute(m.id,m.id,"Visão geral e arquitetura");m.phases.forEach(function(p){addRoute("projeto-"+p.id,m.id,p.day?p.day+" · "+p.title:p.title)});addRoute("projeto-check",m.id,"Dia 6 · Fecho do projeto")}
});
function lessonIds(c){return c.lessons.map(function(l){return l.id})}
function chProg(c){var ids=lessonIds(c),n=0;ids.forEach(function(i){if(P.seen[i])n++});return {n:n,t:ids.length}}
function modProg(m){
  var n=0,t=0;
  if(m.kind==="course"){m.chapters.forEach(function(c){var p=chProg(c);n+=p.n;t+=p.t})}
  else if(m.kind==="intro"){m.sections.forEach(function(s){t++;if(P.seen["sec:"+s.id])n++;(s.blocks||[]).forEach(function(b){if(b.k==="software")b.items.forEach(function(i){if(i.need==="req"){t++;if(P.sw[i.id])n++}})})})}
  else{m.phases.forEach(function(p){t++;if(P.seen["ph:"+p.id])n++});m.accept.forEach(function(a,i){t++;if(P.acc[i])n++})}
  return {n:n,t:t,pc:t?Math.round(100*n/t):0};
}
function totalProg(){var n=0,t=0;MODS.forEach(function(m){var p=modProg(m);n+=p.n;t+=p.t});return Math.round(100*n/t)}
function routeStatus(id){
  var r=RT[id];if(!r)return 0;
  var c=null;MODS.forEach(function(m){(m.chapters||[]).forEach(function(x){if(x.id===id)c=x})});
  if(c){var p=chProg(c);return p.n===0?0:p.n===p.t?2:1}
  if(id.indexOf("projeto-p")===0)return P.seen["ph:"+id.slice(8)]?2:0;
  if(id.indexOf("academia-")===0)return P.seen["sec:"+id.slice(9)]?2:0;
  return 0;
}

/* ---------- sidebar ---------- */
var CUR="";
function modFirst(m){return m.kind==="intro"?"academia-what":m.id}
function modItems(m){return ROUTES.filter(function(r){return r.mod===m.id&&(m.kind==="intro"||r.id!==m.id)})}
function dayGroups(items){
  var out="",last="";
  items.forEach(function(r){
    var m=/^(Dias? [^·]+?) · (.+)$/.exec(r.t);
    if(m){
      if(m[1]!==last){out+='<li class="dgh">'+esc(m[1])+'</li>';last=m[1]}
      out+=itemLi(r,m[2],true);
    }else{out+=itemLi(r);last=""}
  });
  return out;
}
function sideGroups(items){
  var main=items.filter(function(r){return r.id!=="projeto-p4"}),extra=items.filter(function(r){return r.id==="projeto-p4"});
  if(!extra.length)return main.map(function(r){return itemLi(r)}).join("");
  return '<li class="gh">Com o formador</li>'+extra.map(function(r){return itemLi(r)}).join("")+'<li class="gsep"></li>'+dayGroups(main);
}
function itemLi(r,label,nested){var s=routeStatus(r.id);return '<li'+(nested?' class="nest"':"")+'><a href="#'+r.id+'" class="'+(r.id===CUR?"cur":"")+'"><span class="d '+(s===2?"full":s===1?"part":"")+'"></span><span>'+esc(label||r.t)+'</span></a></li>'}
function sideHtml(){
  var cm=RT[CUR]?RT[CUR].mod:"",cur=BYID[cm],ctx;
  if(cur){

var FILEUID=0,CODEBY={},TREEF={},TREEN=0;

function sectionHtml(p,s,si){
  var key="ph-"+p.id+"-"+si;
  var o='<section class="sec"><h2><span class="ix">'+(si+1<10?"0":"")+(si+1)+'</span>'+esc(s.t)+'</h2>';

function pickedIds(m){var ids=[];m.phases.forEach(function(p){(p.features||[]).forEach(function(f){if(P.pick[f.id])ids.push(f.id)})});return ids}
function planBar(m){
  var tot=0;m.phases.forEach(function(p){tot+=(p.features||[]).length});var ids=pickedIds(m);
  return '<div class="planbar" id="planbar"><span>No meu plano: <b>'+ids.length+'</b> de '+tot+'</span>'+(ids.length?'<span class="planlist">'+ids.join(" ")+'</span>':'<span>Marca as funcionalidades que escolhes em cada uma.</span>')+'</div>';

function featGroups(p){
  if(!p.epics)return '<div class="feats">'+p.features.map(featHtml).join("")+'</div>';

var USCUR=null;
function usRules(f){return '<ul>'+f.rules.map(function(r){return '<li>'+esc(r)+'</li>'}).join("")+'</ul>'}
function usDescHtml(f){var u=f.us;return '<p><b>Como</b> '+esc(u.persona)+', <b>quero</b> '+esc(u.quero)+', <b>para</b> '+esc(u.para)+'.</p><p>'+esc(u.desc)+'</p><p><b>Regras de negócio</b></p>'+usRules(f)+'<p><b>Fora do âmbito</b></p><ul>'+u.fora.map(function(r){return '<li>'+esc(r)+'</li>'}).join("")+'</ul>'}
function usAcHtml(f){return f.us.sc.map(function(s,i){var r=function(k,a){return a.map(function(x,j){return '<b>'+(j?"E":k)+'</b> '+esc(x)}).join("<br>")};return '<p><b>Cenário '+(i+1)+': '+esc(s[0])+'</b><br>'+r("Dado",s[1])+'<br>'+r("Quando",s[2])+'<br>'+r("Então",s[3])+'</p>'}).join("")}
function copyHtml(html,done){
  var d=document.createElement("div");d.innerHTML=html;d.style.cssText="position:fixed;left:-9999px;top:0;font:14px/1.4 Segoe UI,Arial,sans-serif;color:#000;background:#fff;letter-spacing:0";document.body.appendChild(d);
  var r=document.createRange();r.selectNodeContents(d);var s=getSelection();s.removeAllRanges();s.addRange(r);
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}
  s.removeAllRanges();document.body.removeChild(d);
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(d.textContent).then(function(){done(true)},function(){done(false)});return}
  done(ok);
}
function copyStory(what,btn){
  var f=USCUR;if(!f)return;
  var html=what==="title"?esc(f.id+" · "+f.t):what==="desc"?usDescHtml(f):usAcHtml(f);
  var old=btn.textContent;

}
function storyHtml(f){
  var u=f.us,pr={Alto:"Must have",Médio:"Should have",Baixo:"Could have"}[f.valor]||"";
  USCUR=f;
  var h='<div class="uscopy" role="group" aria-label="Copiar para o Azure DevOps"><span>Copiar para o Azure DevOps</span><button data-act="uscopy" data-k="title">Título</button><button data-act="uscopy" data-k="desc">Descrição</button><button data-act="uscopy" data-k="ac">Acceptance Criteria</button></div><p class="usline"><b>Como</b> '+esc(u.persona)+', <b>quero</b> '+esc(u.quero)+', <b>para</b> '+esc(u.para)+'.</p>';
  h+='<div class="usmeta"><span><i>Epic</i>'+esc(f.epic)+'</span><span><i>Prioridade</i>'+esc(pr)+'</span><span><i>Estimativa</i>'+u.sp+' pontos</span>'+(f.deps?'<span><i>Depende de</i>'+esc(f.deps)+'</span>':'')+'</div>';
  h+='<h3>Descrição</h3><p>'+esc(u.desc)+'</p>';
  h+='<h3>Regras de negócio</h3><ul class="usl">'+f.rules.map(function(r){return '<li>'+esc(r)+'</li>'}).join("")+'</ul>';
  h+='<h3>Critérios de aceitação</h3>'+u.sc.map(function(s,i){
    var row=function(k,a,first){return a.map(function(x,j){return '<p><b>'+(j?"E":k)+'</b> '+esc(x)+'</p>'}).join("")};
    return '<div class="gk"><h4>Cenário '+(i+1)+': '+esc(s[0])+'</h4>'+row("Dado",s[1])+row("Quando",s[2])+row("Então",s[3])+'</div>'}).join("");
  h+='<h3>Fora do âmbito</h3><ul class="usl">'+u.fora.map(function(r){return '<li>'+esc(r)+'</li>'}).join("")+'</ul>';
  h+='<h3>Definition of Done</h3><ul class="usl dod"><li>Regras de negócio no Domain ou no handler, com testes unitários</li><li>Migration criada e aplicada, quando há alterações ao modelo</li><li>Todos os cenários acima verificados, pelo menos num pedido no Bruno</li><li>Erros devolvidos como Response com o code correto (sempre HTTP 200)</li><li>Código revisto: uma classe por ficheiro, sem lógica de negócio no controller</li></ul>';
  return h;
}
function featHtml(f){
  var key=regMore("ft:"+f.id,f.id+" · "+f.t,f.hint),pk=!!P.pick[f.id];
  var o='<details class="feat" id="f-'+f.id+'"><summary><span class="fid">'+f.id+'</span><div><h3>'+esc(f.t)+'</h3><p class="st">'+esc(f.story)+'</p></div><span class="meta">'+(f.valor?'<span class="val '+f.valor+'">Valor '+f.valor.toLowerCase()+'</span>':"")+(f.deps?'<span class="val">depende de '+esc(f.deps)+'</span>':"")+'</span></summary><div class="fbody">';
  if(f.endpoint)o+='<div><h5>Pedido</h5><p class="ep">'+esc(f.endpoint)+'</p></div>';
  if(f.body)o+='<div>'+codeBlock(f.body,"json","Corpo do pedido",true)+'</div>';
  o+='<div><h5>Regras</h5><ul class="rl">'+f.rules.map(function(r){return '<li>'+esc(r)+'</li>'}).join("")+'</ul></div>';
  if(f.responses&&f.responses.length)o+='<div><h5>Resultados (sempre HTTP 200)</h5>'+tableHtml([["Resultado (code)","Quando"]].concat(f.responses))+'</div>';
  o+='<div><h5>Critérios de aceitação</h5>'+stepsHtml({id:"ft-"+f.id,steps:f.criteria.map(function(x){return {lead:"",text:x}})})+'</div>';
  if(f.uses&&f.uses.length)o+='<div class="uses" style="margin-top:0"><span>Rever:</span>'+f.uses.map(function(u){var r=RT[u];return '<a href="#'+u+'">'+esc(r?r.t:u)+'</a>'}).join("")+'</div>';
  o+='<div class="lfoot" style="margin-top:0">'+(f.us?'<button class="more story" data-act="more" data-k="'+esc(regMore("us:"+f.id,"User story "+f.id+" · "+f.t,{us:f}))+'">User story'+ARROW+'</button>':"")+moreBtn(key,"Pista")+(f.valor?'<button class="pickbtn" data-act="pick" data-k="'+f.id+'" aria-pressed="'+pk+'">'+(pk?"No meu plano":"Adicionar ao meu plano")+'</button>':"")+'</div></div></details>';
  return o;
}
function pagePhase(m,p,pi){
  var key=regMore("ph:"+p.id,p.title,p.more),on=!!P.seen["ph:"+p.id];
  CODEBY={};(p.sections||[]).forEach(function(s){(s.files||[]).forEach(function(f){CODEBY[f.name]=f})});
  var np=m.phases.filter(function(x){return x.day}).length;var o=crumb(m,p.day?p.day+" · "+p.title:p.title)+'<header class="ph" style="--mc:var(--c-projeto)"><p class="eyebrow">'+(p.day?esc(p.day)+' · Fase '+(m.phases.slice(0,pi).filter(function(x){return x.day}).length+1)+' de '+np:'Sessão com o formador')+'</p><h1>'+esc(p.title)+'</h1><p class="lead">'+esc(p.goal)+'</p></header><div style="--mc:var(--c-projeto)">';
  if(p.uses&&p.uses.length)o+='<div class="uses"><span>Usa:</span>'+p.uses.map(function(u){var r=RT[u];return '<a href="#'+u+'">'+esc(r?r.t:u)+'</a>'}).join("")+'</div>';
  (p.trees||[]).forEach(function(t){
    TREEF={};TREEN=0;var list=treeNode(t.root);
    o+='<div class="blk"><h3>'+esc(t.title)+'</h3><p style="color:var(--muted);font-size:.95rem">'+esc(t.note)+'</p><div class="treebox"><div class="tree"><ul>'+list+'</ul></div><div class="tpanel">'+treePanel(t.root)+'</div></div></div>';
  });
  if(p.rules)o+='<div class="blk"><h3>Regras do jogo</h3><ol class="ol">'+p.rules.map(function(r){return '<li><span>'+esc(r)+'</span></li>'}).join("")+'</ol></div>';
  if(p.features)o+='<div class="blk"><h3>Funcionalidades ('+p.features.length+')</h3>'+planBar(m)+''+featGroups(p)+'</div>';
  if(p.kind==="plan")o+='<div class="blk">'+planBar(m)+'</div>';
  (p.sections||[]).forEach(function(s,si){o+=sectionHtml(p,s,si)});
  o+='<div class="lfoot" style="margin-top:44px">'+moreBtn(key,"Saber mais sobre esta fase")+'<button class="seenbtn" data-act="phase" data-k="'+p.id+'" aria-pressed="'+on+'">'+TICK+'<span>'+(on?"Fase concluída":"Marcar como concluída")+'</span></button></div></div>';
  return o+pager("projeto-"+p.id);
}
function pageCheck(m){
  var c=m.closing;
  var o=crumb(m,"Fecho")+'<header class="ph" style="--mc:var(--c-projeto)"><p class="eyebrow">Dia 6 · Fecho</p><h1>Fecho do projeto</h1><p class="lead">'+esc(c.intro)+'</p></header><div style="--mc:var(--c-projeto)">';
  o+='<div class="blk"><h3>Tarefas do último dia</h3><div class="feats">'+c.tasks.map(featHtml).join("")+'</div></div>';
  o+='<div class="blk"><h3>Plano contra realidade</h3><ol class="ol">'+c.retro.map(function(x){return '<li><span>'+esc(x)+'</span></li>'}).join("")+'</ol></div>';
  o+='<div class="blk"><h3>Perguntas para a demonstração</h3><ol class="ol">'+c.why.map(function(x){return '<li><span>'+esc(x)+'</span></li>'}).join("")+'</ol></div>';
  o+='<div class="blk"><h3>Critérios de aceitação</h3><ul class="steps" style="margin-top:12px">'+m.accept.map(function(a,i){var on=!!P.acc[i];return '<li><button class="step" role="checkbox" aria-checked="'+on+'" data-act="acc" data-k="'+i+'"><span class="bx">'+TICK+'</span><span class="tx">'+esc(a)+'</span></button></li>'}).join("")+'</ul></div>';
  o+='<div class="blk"><h3>Todos os endpoints do enunciado</h3>'+tableHtml(m.endpoints)+'</div>';
  o+='<div class="blk"><h3>Extras (opcional)</h3><div class="note">'+m.extras.map(function(x){return '<span>'+esc(x)+'</span>'}).join("")+'</div></div></div>';

/* ---------- router ---------- */
function render(){
  CUR=(location.hash||"").replace(/^#/,"");
  if(CUR&&!RT[CUR])CUR="";
  var main=$("#main"),html="";
  if(!CUR)html=pageHome();
  else{
    var r=RT[CUR],m=BYID[r.mod];
    if(m.kind==="intro")html=pageIntroSection(m,CUR.slice(9));
    else if(m.kind==="course"){
      if(CUR===m.id)html=pageModuleOverview(m);
      else{var ci=m.chapters.findIndex(function(c){return c.id===CUR});html=pageChapter(m,m.chapters[ci],ci)}
    }else{
      if(CUR==="projeto")html=pageProjectOverview(m);
      else if(CUR==="projeto-check")html=pageCheck(m);
      else{var pi=m.phases.findIndex(function(p){return "projeto-"+p.id===CUR});html=pagePhase(m,m.phases[pi],pi)}
    }
    P.last=CUR;
  }
  main.innerHTML=html;
  document.title=(CUR?RT[CUR].t+" · ":"")+".NET Backend Academy";
  save();renderSide();closeSide();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

/* ---------- drawer ---------- */
var drOpener=null;
function openMore(key){
  var d=MORE[key];if(!d||!d.m)return;
  var m=d.m,h='<h2 id="drTitle">'+esc(d.t)+'</h2>'+(m.us?storyHtml(m.us):paras(m.more||""));
  if(m.pit)h+='<div class="callout pit"><b>Armadilha frequente</b>'+esc(m.pit)+'</div>';
  if(m.tryit)h+='<div class="callout try"><b>Experimenta</b>'+esc(m.tryit)+'</div>';
  $("#drBody").innerHTML=h;
  $("#drawer").classList.add("on");$("#drScrim").classList.add("on");$("#drawer").setAttribute("aria-hidden","false");
  drOpener=document.activeElement;$("#drClose").focus();$("#drBody").scrollTop=0;
}
function closeMore(){
  if(!$("#drawer").classList.contains("on"))return;
  $("#drawer").classList.remove("on");$("#drScrim").classList.remove("on");$("#drawer").setAttribute("aria-hidden","true");
  if(drOpener&&document.contains(drOpener))drOpener.focus();
}
function closeSide(){$("#side").classList.remove("on");$("#scrim").classList.remove("on");$("#menuBtn").setAttribute("aria-expanded","false")}

/* ---------- events ---------- */
function toast(btn,txt){var o=btn.textContent;btn.textContent=txt;setTimeout(function(){btn.textContent=o},1400)}
function copyText(t,btn){
  function fb(){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(btn,"Copiado")}catch(e){toast(btn,"Seleciona e copia")}ta.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast(btn,"Copiado")},fb);else fb();
}
function refreshProgress(){renderSide();$$(".ph .barrow").forEach(function(){});}
document.addEventListener("click",function(ev){
  var g=ev.target.closest("[data-go]");if(g){location.hash=g.getAttribute("data-go");if(!g.getAttribute("data-go"))render();return}
  var b=ev.target.closest("[data-act]");
  if(!b)return;
  var a=b.getAttribute("data-act"),k=b.getAttribute("data-k");
  if(a==="more"){openMore(k)}
  else if(a==="copy"){var pre=document.getElementById(b.getAttribute("data-t"));copyText(pre.textContent,b)}
  else if(a==="copytxt"){copyText(b.getAttribute("data-v"),b)}
  else if(a==="tab"){var u=b.getAttribute("data-u"),i=b.getAttribute("data-i");$$('[data-act="tab"][data-u="'+u+'"]').forEach(function(x){x.setAttribute("aria-selected",x===b)});$$('[data-pane^="'+u+'-"]').forEach(function(p){p.hidden=p.getAttribute("data-pane")!==u+"-"+i})}
  else if(a==="reveal"){var pn=b.nextElementSibling,open=pn.hidden;if(!b.getAttribute("data-l"))b.setAttribute("data-l",b.textContent);pn.hidden=!open;b.setAttribute("aria-expanded",open);b.textContent=open?"Esconder":b.getAttribute("data-l")}
  else if(a==="seen"){if(P.seen[k])delete P.seen[k];else P.seen[k]=1;save();b.setAttribute("aria-pressed",!!P.seen[k]);b.querySelector("span").textContent=P.seen[k]?"Visto":"Marcar como visto";b.closest(".lesson").classList.toggle("seen",!!P.seen[k]);renderSide();updBar()}
  else if(a==="phase"){var pk="ph:"+k;if(P.seen[pk])delete P.seen[pk];else P.seen[pk]=1;save();b.setAttribute("aria-pressed",!!P.seen[pk]);b.querySelector("span").textContent=P.seen[pk]?"Fase concluída":"Marcar como concluída";renderSide()}
  else if(a==="step"){if(P.steps[k])delete P.steps[k];else P.steps[k]=1;save();b.setAttribute("aria-checked",!!P.steps[k])}
  else if(a==="acc"){if(P.acc[k])delete P.acc[k];else P.acc[k]=1;save();b.setAttribute("aria-checked",!!P.acc[k]);renderSide()}
  else if(a==="sw"){if(P.sw[k])delete P.sw[k];else P.sw[k]=1;save();b.setAttribute("aria-pressed",!!P.sw[k]);b.closest(".swi").classList.toggle("ok",!!P.sw[k]);renderSide()}
  else if(a==="ans"){var c=b.getAttribute("data-c"),q=+b.getAttribute("data-q"),o=+b.getAttribute("data-o");P.ans[c]=P.ans[c]||[];P.ans[c][q]=o;save();var ch=findCh(c);$("#quiz-"+c).outerHTML=quizHtml(ch)}
  else if(a==="qreset"){var c2=b.getAttribute("data-c");delete P.ans[c2];save();$("#quiz-"+c2).outerHTML=quizHtml(findCh(c2))}
  else if(a==="tfile"||a==="tdir"){var bx=b.closest(".treebox");if(bx){var nd=TREEF[k];if(a==="tfile"){$$(".tfile",bx).forEach(function(x){x.setAttribute("aria-pressed",x===b)})}$(".tpanel",bx).innerHTML=treePanel(nd)}}
  else if(a==="uscopy"){copyStory(k,b)}
  else if(a==="pick"){if(P.pick[k])delete P.pick[k];else P.pick[k]=1;save();b.setAttribute("aria-pressed",!!P.pick[k]);b.textContent=P.pick[k]?"No meu plano":"Adicionar ao meu plano";var pb=$("#planbar");if(pb)pb.outerHTML=planBar(BYID.projeto)}
  else if(a==="layer"){SELL=k;$("#arch").innerHTML=archHtml(BYID.projeto)}
  else if(a==="fstep"){FSTEP=+b.getAttribute("data-i");$("#flowbox").innerHTML=flowHtml(BYID.projeto)}
  else if(a==="fnext"){FSTEP=Math.min(FSTEP+1,BYID.projeto.flow.length-1);$("#flowbox").innerHTML=flowHtml(BYID.projeto)}
  else if(a==="fprev"){FSTEP=Math.max(FSTEP-1,0);$("#flowbox").innerHTML=flowHtml(BYID.projeto)}
});
function findCh(id){var r=null;MODS.forEach(function(m){(m.chapters||[]).forEach(function(c){if(c.id===id)r=c})});return r}
function updBar(){
  var c=findCh(CUR);if(!c)return;var p=chProg(c),pc=Math.round(100*p.n/p.t),br=$(".ph .barrow");

$("#drClose").addEventListener("click",closeMore);
$("#drScrim").addEventListener("click",function(){closeMore()});
$("#menuBtn").addEventListener("click",function(){var on=!$("#side").classList.contains("on");$("#side").classList.toggle("on",on);$("#scrim").classList.toggle("on",on);this.setAttribute("aria-expanded",on)});
$("#scrim").addEventListener("click",closeSide);
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){closeMore();closeSide()}
});
render();
})();
