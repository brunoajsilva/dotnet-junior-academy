name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Content checks, type checks and build
        run: |
          npx tsx tools/check.ts
          npx astro check
          npm run build
      - name: Smoke test (every page, desktop and mobile)
        run: npx tsx tools/smoke.ts
