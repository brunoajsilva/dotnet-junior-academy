ection.cs", "d": "Regista JwtOptions, hasher e token service.", "f": "BankingApp.Infrastructure/DependencyInjection.cs", "tag": "alterado"}]}, {"n": "BankingApp.Api/", "d": "Autenticação e novos controllers.", "c": [{"n": "Contracts/", "d": "DTOs.", "c": [{"n": "Auth/", "d": "Register e Login.", "c": [{"n": "RegisterRequest.cs", "d": "O pedido de Register, com validação.", "f": "BankingApp.Api/Contracts/Auth/RegisterRequest.cs", "tag": "novo"}, {"n": "RegisterResponse.cs", "d": "A resposta de Register.", "f": "BankingApp.Api/Contracts/Auth/RegisterResponse.cs", "tag": "novo"}, {"n": "LoginRequest.cs", "d": "O pedido de Login.", "f": "BankingApp.Api/Contracts/Auth/LoginRequest.cs", "tag": "novo"}, {"n": "LoginResponse.cs", "d": "A resposta de Login, com o token.", "f": "BankingApp.Api/Contracts/Auth/LoginResponse.cs", "tag": "novo"}]}, {"n": "Dashboard/", "d": "RetrieveDashboard.", "c": [{"n": "DashboardAccountResponse.cs", "d": "Uma conta na resposta.", "f": "BankingApp.Api/Contracts/Dashboard/DashboardAccountResponse.cs", "tag": "novo"}, {"n": "DashboardResponse.cs", "d": "A resposta do dashboard.", "f": "BankingApp.Api/Contracts/Dashboard/DashboardResponse.cs", "tag": "novo"}]}]}, {"n": "Controllers/", "d": "Controllers.", "c": [{"n": "AuthController.cs", "d": "Register e Login (anónimos).", "f": "BankingApp.Api/Controllers/AuthController.cs", "tag": "novo"}, {"n": "DashboardController.cs", "d": "RetrieveDashboard (autenticado).", "f": "BankingApp.Api/Controllers/DashboardController.cs", "tag": "novo"}, {"n": "CustomersController.cs", "d": "Apaga: foi só para validar o Passo 1.", "f": null, "tag": "apagar"}]}, {"n": "Authentication/", "d": "Respostas de autenticação.", "c": [{"n": "RpcJwtBearerEvents.cs", "d": "Sem token ou sem permissão: 200 com o erro unauthorized ou forbidden.", "f": "BankingApp.Api/Authentication/RpcJwtBearerEvents.cs", "tag": "novo"}]}, {"n": "appsettings.json", "d": "Ganha a secção \"Jwt\", com a chave de desenvolvimento.", "f": "BankingApp.Api/appsettings.json", "tag": "alterado"}, {"n": "Program.cs", "d": "Autenticação JWT (com os eventos RPC) e UseAuthentication/UseAuthorization.", "f": "BankingApp.Api/Program.cs", "tag": "alterado"}]}]}, {"n": "tests/", "d": "Testes.", "c": [{"n": "BankingApp.Tests/", "d": "xUnit.", "c": [{"n": "Application/", "d": "Testes aos handlers.", "c": [{"n": "LoginHandlerTests.cs", "d": "Dois testes com mocks.", "f": "BankingApp.Tests/Application/LoginHandlerTests.cs", "tag": "novo"}]}]}]}]}}], "sections": [{"t": "Como funciona o token JWT", "intro": "No login, a API devolve um token assinado. O cliente envia-o em cada pedido, no cabeçalho Authorization. A API valida a assinatura e a validade, e fica a saber quem fez o pedido sem ir à base de dados.", "files": [{"name": "Um JWT descodificado", "lang": "sh", "code": "# header\n{ \"alg\": \"HS256\", \"typ\": \"JWT\" }\n\n# payload (the claims)\n{\n  \"sub\": \"1\",\n  \"email\": \"ana@example.com\",\n  \"name\": \"Ana Pereira\",\n  \"exp\": 1793700000,\n  \"iss\": \"BankingApp\",\n  \"aud\": \"BankingApp.Clients\"\n}\n\n# signature = HMACSHA256(header + \".\" + payload, Jwt:Key)\n# anyone can READ the payload (base64): never put secrets in it"}]}, {"t": "Pacotes e configuração do JWT", "intro": "O token é assinado com uma chave que fica no appsettings.json, na secção Jwt. Para a formação, é a forma mais simples: uma chave de desenvolvimento, que muda de cada vez que quiseres. Num projeto real, esta chave seria um segredo fora do repositório (variável de ambiente ou cofre), mas isso fica para outro dia.", "steps": ["Instalar os pacotes do JWT e do hash de passwords", "Acrescentar a secção Jwt ao appsettings.json, com a Key (pelo menos 32 caracteres)"], "files": [{"name": "Instalar dependências", "lang": "sh", "code": "dotnet add src/BankingApp.Api            package Microsoft.AspNetCore.Authentication.JwtBearer\ndotnet add src/BankingApp.Infrastructure package System.IdentityModel.Tokens.Jwt\ndotnet add src/BankingApp.Infrastructure package Microsoft.Extensions.Identity.Core\ndotnet add src/BankingApp.Infrastructure package Microsoft.Extensions.Options.ConfigurationExtensions"}, {"name": "BankingApp.Api/appsettings.json", "lang": "json", "code": "{\n  \"ConnectionStrings\": {\n    \"BankingApp\": \"Server=(localdb)\\\\MSSQLLocalDB;Database=BankingApp;Trusted_Connection=True;TrustServerCertificate=True\"\n  },\n  \"Jwt\": {\n    \"Issuer\": \"BankingApp\",\n    \"Audience\": \"BankingApp.Clients\",\n    \"Key\": \"replace-with-a-random-text-of-at-least-32-characters\",\n    \"ExpiresMinutes\": 60\n  },\n  \"Logging\": {\n    \"LogLevel\": { \"Default\": \"Information\", \"Microsoft.AspNetCore\": \"Warning\" }\n  },\n  \"AllowedHosts\": \"*\"\n}"}]}, {"t": "Domain: credenciais no cliente e a entidade Account", "intro": "O Customer passa a ter email e hash da password (nunca a password). Cada cliente começa com uma conta, por isso nasce a entidade Account.", "files": [{"name": "BankingApp.Domain/Customers/Customer.cs", "lang": "cs", "code": "using BankingApp.Domain.Accounts;\nusing BankingApp.Domain.Common;\n\nnamespace BankingApp.Domain.Customers;\n\npublic class Customer\n{\n    private Customer() { }   // required by EF Core\n\n    public Customer(string name, string taxId, string email, string passwordHash)\n    {\n        if (string.IsNullOrWhiteSpace(name))\n            throw new DomainException(\"Name is required.\");\n        if (taxId.Length != 9 || !taxId.All(char.IsDigit))\n            throw new DomainException($\"Invalid tax id: {taxId}\");\n        if (!email.Contains('@'))\n            throw new DomainException(\"Invalid email.\");\n        if (string.IsNullOrWhiteSpace(passwordHash))\n            throw new DomainException(\"Password hash is required.\");\n\n        Name = name.Trim();\n        TaxId = taxId;\n        Email = email.Trim().ToLowerInvariant();\n        PasswordHash = passwordHash;\n    }\n\n    public int Id { get; private set; }\n    public string Name { get; private set; } = \"\";\n    public string TaxId { get; private set; } = \"\";\n    public string Email { get; private set; } = \"\";\n    public string PasswordHash { get; private set; } = \"\";\n    public List<Account> Accounts { get; private set; } = [];\n}"}, {"name": "BankingApp.Domain/Accounts/Account.cs", "lang": "cs", "code": "using BankingApp.Domain.Common;\nusing BankingApp.Domain.Customers;\n\nnamespace BankingApp.Domain.Accounts;\n\npublic class Account\n{\n    private Account() { }   // required by EF Core\n\n    public static Account Open(string number, Customer customer, decimal initialDeposit, DateOnly opened)\n    {\n        if (string.IsNullOrWhiteSpace(number))\n            throw new DomainException(\"Number is required.\");\n        if (initialDeposit < 0)\n            throw new DomainException(\"Initial deposit cannot be negative.\");\n\n        return new Account\n        {\n            Number = number,\n            Customer = customer,\n            Balance = initialDeposit,\n            Opened = opened,\n            Status = AccountStatus.Active\n        };\n    }\n\n    public int Id { get; private set; }\n    public string Number { get; private set; } = \"\";\n    public int CustomerId { get; private set; }\n    public Customer Customer { get; private set; } = null!;\n    public decimal Balance { get; private set; }\n    public DateOnly Opened { get; private set; }\n    public AccountStatus Status { get; private set; }\n}"}, {"name": "BankingApp.Domain/Accounts/AccountStatus.cs", "lang": "cs", "code": "namespace BankingApp.Domain.Accounts;\n\npublic enum AccountStatus\n{\n    Active,\n    Closed\n}"}]}, {"t": "Application: Register, Login e RetrieveDashboard", "intro": "Dois casos de uso anónimos e um autenticado, todos com Request e Response. O Login devolve sempre o mesmo erro (unauthorized) para email desconhecido e password errada, para não revelar que emails existem. O Register junta todos os problemas numa lista de erros.", "steps": ["Acrescentar ao Abstractions o IPasswordHasher, o ITokenService e o TokenResult (um ficheiro cada)", "Criar uma pasta por caso de uso: Handlers/CommandHandlers/Register, Handlers/CommandHandlers/Login e Handlers/QueryHandlers/RetrieveDashboard, com o comando (ou consulta), o resultado e o handler lado a lado", "Registar os handlers no AddApplication()", "Apagar as pastas Handlers/CommandHandlers/CreateCustomer e Handlers/QueryHandlers/ListCustomers, que já não são precisas"], "files": [{"name": "BankingApp.Application/Abstractions/ICustomerRepository.cs", "lang": "cs", "code": "using BankingApp.Domain.Customers;\n\nnamespace BankingApp.Application.Abstractions;\n\npublic interface ICustomerRepository\n{\n    Task<bool> ExistsByEmailAsync(string email, CancellationToken ct);\n    Task<bool> ExistsByTaxIdAsync(string taxId, CancellationToken ct);\n    Task<Customer?> GetByEmailAsync(string email, CancellationToken ct);\n    Task<Customer?> GetByIdWithAccountsAsync(int id, CancellationToken ct);\n    Task AddAsync(Customer customer, CancellationToken ct);\n    Task SaveChangesAsync(CancellationToken ct);\n}"}, {"name": "BankingApp.Application/Abstractions/IPasswordHasher.cs", "lang": "cs", "code": "namespace BankingApp.Application.Abstractions;\n\npublic interface IPasswordHasher\n{\n    string Hash(string password);\n    bool Verify(string hash, string password);\n}"}, {"name": "BankingApp.Application/Abstractions/TokenResult.cs", "lang": "cs", "code": "namespace BankingApp.Application.Abstractions;\n\npublic class TokenResult\n{\n    public string AccessToken { get; init; } = \"\";\n    public DateTime ExpiresAtUtc { get; init; }\n}"}, {"name": "BankingApp.Application/Abstractions/ITokenService.cs", "lang": "cs", "code": "using BankingApp.Domain.Customers;\n\nnamespace BankingApp.Application.Abstractions;\n\npublic interface ITokenService\n{\n    TokenResult Create(Customer customer);\n}"}, {"name": "BankingApp.Application/Handlers/CommandHandlers/Register/RegisterCommand.cs", "lang": "cs", "code": "using BankingApp.Application.Common;\n\nnamespace BankingApp.Application.Handlers.CommandHandlers.Register;\n\npublic class RegisterCommand : Request\n{\n    public string Name { get; init; } = \"\";\n    public string TaxId { get; init; } = \"\";\n    public string Email { get; init; } = \"\";\n    public string Password { get; init; } = \"\";\n}"}, {"name": "BankingApp.Application/Handlers/CommandHandlers/Register/RegisterResult.cs", "lang": "cs", "code": "\nnamespace BankingApp.Application.Handlers.CommandHandlers.Register;\n\npublic class RegisterResult\n{\n    public int CustomerId { get; init; }\n    public string AccountNumber { get; init; } = \"\";\n}"}, {"name": "BankingApp.Application/Handlers/CommandHandlers/Register/RegisterHandler.cs", "lang": "cs", "code": "using BankingApp.Application.Abstractions;\nusing BankingApp.Application.Common;\nusing BankingApp.Domain.Accounts;\nusing BankingApp.Domain.Customers;\n\nnamespace BankingApp.Application.Handlers.CommandHandlers.Register;\n\npublic class RegisterHandler : IHandler<RegisterCommand, RegisterResult>\n{\n    private readonly ICustomerRepository _customers;\n    private readonly IPasswordHasher _hasher;\n\n    public RegisterHandler(ICustomerRepository customers, IPasswordHasher hasher)\n    {\n        _customers = customers;\n        _hasher = hasher;\n    }\n\n    public async Task<Response<RegisterResult>> HandleAsync(RegisterCommand request, CancellationToken ct)\n    {\n        // collect ALL the problems, so the client can fix them in one go\n        var errors = new List<Error>();\n\n        if (request.Password.Length < 8)\n            errors.Add(Error.Validation(\"Password must have at least 8 characters.\"));\n        if (await _customers.ExistsByEmailAsync(request.Email.Trim().ToLowerInvariant(), ct))\n            errors.Add(Error.Conflict(\"Email already registered.\"));\n        if (await _customers.ExistsByTaxIdAsync(request.TaxId, ct))\n            errors.Add(Error.Conflict($\"A customer with tax id {request.TaxId} already exists.\"));\n\n        if (errors.Count > 0)\n            return Response<RegisterResult>.Fail(errors);\n\n        var customer = new Customer(request.Name, request.TaxId, request.Email, _hasher.Hash(request.Password));\n\n        // every customer starts with a first account\n        var number = $\"AC-{Random.Shared.Next(100000, 999999)}\";\n        customer.Accounts.Add(Account.Open(number, customer, 0m, DateOnly.FromDateTime(DateTime.Today)));\n\n        await _customers.AddAsync(customer, ct);\n        await _customers.SaveChangesAsync(ct);\n\n        return Response<RegisterResult>.Ok(new RegisterResult { CustomerId = customer.Id, AccountNumber = number });\n    }\n}"}, {"name": "BankingApp.Application/Handlers/CommandHandlers/Login/LoginCommand.cs", "lang": "cs", "code": "using BankingApp.Application.Common;\n\nnamespace BankingApp.Application.Handlers.CommandHandlers.Login;\n\npublic class LoginCommand : Request\n{\n    public string Email { get; init; } = \"\";\n    public string Password { get; init; } = \"\";\n}"}, {"name": "BankingApp.Application/Handlers/CommandHandlers/Login/LoginResult.cs", "lang": "cs", "code": "\nnamespace BankingApp.Application.Handlers.CommandHandlers.Login;\n\npublic class LoginResult\n{\n    public string AccessToken { get; init; } = \"\";\n    public DateTime ExpiresAtUtc { get; init; }\n}"}, {"name": "BankingApp.Application/Handlers/CommandHandlers/Login/LoginHandler.cs", "lang": "cs", "code": "using BankingApp.Application.Abstractions;\nusing BankingApp.Application.Common;\n\nnamespace BankingApp.Application.Handlers.CommandHandlers.Login;\n\npublic class LoginHandler : IHandler<LoginCommand, LoginResult>\n{\n    private readonly ICustomerRepository _customers;\n    private readonly IPasswordHasher _hasher;\n    private readonly ITokenService _tokens;\n\n    public LoginHandler(ICustomerRepository customers, IPasswordHasher hasher, ITokenService tokens)\n    {\n        _customers = customers;\n        _hasher = hasher;\n        _tokens = tokens;\n    }\n\n    public async Task<Response<LoginResult>> HandleAsync(LoginCommand request, CancellationToken ct)\n    {\n        var customer = await _customers.GetByEmailAsync(request.Email.Trim().ToLowerInvariant(), ct);\n\n        // same error for \"unknown email\" and \"wrong password\": do not reveal which one failed\n        if (customer is null || !_hasher.Verify(customer.PasswordHash, request.Password))\n            return Response<LoginResult>.Fail(Error.Unauthorized(\"Invalid email or password.\"));\n\n        var token = _tokens.Create(customer);\n        return Response<LoginResult>.Ok(new LoginResult { AccessToken = token.AccessToken, ExpiresAtUtc = token.ExpiresAtUtc });\n    }\n}"}, {"name": "BankingApp.Application/Handlers/QueryHandlers/RetrieveDashboard/RetrieveDashboardQuery.cs", "lang": "cs", "code": "using BankingApp.Application.Common;\n\nnamespace BankingApp.Application.Handlers.QueryHandlers.RetrieveDashboard;\n\npublic class RetrieveDashboardQuery : Request\n{\n    public int CustomerId { get; init; }\n}"}, {"name": "BankingApp.Application/Handlers/QueryHandlers/RetrieveDashboard/DashboardAccount.cs", "lang": "cs", "code": "\nnamespace BankingApp.Application.Handlers.QueryHandlers.RetrieveDashboard;\n\npublic class DashboardAccount\n{\n    public string Number { get; init; } = \"\";\n    public decimal Balance { get; init; }\n    public string Status { get; init; } = \"\";\n    public DateOnly Opened { get; init; }\n}"}, {"name": "BankingApp.Application/Handlers/QueryHandlers/RetrieveDashboard/DashboardResult.cs", "lang": "cs", "code": "\nnamespace BankingApp.Application.Handlers.QueryHandlers.RetrieveDashboard;\n\npublic class DashboardResult\n{\n    public string CustomerName { get; init; } = \"\";\n    public string Email { get; init; } = \"\";\n    public decimal TotalBalance { get; init; }\n    public IReadOnlyList<DashboardAccount> Accounts { get; init; } = [];\n}"}, {"name": "BankingApp.Application/Handlers/QueryHandlers/RetrieveDashboard/RetrieveDashboardHandler.cs", "lang": "cs", "code": "using BankingApp.Application.Abstractions;\nusing BankingApp.Application.Common;\nusing BankingApp.Domain.Accounts;\n\nnamespace BankingApp.Application.Handlers.QueryHandlers.RetrieveDashboard;\n\npublic class RetrieveDashboardHandler : IHandler<RetrieveDashboardQuery, DashboardResult>\n{\n    private readonly ICustomerRepository _customers;\n\n    public RetrieveDashboardHandler(ICustomerRepository customers) => _customers = customers;\n\n    public async Task<Response<DashboardResult>> HandleAsync(RetrieveDashboardQuery request, CancellationToken ct)\n    {\n        var customer = await _customers.GetByIdWithAccountsAsync(request.CustomerId, ct);\n        if (customer is null)\n            return Response<DashboardResult>.Fail(Error.NotFound(\"Customer not found.\"));\n\n        var accounts = customer.Accounts\n            .Where(a => a.Status == AccountStatus.Active)\n            .OrderBy(a => a.Number)\n            .Select(a => new DashboardAccount\n            {\n                Number = a.Number,\n                Balance = a.Balance,\n                Status = a.Status.ToString(),\n                Opened = a.Opened\n            })\n            .ToList();\n\n        return Response<DashboardResult>.Ok(new DashboardResult\n        {\n            CustomerName = customer.Name,\n            Email = customer.Email,\n            TotalBalance = accounts.Sum(a => a.Balance),\n            Accounts = accounts\n        });\n    }\n}"}, {"name": "BankingApp.Application/DependencyInjection.cs", "lang": "cs", "code": "using BankingApp.Application.Abstractions;\nusing BankingApp.Application.Handlers.CommandHandlers.Login;\nusing BankingApp.Application.Handlers.CommandHandlers.Register;\nusing BankingApp.Application.Handlers.QueryHandlers.RetrieveDashboard;\nusing Microsoft.Extensions.DependencyInjection;\n\nnamespace BankingApp.Application;\n\npublic static class DependencyInjection\n{\n    public static IServiceCollection AddApplication(this IServiceCollection services)\n    {\n        services.AddScoped<IHandler<RegisterCommand, RegisterResult>, RegisterHandler>();\n        services.AddScoped<IHandler<LoginCommand, LoginResult>, LoginHandler>();\n        services.AddScoped<IHandler<RetrieveDashboardQuery, DashboardResult>, RetrieveDashboardHandler>();\n        return services;\n    }\n}"}]}, {"t": "Infrastructure: token, hash, tabelas e migration", "intro": "As implementações dos contratos novos, a configuração da tabela Accounts e a migration que acrescenta as colunas e a tabela.", "files": [{"name": "BankingApp.Infrastructure/Authentication/JwtOptions.cs", "lang": "cs", "code": "namespace BankingApp.Infrastructure.Authentication;\n\npublic class JwtOptions\n{\n    public string Issuer { get; set; } = \"\";\n    public string Audience { get; set; } = \"\";\n    public string Key { get; set; } = \"\";          // comes from appsettings.json\n    public int ExpiresMinutes { get; set; } = 60;\n}"}, {"name": "BankingApp.Infrastructure/Authentication/JwtTokenService.cs", "lang": "cs", "code": "using System.IdentityModel.Tokens.Jwt;\nusing System.Security.Claims;\nusing System.Text;\nusing BankingApp.Application.Abstractions;\nusing BankingApp.Domain.Customers;\nusing Microsoft.Extensions.Options;\nusing Microsoft.IdentityModel.Tokens;\n\nnamespace BankingApp.Infrastructure.Authentication;\n\npublic class JwtTokenService : ITokenService\n{\n    private readonly JwtOptions _options;\n\n    public JwtTokenService(IOptions<JwtOptions> options) => _options = options.Value;\n\n    public TokenResult Create(Customer customer)\n    {\n        var claims = new[]\n        {\n            new Claim(JwtRegisteredClaimNames.Sub, customer.Id.ToString()),\n            new Claim(JwtRegisteredClaimNames.Email, customer.Email),\n            new Claim(\"name\", customer.Name)\n        };\n\n        var key = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(_options.Key));\n        var expires = DateTime.UtcNow.AddMinutes(_options.ExpiresMinutes);\n\n        var token = new JwtSecurityToken(\n            issuer: _options.Issuer,\n            audience: _options.Audience,\n            claims: claims,\n            expires: expires,\n            signingCredentials: new SigningCredentials(key, SecurityAlgorithms.HmacSha256));\n\n        return new TokenResult\n        {\n            AccessToken = new JwtSecurityTokenHandler().WriteToken(token),\n            ExpiresAtUtc = expires\n        };\n    }\n}"}, {"name": "BankingApp.Infrastructure/Authentication/PasswordHasherService.cs", "lang": "cs", "code": "using BankingApp.Application.Abstractions;\nusing Microsoft.AspNetCore.Identity;\n\nnamespace BankingApp.Infrastructure.Authentication;\n\n// uses the hasher from ASP.NET Core Identity (salted, slow on purpose), without the rest of Identity\npublic class PasswordHasherService : IPasswordHasher\n{\n    private readonly PasswordHasher<object> _hasher = new();\n\n    public string Hash(string password)\n        => _hasher.HashPassword(null!, password);\n\n    public bool Verify(string hash, string password)\n        => _hasher.VerifyHashedPassword(null!, hash, password) != PasswordVerificationResult.Failed;\n}"}, {"name": "BankingApp.Infrastructure/Persistence/Configurations/CustomerConfiguration.cs", "lang": "cs", "code": "using BankingApp.Domain.Customers;\nusing Microsoft.EntityFrameworkCore;\nusing Microsoft.EntityFrameworkCore.Metadata.Builders;\n\nnamespace BankingApp.Infrastructure.Persistence.Configurations;\n\npublic class CustomerConfiguration : IEntityTypeConfiguration<Customer>\n{\n    public void Configure(EntityTypeBuilder<Customer> builder)\n    {\n        builder.Property(c => c.Name).HasMaxLength(100).IsRequired();\n        builder.Property(c => c.TaxId).HasMaxLength(9).IsRequired();\n        builder.Property(c => c.Email).HasMaxLength(200).IsRequired();\n        builder.Property(c => c.PasswordHash).HasMaxLength(500).IsRequired();\n        builder.HasIndex(c => c.TaxId).IsUnique();\n        builder.HasIndex(c => c.Email).IsUnique();\n    }\n}"}, {"name": "BankingApp.Infrastructure/Persistence/Configurations/AccountConfiguration.cs", "lang": "cs", "code": "using BankingApp.Domain.Accounts;\nusing Microsoft.EntityFrameworkCore;\nusing Microsoft.EntityFrameworkCore.Metadata.Builders;\n\nnamespace BankingApp.Infrastructure.Persistence.Configurations;\n\npublic class AccountConfiguration : IEntityTypeConfiguration<Account>\n{\n    public void Configure(EntityTypeBuilder<Account> builder)\n    {\n        builder.Property(a => a.Number).HasMaxLength(20).IsRequired();\n        builder.HasIndex(a => a.Number).IsUnique();\n        builder.Property(a => a.Balance).HasPrecision(18, 2);\n        builder.Property(a => a.Status).HasConversion<string>().HasMaxLength(20);\n\n        builder.HasOne(a => a.Customer)\n               .WithMany(c => c.Accounts)\n               .HasForeignKey(a => a.CustomerId);\n    }\n}"}, {"name": "BankingApp.Infrastructure/Persistence/BankingAppContext.cs", "lang": "cs", "code": "using BankingApp.Domain.Accounts;\nusing BankingApp.Domain.Customers;\nusing Microsoft.EntityFrameworkCore;\n\nnamespace BankingApp.Infrastructure.Persistence;\n\npublic class BankingAppContext : DbContext\n{\n    public BankingAppContext(DbContextOptions<BankingAppContext> options) : base(options) { }\n\n    public DbSet<Customer> Customers => Set<Customer>();\n    public DbSet<Account> Accounts => Set<Account>();\n\n    protected override void OnModelCreating(ModelBuilder modelBuilder)\n        => modelBuilder.ApplyConfigurationsFromAssembly(typeof(BankingAppContext).Assembly);\n}"}, {"name": "BankingApp.Infrastructure/Repositories/CustomerRepository.cs", "lang": "cs", "code": "using BankingApp.Application.Abstractions;\nusing BankingApp.Domain.Customers;\nusing BankingApp.Infrastructure.Persistence;\nusing Microsoft.EntityFrameworkCore;\n\nnamespace BankingApp.Infrastructure.Repositories;\n\npublic class CustomerRepository : ICustomerRepository\n{\n    private readonly BankingAppContext _db;\n\n    public CustomerRepository(BankingAppContext db) => _db = db;\n\n    public Task<bool> ExistsByEmailAsync(string email, CancellationToken ct)\n        => _db.Customers.AnyAsync(c => c.Email == email, ct);\n\n    public Task<bool> ExistsByTaxIdAsync(string taxId, CancellationToken ct)\n        => _db.Customers.AnyAsync(c => c.TaxId == taxId, ct);\n\n    public Task<Customer?> GetByEmailAsync(string email, CancellationToken ct)\n        => _db.Customers.FirstOrDefaultAsync(c => c.Email == email, ct);\n\n    public Task<Customer?> GetByIdWithAccountsAsync(int id, CancellationToken ct)\n        => _db.Customers.Include(c => c.Accounts)\n                        .AsNoTracking()\n                        .FirstOrDefaultAsync(c => c.Id == id, ct);\n\n    public async Task AddAsync(Customer customer, CancellationToken ct)\n        => await _db.Customers.AddAsync(customer, ct);\n\n    public Task SaveChangesAsync(CancellationToken ct)\n        => _db.SaveChangesAsync(ct);\n}"}, {"name": "BankingApp.Infrastructure/DependencyInjection.cs", "lang": "cs", "code": "using BankingApp.Application.Abstractions;\nusing BankingApp.Infrastructure.Authentication;\nusing BankingApp.Infrastructure.Persistence;\nusing BankingApp.Infrastructure.Repositories;\nusing Microsoft.EntityFrameworkCore;\nusing Microsoft.Extensions.Configuration;\nusing Microsoft.Extensions.DependencyInjection;\n\nnamespace BankingApp.Infrastructure;\n\npublic static class DependencyInjection\n{\n    public static IServiceCollection AddInfrastructure(\n        this IServiceCollection services, IConfiguration configuration)\n    {\n        services.AddDbContext<BankingAppContext>(options =>\n            options.UseSqlServer(configuration.GetConnectionString(\"BankingApp\")));\n\n        services.Configure<JwtOptions>(configuration.GetSection(\"Jwt\"));\n\n        services.AddScoped<ICustomerRepository, CustomerRepository>();\n        services.AddSingleton<IPasswordHasher, PasswordHasherService>();\n        services.AddScoped<ITokenService, JwtTokenService>();\n        return services;\n    }\n}"}, {"name": "Terminal (migrations)", "lang": "sh", "code": "# if you created test customers in step 1, start clean (they have no email):\ndotnet ef database drop -f -p src/BankingApp.Infrastructure -s src/BankingApp.Api\n\ndotnet ef migrations add AddCredentialsAndAccounts -p src/BankingApp.Infrastructure -s src/BankingApp.Api -o Persistence/Migrations\ndotnet ef database update                          -p src/BankingApp.Infrastructure -s src/BankingApp.Api"}], "check": "Applying migration '20261104100000_AddCredentialsAndAccounts'.\nDone."}, {"t": "Api: métodos anónimos e método autenticado", "intro": "Register e Login têm [AllowAnonymous]. O RetrieveDashboard está num controller com [Authorize]: sem token válido, a API continua a responder 200, mas com success false e o erro unauthorized (é para isso que serve o RpcJwtBearerEvents). O id do cliente vem do token.", "steps": ["Criar os DTOs de Register, Login e Dashboard", "Criar o AuthController com Register e Login anónimos", "Criar o DashboardController com RetrieveDashboard autenticado", "Criar o RpcJwtBearerEvents e atualizar o Program.cs", "Apagar o CustomersController"], "files": [{"name": "BankingApp.Api/Contracts/Auth/RegisterRequest.cs", "lang": "cs", "code": "using System.ComponentModel.DataAnnotations;\n\nnamespace BankingApp.Api.Contracts.Auth;\n\npublic class RegisterRequest\n{\n    [Required, StringLength(100)]\n    public string Name { get; set; } = \"\";\n\n    [Required, RegularExpression(@\"^\\d{9}$\")]\n    public string TaxId { get; set; } = \"\";\n\n    [Required, EmailAddress]\n    public string Email { get; set; } = \"\";\n\n    [Required, MinLength(8)]\n    public string Password { get; set; } = \"\";\n}"}, {"name": "BankingApp.Api/Contracts/Auth/RegisterResponse.cs", "lang": "cs", "code": "using BankingApp.Application.Handlers.CommandHandlers.Register;\n\n\nnamespace BankingApp.Api.Contracts.Auth;\n\npublic class RegisterResponse\n{\n    public int CustomerId { get; init; }\n    public string AccountNumber { get; init; } = \"\";\n\n    public static RegisterResponse From(RegisterResult result) => new()\n    {\n        CustomerId = result.CustomerId,\n        AccountNumber = result.AccountNumber\n    };\n}"}, {"name": "BankingApp.Api/Contracts/Auth/LoginRequest.cs", "lang": "cs", "code": "using System.ComponentModel.DataAnnotations;\n\nnamespace BankingApp.Api.Contracts.Auth;\n\npublic class LoginRequest\n{\n    [Required, EmailAddress]\n    public string Email { get; set; } = \"\";\n\n    [Required]\n    public string Password { get; set; } = \"\";\n}"}, {"name": "BankingApp.Api/Contracts/Auth/LoginResponse.cs", "lang": "cs", "code": "using BankingApp.Application.Handlers.CommandHandlers.Login;\n\n\nnamespace BankingApp.Api.Contracts.Auth;\n\npublic class LoginResponse\n{\n    public string AccessToken { get; init; } = \"\";\n    public DateTime ExpiresAtUtc { get; init; }\n\n    public static LoginResponse From(LoginResult result) => new()\n    {\n        AccessToken = result.AccessToken,\n        ExpiresAtUtc = result.ExpiresAtUtc\n    };\n}"}, {"name": "BankingApp.Api/Contracts/Dashboard/DashboardAccountResponse.cs", "lang": "cs", "code": "using BankingApp.Application.Handlers.QueryHandlers.RetrieveDashboard;\n\n\nnamespace BankingApp.Api.Contracts.Dashboard;\n\npublic class DashboardAccountResponse\n{\n    public string Number { get; init; } = \"\";\n    public decimal Balance { get; init; }\n    public string Status { get; init; } = \"\";\n    public DateOnly Opened { get; init; }\n\n    public static DashboardAccountResponse From(DashboardAccount account) => new()\n    {\n        Number = account.Number,\n        Balance = account.Balance,\n        Status = account.Status,\n        Opened = account.Opened\n    };\n}"}, {"name": "BankingApp.Api/Contracts/Dashboard/DashboardResponse.cs", "lang": "cs", "code": "using BankingApp.Application.Handlers.QueryHandlers.RetrieveDashboard;\n\n\nnamespace BankingApp.Api.Contracts.Dashboard;\n\npublic class DashboardResponse\n{\n    public string CustomerName { get; init; } = \"\";\n    public string Email { get; init; } = \"\";\n    public decimal TotalBalance { get; init; }\n    public IReadOnlyList<DashboardAccountResponse> Accounts { get; init; } = [];\n\n    public static DashboardResponse From(DashboardResult result) => new()\n    {\n        CustomerName = result.CustomerName,\n        Email = result.Email,\n        TotalBalance = result.TotalBalance,\n        Accounts = result.Accounts.Select(DashboardAccountResponse.From).ToList()\n    };\n}"}, {"name": "BankingApp.Api/Controllers/AuthController.cs", "lang": "cs", "code": "using BankingApp.Api.Contracts.Auth;\nusing BankingApp.Application.Abstractions;\nusing BankingApp.Application.Common;\nusing BankingApp.Application.Handlers.CommandHandlers.Login;\nusing BankingApp.Application.Handlers.CommandHandlers.Register;\nusing Microsoft.AspNetCore.Authorization;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace BankingApp.Api.Controllers;\n\n[ApiController]\n[Route(\"api/auth\")]\npublic class AuthController : ControllerBase\n{\n    private readonly IHandler<RegisterCommand, RegisterResult> _register;\n    private readonly IHandler<LoginCommand, LoginResult> _login;\n\n    public AuthController(\n        IHandler<RegisterCommand, RegisterResult> register,\n        IHandler<LoginCommand, LoginResult> login)\n    {\n        _register = register;\n        _login = login;\n    }\n\n    [AllowAnonymous]\n    [HttpPost(\"register\")]\n    public async Task<Response<RegisterResponse>> Register(RegisterRequest body, CancellationToken ct)\n    {\n        var result = await _register.HandleAsync(\n            new RegisterCommand { Name = body.Name, TaxId = body.TaxId, Email = body.Email, Password = body.Password }, ct);\n\n        return result.Map(RegisterResponse.From);\n    }\n\n    [AllowAnonymous]\n    [HttpPost(\"login\")]\n    public async Task<Response<LoginResponse>> Login(LoginRequest body, CancellationToken ct)\n    {\n        var result = await _login.HandleAsync(new LoginCommand { Email = body.Email, Password = body.Password }, ct);\n        return result.Map(LoginResponse.From);\n    }\n}"}, {"name": "BankingApp.Api/Controllers/DashboardController.cs", "lang": "cs", "code": "using System.IdentityModel.Tokens.Jwt;\nusing System.Security.Claims;\nusing BankingApp.Api.Contracts.Dashboard;\nusing BankingApp.Application.Abstractions;\nusing BankingApp.Application.Common;\nusing BankingApp.Application.Handlers.QueryHandlers.RetrieveDashboard;\nusing Microsoft.AspNetCore.Authorization;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace BankingApp.Api.Controllers;\n\n[ApiController]\n[Route(\"api/dashboard\")]\n[Authorize]                                   // every method here requires a valid token\npublic class DashboardController : ControllerBase\n{\n    private readonly IHandler<RetrieveDashboardQuery, DashboardResult> _handler;\n\n    public DashboardController(IHandler<RetrieveDashboardQuery, DashboardResult> handler) => _handler = handler;\n\n    [HttpPost(\"retrieve\")]\n    public async Task<Response<DashboardResponse>> RetrieveDashboard(CancellationToken ct)\n    {\n        // the customer id comes from the token, never from the request\n        var customerId = int.Parse(User.FindFirstValue(JwtRegisteredClaimNames.Sub)!);\n\n        var result = await _handler.HandleAsync(new RetrieveDashboardQuery { CustomerId = customerId }, ct);\n        return result.Map(DashboardResponse.From);\n    }\n}"}, {"name": "BankingApp.Api/Authentication/RpcJwtBearerEvents.cs", "lang": "cs", "code": "using BankingApp.Application.Common;\nusing Microsoft.AspNetCore.Authentication.JwtBearer;\n\nnamespace BankingApp.Api.Authentication;\n\n// RPC: even \"no token\" and \"no permission\" answer 200, with the error in the body\npublic class RpcJwtBearerEvents : JwtBearerEvents\n{\n    public RpcJwtBearerEvents()\n    {\n        OnChallenge = context =>\n        {\n            context.HandleResponse();               // skip the default 401\n            return Write(context.HttpContext, Error.Unauthorized(\"Missing or invalid token.\"));\n        };\n\n        OnForbidden = context =>\n            Write(context.HttpContext, Error.Forbidden(\"You do not have permission for this operation.\"));\n    }\n\n    private static Task Write(HttpContext http, Error error)\n    {\n        http.Response.StatusCode = StatusCodes.Status200OK;\n        return http.Response.WriteAsJsonAsync(Response<object>.Fail(error));\n    }\n}"}, {"name": "BankingApp.Api/Program.cs", "lang": "cs", "code": "using System.Text;\nusing BankingApp.Api.Authentication;\nusing BankingApp.Api.Middleware;\nusing BankingApp.Api.Responses;\nusing BankingApp.Application;\nusing BankingApp.Infrastructure;\nusing BankingApp.Infrastructure.Authentication;\nusing Microsoft.AspNetCore.Authentication.JwtBearer;\nusing Microsoft.IdentityModel.Tokens;\n\nvar builder = WebApplication.CreateBuilder(args);\n\nbuilder.Services.AddControllers()\n    .ConfigureApiBehaviorOptions(o =>\n        o.InvalidModelStateResponseFactory = ValidationResponse.Create);\nbuilder.Services.AddOpenApi();\nbuilder.Services.AddApplication();\nbuilder.Services.AddInfrastructure(builder.Configuration);\n\n// JWT bearer: the API validates the token that the client sends in the Authorization header\nvar jwt = builder.Configuration.GetSection(\"Jwt\").Get<JwtOptions>()\n          ?? throw new InvalidOperationException(\"Missing Jwt configuration.\");\n\nbuilder.Services\n    .AddAuthentication(JwtBearerDefaults.AuthenticationScheme)\n    .AddJwtBearer(options =>\n    {\n        options.Events = new RpcJwtBearerEvents();   // 401/403 become 200 + error\n        options.MapInboundClaims = false;    // keep the claim called \"sub\" as \"sub\"\n        options.TokenValidationParameters = new TokenValidationParameters\n        {\n            ValidateIssuer = true,\n            ValidIssuer = jwt.Issuer,\n            ValidateAudience = true,\n            ValidAudience = jwt.Audience,\n            ValidateIssuerSigningKey = true,\n            IssuerSigningKey = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(jwt.Key)),\n            ValidateLifetime = true,\n            ClockSkew = TimeSpan.Zero\n        };\n    });\nbuilder.Services.AddAuthorization();\n\nvar app = builder.Build();\n\napp.UseMiddleware<ExceptionMiddleware>();\n\nif (app.Environment.IsDevelopment())\n{\n    app.MapOpenApi();\n    app.UseSwaggerUI(o => o.SwaggerEndpoint(\"/openapi/v1.json\", \"v1\"));\n}\n\napp.UseHttpsRedirection();\napp.UseAuthentication();                     // 1. who are you? (reads the token)\napp.UseAuthorization();                      // 2. can you do this? ([Authorize])\napp.MapControllers();\n\napp.Run();"}]}, {"t": "Bruno: configurar o Authorize passo a passo", "intro": "O Bruno guarda a coleção em ficheiros de texto (.bru), que podes pôr no repositório, em docs/bruno. O fluxo é fazer Login, guardar o token numa variável e usá-lo como Bearer Token.", "bruno": [{"t": "Instalar e criar a coleção", "d": "Instala o Bruno (usebruno.com). Em Collections escolhe Create Collection, dá-lhe o nome BankingApp e guarda-a numa pasta do repositório, por exemplo docs/bruno."}, {"t": "Criar o ambiente Local", "d": "No canto superior direito, abre o seletor de ambientes e escolhe Configure. Cria o ambiente Local com a variável baseUrl, com o endereço https com que a Api arranca (está no launchSettings.json). Depois seleciona o ambiente Local."}, {"t": "Pedido Register (anónimo)", "d": "New Request, método POST, URL {{baseUrl}}/api/auth/register. No separador Body escolhe JSON e escreve o corpo. O separador Auth fica em No Auth. Envia: esperas HTTP 200 com success true."}, {"t": "Pedido Login e guardar o token", "d": "Novo pedido POST {{baseUrl}}/api/auth/login com email e password. No separador Vars, secção Post Response, acrescenta a variável token com o valor res.body.data.accessToken (o token vem dentro de data). Cada vez que fizeres Login, o token novo fica guardado."}, {"t": "Pedido RetrieveDashboard (autenticado)", "d": "Novo pedido POST {{baseUrl}}/api/dashboard/retrieve, com o corpo JSON {}. No separador Auth escolhe Bearer Token e escreve {{token}} no campo Token. O Bruno envia o cabeçalho Authorization: Bearer <token>."}, {"t": "Experimentar os dois resultados", "d": "Corre o Login e depois o RetrieveDashboard: esperas success true com as contas em data. Muda o Auth do RetrieveDashboard para No Auth e envia outra vez: continua a ser HTTP 200, mas com success false e o erro unauthorized. Isso prova que o [Authorize] está a funcionar."}, {"t": "Se der erro de certificado", "d": "Em desenvolvimento, o certificado HTTPS é local. Na primeira execução o IDE pergunta se queres confiar nele: aceita. Se o Bruno continuar a recusar, desativa a verificação do certificado SSL nas preferências (só em desenvolvimento)."}, {"t": "Opcional: autenticação ao nível da coleção", "d": "Nas definições da coleção, separador Auth, escolhe Bearer Token com {{token}}. Nos pedidos que precisam de token, põe o modo Inherit. Evita repetir a configuração em cada pedido."}], "files": [{"name": "docs/bruno/BankingApp/bruno.json", "lang": "bru", "code": "{\n  \"version\": \"1\",\n  \"name\": \"BankingApp\",\n  \"type\": \"collection\"\n}"}, {"name": "docs/bruno/BankingApp/environments/Local.bru", "lang": "bru", "code": "vars {\n  baseUrl: https://localhost:5001\n}"}, {"name": "docs/bruno/BankingApp/Register.bru", "lang": "bru", "code": "meta {\n  name: Register\n  type: http\n  seq: 1\n}\n\npost {\n  url: {{baseUrl}}/api/auth/register\n  body: json\n  auth: none\n}\n\nbody:json {\n  {\n    \"name\": \"Ana Pereira\",\n    \"taxId\": \"123456789\",\n    \"email\": \"ana@example.com\",\n    \"password\": \"Passw0rd!\"\n  }\n}"}, {"name": "docs/bruno/BankingApp/Login.bru", "lang": "bru", "code": "meta {\n  name: Login\n  type: http\n  seq: 2\n}\n\npost {\n  url: {{baseUrl}}/api/auth/login\n  body: json\n  auth: none\n}\n\nbody:json {\n  {\n    \"email\": \"ana@example.com\",\n    \"password\": \"Passw0rd!\"\n  }\n}\n\nvars:post-response {\n  token: res.body.data.accessToken\n}"}, {"name": "docs/bruno/BankingApp/RetrieveDashboard.bru", "lang": "bru", "code": "meta {\n  name: RetrieveDashboard\n  type: http\n  seq: 3\n}\n\npost {\n  url: {{baseUrl}}/api/dashboard/retrieve\n  body: json\n  auth: bearer\n}\n\nbody:json {\n  {}\n}\n\nauth:bearer {\n  token: {{token}}\n}"}]}, {"t": "Testes aos handlers de autenticação", "intro": "Os handlers dependem de interfaces, por isso testam-se com mocks: sem base de dados e sem gerar tokens reais.", "files": [{"name": "BankingApp.Tests/Application/LoginHandlerTests.cs", "lang": "cs", "code": "using BankingApp.Application.Abstractions;\nusing BankingApp.Application.Handlers.CommandHandlers.Login;\nusing BankingApp.Domain.Customers;\nusing NSubstitute;\n\nnamespace BankingApp.Tests.Application;\n\npublic class LoginHandlerTests\n{\n    private readonly ICustomerRepository _customers = Substitute.For<ICustomerRepository>();\n    private readonly IPasswordHasher _hasher = Substitute.For<IPasswordHasher>();\n    private readonly ITokenService _tokens = Substitute.For<ITokenService>();\n    private readonly LoginHandler _handler;\n\n    public LoginHandlerTests()\n        => _handler = new LoginHandler(_customers, _hasher, _tokens);\n\n    [Fact]\n    public async Task HandleAsync_WrongPassword_ReturnsUnauthorizedError()\n    {\n        var customer = new Customer(\"Ana Pereira\", \"123456789\", \"ana@example.com\", \"hash\");\n        _customers.GetByEmailAsync(\"ana@example.com\", Arg.Any<CancellationToken>()).Returns(customer);\n        _hasher.Verify(\"hash\", \"wrong\").Returns(false);\n\n        var response = await _handler.HandleAsync(new LoginCommand { Email = \"ana@example.com\", Password = \"wrong\" }, CancellationToken.None);\n\n        Assert.False(response.Success);\n        Assert.Equal(\"unauthorized\", Assert.Single(response.Errors).Code);\n        _tokens.DidNotReceive().Create(Arg.Any<Customer>());\n    }\n\n    [Fact]\n    public async Task HandleAsync_ValidCredentials_ReturnsToken()\n    {\n        var customer = new Customer(\"Ana Pereira\", \"123456789\", \"ana@example.com\", \"hash\");\n        _customers.GetByEmailAsync(\"ana@example.com\", Arg.Any<CancellationToken>()).Returns(customer);\n        _hasher.Verify(\"hash\", \"Passw0rd!\").Returns(true);\n        _tokens.Create(customer).Returns(new TokenResult { AccessToken = \"token-value\", ExpiresAtUtc = DateTime.UtcNow.AddHours(1) });\n\n        var response = await _handler.HandleAsync(new LoginCommand { Email = \"ana@example.com\", Password = \"Passw0rd!\" }, CancellationToken.None);\n\n        Assert.True(response.Success);\n        Assert.Equal(\"token-value\", response.Data!.AccessToken);\n    }\n}"}], "check": "Test Explorer\n9 passed, 0 failed, 0 skipped"}, {"t": "Verificar", "intro": "Confirma os cinco casos antes de avançares.", "steps": ["POST /api/auth/register válido: success true com o número da primeira conta", "Repetir o Register com o mesmo email e NIF: success false com dois erros conflict", "POST /api/auth/login com password errada: success false, erro unauthorized", "POST /api/dashboard/retrieve sem token: success false, erro unauthorized (e HTTP 200)", "POST /api/dashboard/retrieve com o token do Login: success true com uma conta e saldo 0"], "check": "register         -> success: true\nregister repetido -> success: false  [conflict, conflict]\nlogin errado     -> success: false  [unauthorized]\ndashboard s/ token -> success: false [unauthorized]\ndashboard c/ token -> success: true\n(todos com HTTP 200)"}], "more": {"more": "Este passo aplica, na BankingApp, o que fizeste no AuthLab. O JWT (JSON Web Token) é o formato do token; o esquema Bearer, usado no cabeçalho Authorization, é a forma de o enviar. A própria API emite o token, em vez de um servidor de identidade externo. Num banco real usar-se-ia um servidor de identidade; aqui aprendes a base.\n\nA password nunca é guardada: guarda-se o hash. O token só prova quem és até expirar (ExpiresMinutes), por isso é curto.", "pit": "Usar a chave de formação num projeto real. Quem tiver a chave consegue fabricar tokens válidos para qualquer cliente, por isso em produção ela vem de um cofre ou de uma variável de ambiente.", "tryit": "Copia o token do Login para jwt.io e vê os claims. Percebe porque nunca se põem segredos no payload."}}, {"id": "p3", "day": "Dias 2 a 5", "kind": "brief", "title": "Enunciado: funcionalidades", "goal": "O catálogo de funcionalidades que o banco quer. São mais do que consegues fazer: decide o que entra no teu plano.", "uses": ["dotnet-2", "dotnet-4", "dotnet-5", "auth-6"], "rules": ["Há mais funcionalidades do que tempo. Não as tentes fazer todas: lê o enunciado até ao fim, estima e escolhe (Introdução ao Projeto Final).", "Cada funcionalidade segue a mesma receita: regra no domain, caso de uso na application, repositório e migration na infrastructure, controller e dtos na api, testes e pedido no Bruno.", "Todos os pedidos são POST, com os parâmetros no corpo JSON (RPC). O id do cliente vem sempre do token, nunca do pedido. Dinheiro é decimal com precisão (18,2) e as datas guardam-se em UTC.", "A API é RPC: responde sempre HTTP 200 e o resultado vai no Response (success, data, errors). Os erros esperados devolvem-se com Error.NotFound, Error.Conflict, etc.; os erros de regras do Domain lançam DomainException.", "Convenção do projeto: tudo são classes (sem records), uma classe por ficheiro e uma responsabilidade por classe.", "Uma funcionalidade só está pronta com testes e um pedido na coleção do Bruno.", "Se ficares bloqueado, abre o «Saber mais» da funcionalidade: tem uma pista de abordagem, sem a solução."], "features": [{"id": "F1", "t": "Abrir conta adicional", "story": "Como cliente autenticado, quero abrir uma conta nova para separar o meu dinheiro.", "endpoint": "POST /api/accounts/open", "body": "{ \"initialDeposit\": 100.00 }", "rules": ["O número da conta é gerado pelo sistema e é único", "O depósito inicial não pode ser negativo", "Um cliente tem no máximo 5 contas ativas", "O cliente vem do token, nunca do corpo do pedido"], "responses": [["success", "Conta criada, com o número da conta nova em data"], ["validation", "Depósito inicial negativo"], ["unauthorized", "Sem token válido"], ["conflict", "Já tem 5 contas ativas"]], "criteria": ["A regra das 5 contas está no Domain ou no handler, e sei explicar porquê", "A resposta traz o número da conta criada", "Há testes ao limite (4, 5 e 6 contas)", "O pedido está na coleção do Bruno"], "uses": ["dotnet-6", "csharp-2"], "hint": {"more": "Pensa onde vive a regra «máximo de 5 contas». Se está no Customer (por exemplo, um método OpenAccount), o Domain protege-se a si próprio. Se está no handler, tens de repetir a verificação em todos os sítios que abram contas.", "tryit": "Escreve primeiro o teste que falha com a sexta conta e só depois a implementação."}, "valor": "Alto", "deps": "", "us": {"persona": "cliente autenticado", "quero": "abrir uma conta adicional", "para": "separar o meu dinheiro por objetivos", "desc": "O cliente pode ter várias contas no mesmo banco, por exemplo uma para despesas correntes e outra para poupança. O número da conta é gerado pelo sistema e o titular é sempre o cliente do token.", "sc": [["Abrir conta com depósito inicial", ["tenho 2 contas ativas"], ["peço uma nova conta com depósito inicial de 100,00"], ["recebo success com o número da nova conta", "a conta fica com saldo 100,00 e estado Active"]], ["Depósito inicial negativo", ["tenho sessão iniciada"], ["peço uma conta com depósito inicial de -1"], ["recebo validation com o erro no campo do valor", "nenhuma conta é criada"]], ["Limite de contas atingido", ["tenho 5 contas ativas"], ["peço uma nova conta"], ["recebo conflict", "continuo com 5 contas"]], ["Pedido sem token", ["não enviei o token JWT"], ["peço uma nova conta"], ["recebo unauthorized"]]], "fora": ["Tipos de conta (ordem, poupança, a prazo)", "Contas com mais do que um titular"], "sp": 3}, "epic": "E1"}, {"id": "F2", "t": "Consultar contas", "story": "Como cliente, quero ver as minhas contas e o detalhe de cada uma.", "endpoint": "POST /api/accounts/list  ·  POST /api/accounts/get", "body": "{ \"status\": \"Active\" }", "rules": ["Só devolve contas do cliente autenticado", "Uma conta de outro cliente responde not_found, igual a uma conta inexistente", "Filtro opcional status (Active ou Closed), enviado no corpo", "O detalhe (get) recebe o número da conta no corpo: { \"number\": \"AC-123456\" }", "Ordenado por número"], "responses": [["success", "Lista ou detalhe da conta"], ["unauthorized", "Sem token válido"], ["not_found", "A conta não existe ou não é do cliente"]], "criteria": ["Não é possível ver contas de outro cliente (testado)", "O filtro por estado é feito na base de dados, não em memória", "Usa AsNoTracking nas consultas", "Os pedidos estão na coleção do Bruno"], "uses": ["dotnet-4", "csharp-3"], "hint": {"more": "Responder not_found em vez de forbidden para contas de outros clientes evita revelar que o número existe. O filtro construído com IQueryable só vai à base de dados no fim, por isso podes acrescentar o Where apenas quando o parâmetro vier preenchido.", "pit": "Chamar ToList antes do Where traz todas as contas de todos os clientes para memória."}, "valor": "Alto", "deps": "F1", "us": {"persona": "cliente autenticado", "quero": "ver as minhas contas e o detalhe de cada uma", "para": "saber quanto tenho e onde", "desc": "Listagem das contas do cliente, com filtro opcional por estado, e consulta do detalhe de uma conta pelo número. Uma conta que não é do cliente é indistinguível de uma conta que não existe.", "sc": [["Listar as minhas contas", ["tenho 3 contas, uma delas fechada"], ["peço a lista de contas"], ["recebo success com as 3 contas ordenadas por número"]], ["Filtrar por estado", ["tenho 3 contas, uma delas fechada"], ["peço a lista com o filtro status Active"], ["recebo apenas as 2 contas ativas"]], ["Conta de outro cliente", ["a conta 123 pertence a outro cliente"], ["peço o detalhe da conta 123"], ["recebo not_found, igual a uma conta inexistente"]]], "fora": ["Pesquisa por texto", "Paginação da lista de contas"], "sp": 2}, "epic": "E1"}, {"id": "F3", "t": "Fechar conta", "story": "Como cliente, quero fechar uma conta que já não uso.", "endpoint": "POST /api/accounts/close", "body": "{ \"number\": \"AC-123456\" }", "rules": ["Só se o saldo for zero", "Uma conta já fechada não pode voltar a ser fechada", "Fechar não apaga: o estado passa a Closed", "Não pode fechar a última conta ativa"], "responses": [["success", "Conta fechada"], ["unauthorized", "Sem token válido"], ["not_found", "A conta não existe ou não é do cliente"], ["conflict", "Saldo diferente de zero, já fechada ou última conta ativa"]], "criteria": ["A mudança de estado é um método da entidade Account", "Cada uma das três regras tem um teste", "O dashboard deixa de mostrar a conta fechada", "O pedido está na coleção do Bruno"], "uses": ["csharp-2", "dotnet-6"], "hint": {"more": "O estado só deve mudar por um método da própria Account (por exemplo, Close), que valida as regras. Assim, nenhum handler consegue fechar uma conta com saldo."}, "valor": "Médio", "deps": "F1", "us": {"persona": "cliente autenticado", "quero": "fechar uma conta que já não uso", "para": "manter apenas as contas de que preciso", "desc": "Fechar não apaga a conta: o estado passa a Closed e o histórico mantém-se. Só é possível com saldo zero e nunca deixa o cliente sem contas ativas.", "sc": [["Fechar conta sem saldo", ["tenho 2 contas ativas e a conta A tem saldo 0"], ["fecho a conta A"], ["recebo iciente, limite diário ou conta fechada"]], "criteria": ["Os dois movimentos e os dois saldos mudam na mesma gravação", "Há um teste que prova que, se a regra falha, nenhum saldo muda", "O destino inexistente devolve o erro not_found", "O pedido está na coleção do Bruno"], "uses": ["dotnet-4", "dotnet-6"], "hint": {"more": "O SaveChangesAsync grava tudo o que o DbContext está a acompanhar numa única transação. Se carregares as duas contas e alterares os dois saldos antes de gravar, ou grava tudo ou não grava nada. Reutiliza os métodos de depósito e levantamento das entidades.", "pit": "Gravar a origem e depois o destino em chamadas separadas. Se a segunda falhar, o dinheiro desaparece."}, "valor": "Alto", "deps": "F5", "us": {"persona": "cliente autenticado", "quero": "transferir dinheiro de uma das minhas contas para outra conta do banco", "para": "pagar a outras pessoas e mover dinheiro entre as minhas contas", "desc": "Uma transferência é uma operação atómica: debita a origem, credita o destino e cria duas Transaction. Se qualquer regra falhar, nenhum saldo muda.", "sc": [["Transferência válida", ["a conta A tem 200,00 e a conta B tem 0"], ["transfiro 50,00 da A para a B"], ["recebo success", "A fica com 150,00 e B com 50,00", "ficam duas Transaction (saída e entrada)"]], ["Origem igual ao destino", ["tenho sessão iniciada"], ["transfiro da conta A para a conta A"], ["recebo validation"]], ["Destino inexistente", ["o número de destino não existe"], ["peço a transferência"], ["recebo not_found", "nenhum saldo muda"]], ["Falha a meio", ["a origem não tem saldo suficiente"], ["peço a transferência"], ["recebo conflict", "nenhum saldo nem Transaction foram gravados"]]], "fora": ["Transferências para outros bancos", "Transferências agendadas"], "sp": 5}, "epic": "E2"}, {"id": "F8", "t": "Cancelar transferência", "story": "Como cliente, quero cancelar uma transferência que fiz por engano.", "endpoint": "POST /api/transfers/reverse", "body": "{ \"transferId\": 17 }", "r édio", "deps": "F5", "us": {"persona": "cliente autenticado", "quero": "pagar uma fatura com a entidade e a referência", "para": "pagar serviços sem sair da aplicação", "desc": "O pagamento segue as regras do levantamento (saldo, conta ativa, limite diário) e regista a entidade e a referência no movimento Payment.", "sc": [["Pagamento válido", ["a conta A tem saldo suficiente"], ["pago a entidade de 5 dígitos com a referência de 9 dígitos"], ["recebo success", "fica uma Transaction do tipo Payment com a entidade e a referência"]], ["Formato inválido", ["tenho sessão iniciada"], ["envio uma entidade com 4 dígitos"], ["recebo validation"]], ["Fatura já paga", ["já paguei esta entidade e referência"], ["pago de novo"], ["recebo conflict"]], ["Saldo insuficiente", ["a conta A não tem saldo"], ["pago uma fatura"], ["recebo conflict e o saldo não muda"]]], "fora": ["Validar a referência com a entidade", "Pagamentos agendados"], "sp": 5}, "epic": "E3"}, {"id": "F14", "t": "Juros", "story": "Como cliente, quero ver e receber os juros da minha conta.", "endpoint": "POST /api/accounts/get-interest  ·  POST /api/accounts/apply-interest", "body": "{ \"number\": \"AC-123456\" }", "rules": ["Usa IInterestCalculator, com StandardInterest (1 % ao ano) e PromoInterest(taxa)", "A taxa é escolhida por configuração (IOptions)", "Juros mensais = saldo × taxa ÷ 12, arredondados a 2 casas decimais", "Aplicar cria um movimento de depósito do tipo Interest", "Só pode aplicar-se uma vez por mês", "Conta fechada não recebe juros"], "responses": [["success", "Juros calculados"], ["success", "Juros aplicados"], ["unauthorized", "Sem token válido"], ["not_found", "Conta inexistente ou de outro cliente"], ["conflict", "Já aplicados este mês ou conta fechada"]], "criteria": ["A estratégia é injetada pelo container, não criada com new", "Theory com vários saldos e taxas", "O arredondamento tem um teste", "Pedidos na coleção do Bruno"], "uses": ["dotnet-3", "csharp-2"], "hint": {"more": "É o padrão "], "hint": {"more": "A prestação constante usa a fórmula P = V × i ÷ (1 − (1 + i)^−n), com i a taxa mensal. Confirma com um exemplo que consigas calcular à mão antes de escreveres o teste."}, "valor": "Baixo", "deps": "", "us": {"persona": "cliente autenticado", "quero": "saber quanto pagaria por um empréstimo antes de o pedir", "para": "decidir com informação", "desc": "Simulação sem efeitos: calcula prestação mensal, total de juros e total a pagar. A taxa anual depende do prazo e vem da configuração.", "sc": [["Simulação válida", ["tenho sessão iniciada"], ["simulo 10 000,00 a 36 meses"], ["recebo a prestação, o total de juros e o total a pagar, com 2 casas decimais"]], ["Valor fora do intervalo", ["tenho sessão iniciada"], ["simulo 100,00 ou 60 000,00"], ["recebo validation"]], ["Prazo fora do intervalo", ["tenho sessão iniciada"], ["simulo 5 ou 90 meses"], ["recebo validation"]], ["Sem efeitos", ["fiz uma simulação"], ["consulto a base de dados"], ["não foi gravado nada"]]], "fora": ["Simulação com taxa promocional", "Guardar simulações"], "sp": 3}, "epic": "E4"}, {"id": "F16", "t": "Pedido de empréstimo", "story": "Como cliente, quero pedir um empréstimo e acompanhar o estado.", "endpoint": "POST /api/loans/request  ·  POST /api/loans/list  ·  POST /api/loans/cancel", "body": "{ \"amount\": 10000.00, \"months\": 24, \"accountNumber\": \"AC-123456\" }", "rules": ["Nova entidade Loan, com estados Pending e Cancelled", "Cada cliente só pode ter um pedido Pending", "O cliente só vê e cancela os seus pedidos", "Um pedido cancelado não volta a Pending", "O pedido guarda o valor, o prazo, a conta e a taxa em vigor"], "responses": [["success", "Pedido criado"], ["success", "Lista dos meus pedidos"], ["success", "Pedido cancelado"], ["unauthorized", "Sem token válido"], ["not_found", "Pedido inexistente ou de outro cliente"], ["conflict", "Já há um pedido pendente ou o pedido já foi cancelado"]], "criteria": ["Há teste ao segundo pedido pendente", "O cliente não vê pedidos de outros", "Transições de estado com testes", "Pedidos na coleção do Bruno"], "uses": ["dotnet-4", "csharp-2"], "hint": {"more": "As transições de estado (Pending → Cancelled) devem ser métodos da entidade Loan, tal como o Close da Account. Assim o handler não consegue aprovar um pedido já rejeitado."}, "valor": "Médio", "deps": "F4, F15", "us": {"persona": "cliente autenticado", "quero": "pedir um empréstimo e acompanhar o estado", "para": "financiar um projeto sem sair da aplicação", "desc": "O cliente regista um pedido de empréstimo, consulta o estado e pode cancelá-lo enquanto está Pending. O pedido guarda o valor, o prazo, a conta e a taxa em vigor.", "sc": [["Pedir empréstimo", ["não tenho nenhum pedido Pending"], ["peço um empréstimo"], ["recebo success", "o pedido fica Pending"]], ["Segundo pedido pendente", ["já tenho um pedido Pending"], ["peço outro empréstimo"], ["recebo conflict"]], ["Cancelar", ["tenho um pedido Pending"], ["cancelo o pedido"], ["o pedido fica Cancelled"]], ["Pedido de outro cliente", ["o pedido 7 é de outro cliente"], ["tento cancelá-lo"], ["recebo not_found"]]], "fora": ["Aprovação ou rejeição do pedido", "Reembolso e plano de pagamentos"], "sp": 5}, "epic": "E4"}, {"id": "F17", "t": "Perfil e password", "story": "Como cliente, quero ver os meus dados e mudar a minha password.", "endpoint": "POST /api/profile/get  ·  POST /api/profile/change-password", "body": "{ \"currentPassword\": \"Passw0rd!\", \"newPassword\": \"N3w-Passw0rd\" }", "rules": ["O get devolve nome, email, NIF e o número de contas", "A password atual tem de estar certa", "A nova tem pelo menos 8 caracteres e é diferente da atual", "Guarda-se só o hash", "Os tokens antigos continuam válidos até expirarem"], "responses": [["success", "Dados do cliente"], ["success", "Password alterada"], ["validation", "Password nova inválida"], ["unauthorized", "Sem token ou password atual errada"]], "criteria": ["Reutiliza IPasswordHasher", "A password nunca aparece em logs nem em respostas", "Testes às regras da nova password", "Pedidos na coleção do Bruno"], "uses": ["auth-7", "dotnet-2"], "hint": {"more": "Pensa onde vive a regra «pelo menos 8 caracteres e diferente da atual». Se já existe no Register, evita duplicá-la."}, "valor": "Médio", "deps": "", "us": {"persona": "cliente autenticado", "quero": "ver os meus dados e mudar a minha password", "para": "manter a minha conta segura e os meus dados atualizados", "desc": "Consulta do perfil (nome, email, NIF e número de contas) e alteração da password. A password é guardada apenas como hash e nunca aparece em respostas nem em logs.", "sc": [["Ver perfil", ["tenho sessão iniciada"], ["peço o meu perfil"], ["vejo nome, email, NIF e número de contas", "não vejo hash nem password"]], ["Mudar password", ["conheço a password atual"], ["envio a atual e uma nova com 8 ou mais caracteres"], ["recebo success", "consigo fazer login com a nova password"]], ["Password atual errada", ["tenho sessão iniciada"], ["envio uma password atual incorreta"], ["recebo unauthorized", "a password não muda"]], ["Nova password inválida", ["tenho sessão iniciada"], ["envio uma nova com 5 caracteres ou igual à atual"], ["recebo validation"]]], "fora": ["Recuperação de password por email", "Invalidar os tokens já emitidos"], "sp": 3}, "epic": "E5"}, {"id": "F18", "t": "Refresh token", "story": "Como cliente, quero manter a sessão sem voltar a escrever a password.", "endpoint": "POST /api/auth/refresh", "body": "{ \"refreshToken\": \"a1b2c3...\" }", "rules": ["O Login passa a devolver também um refresh token aleatório com validade de 7 dias", "Guarda-se apenas o hash do refresh token, numa nova entidade RefreshToken", "Cada refresh troca o token por um novo e invalida o antigo (rotation)", "Reutilizar um refresh token antigo revoga todas as sessões do cliente"], "responses": [["success", "Novo access token e novo refresh token"], ["unauthorized", "Refresh token inválido, expirado ou revogado"]], "criteria": ["O refresh token tem pelo menos 32 bytes aleatórios", "Nenhum refresh token está em claro na base de dados", "Há teste à reutilização de um token antigo", "Pedidos na coleção do Bruno"], "uses": ["auth-6", "auth-7"], "hint": {"more": "O refresh token não é um JWT mas sim um valor aleatório, que só tem significado no teu servidor. Para o guardar com hash, usa um hash rápido e determinístico (SHA-256): precisas de o procurar por valor, e a sua aleatoriedade já impede os ataques de dicionário.", "pit": "Guardar o refresh token em claro. Quem ler a base de dados passa a ter todas as sessões."}, "valor": "Médio", "deps": "", "us": {"persona": "cliente autenticado", "quero": "manter a sessão sem voltar a escrever a password", "para": "usar a aplicação sem interrupções e com segurança", "desc": "O login devolve também um refresh token aleatório. Cada refresh troca o token por um novo (rotation) e a reutilização de um token antigo revoga todas as sessões do cliente.", "sc": [["Renovar sessão", ["tenho um refresh token válido"], ["peço um refresh"], ["recebo um novo access token e um novo refresh token", "o refresh token antigo deixa de funcionar"]], ["Reutilização de token antigo", ["já troquei o refresh token A pelo B"], ["envio o token A"], ["recebo unauthorized", "todas as minhas sessões são revogadas"]], ["Token expirado", ["o refresh token tem mais de 7 dias"], ["peço um refresh"], ["recebo unauthorized"]], ["Armazenamento seguro", ["foi emitido um refresh token"], ["consulto a base de dados"], ["só existe o hash do token, nunca o valor em claro"]]], "fora": ["Gestão de dispositivos", "Sessões simultâneas por dispositivo"], "sp": 5}, "epic": "E5"}, {"id": "F19", "t": "Logout", "story": "Como cliente, quero terminar a sessão, para que ninguém a possa reutilizar.", "endpoint": "POST /api/auth/logout", "body": "{ \"refreshToken\": \"a1b2c3...\" }", "rules": ["Recebe o refresh token da sessão a terminar", "Apaga esse refresh token, sem afetar as sessões dos outros dispositivos", "O access token continua válido até expirar", "Repetir o logout com o mesmo token não é erro: responde success", "Usa a entidade RefreshToken da F18"], "responses": [["success", "Sessão terminada"], ["validation", "Pedido sem refresh token"]], "criteria": ["Depois do logout, o refresh token deixa de funcionar", "As outras sessões do cliente continuam ativas", "Há teste ao logout repetido", "Pedido na coleção do Bruno"], "uses": ["auth-6", "auth-7"], "hint": {"more": "O access token é um JWT sem estado: o servidor não o consegue apagar. Por isso o logout só impede a renovação, e o access token acaba por expirar sozinho. Pensa porque é que o access token deve ter validade curta."}, "valor": "Médio", "deps": "F18", "us": {"persona": "cliente autenticado", "quero": "terminar a sessão", "para": "garantir que ninguém a pode reutilizar", "desc": "O logout apaga o refresh token da sessão. O access token continua válido até expirar, por isso deve ter uma validade curta.", "sc": [["Logout", ["tenho um refresh token válido"], ["faço logout"], ["recebo success", "o refresh token deixa de funcionar"]], ["Outras sessões", ["tenho sessão noutro dispositivo"], ["faço logout neste"], ["a outra sessão continua ativa"]], ["Logout repetido", ["já fiz logout com este token"], ["faço logout outra vez"], ["recebo success"]], ["Pedido sem token", ["o corpo não tem refresh token"], ["faço logout"], ["recebo validation"]]], "fora": ["Logout de todos os dispositivos", "Invalidar o access token já emitido"], "sp": 2}, "epic": "E5"}, {"id": "F20", "t": "Limitar tentativas de login", "story": "Como banco, quero travar quem tenta adivinhar passwords.", "endpoint": "POST /api/auth/login (alteração)", "body": null, "rules": ["Após 5 falhas em 15 minutos, o email fica bloqueado durante 15 minutos", "Devolve o erro rate_limited com o tempo de espera na mensagem", "Um login certo repõe o contador", "As falhas gravam-se por email, também para emails que não existem", "A resposta continua igual para email var KW={};("abstract as async await base bool break case catch char class const continue decimal default do double else enum false finally float for foreach if in init int interface internal is long namespace new null object out override private protected public readonly record ref return sealed short static string struct switch this throw true try using var virtual void while and or not when with get set required global args yield").split(" ").forEach(function(w){KW[w]=1});
function hlCs(c){
  var re=/(\/\/[^\n]*)|("""[\s\S]*?"""|\$?@?"(?:[^"\\\n]|\\.)*")|(\b\d[\d_]*(?:\.\d+)?[mMfFdDlLuU]?\b)|(\b[A-Za-z_]\w*\b)/g,out="",last=0,m;
  while((m=re.exec(c))){
    out+=esc(c.slice(last,m.index));last=re.lastIndex;
    if(m[1])out+='<span class="c">'+esc(m[1])+'</span>';
    else if(m[2])out+='<span class="s">'+esc(m[2])+'</span>';
    else if(m[3])out+='<span class="n">'+esc(m[3])+'</span>';
    else{var w=m[4];
      if(KW[w])out+='<span class="k">'+w+'</span>';
      else if(/^[A-Z]/.test(w)&&c.charAt(last)!=="(")out+='<span class="t">'+w+'</span>';
      else out+=w}
  }
  return out+esc(c.slice(last));
}
function hlSh(c){
  return c.split("\n").map(function(l){
    if(/^\s*#/.test(l))return '<span class="c">'+esc(l)+'</span>';
    var i=l.indexOf("   #"),cm="";if(i>0){cm='<span class="c">'+esc(l.slice(i))+'</span>';l=l.slice(0,i)}
    var h=esc(l).replace(/^(\s*)([\w.-]+)/,'$1<span class="k">$2</span>').replace(/(\s)(--?[a-zA-Z][\w-]*)/g,'$1<span class="n">$2</span>');
    return h+cm}).join("\n");
}
function hlJson(c){return esc(c).replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?/g,function(a,s,k){return k?'<span class="t">'+s+'</span>'+k:'<span class="s">'+s+'</span>'}).replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="n">$1</span>')}
function hlXml(c){return esc(c).replace(/(&lt;\/?[\w.:]+)/g,'<span class="k">$1</span>').replace(/(&quot;[^&]*?&quot;)/g,'<span class="s">$1</span>')}
function hlHttp(c){return c.split("\n").map(function(l){
  if(/^\s*#/.test(l))return '<span class="c">'+esc(l)+'</span>';
  return esc(l).replace(/^(GET|POST|PUT|DELETE|PATCH)\b/,'<span class="k">$1</span>').replace(/^([\w-]+)(:)/,'<span class="t">$1</span>$2').replace(/(&quot;[^&]*?&quot;)(\s*:)?/g,function(a,s,k){return k?'<span class="t">'+s+'</span>'+k:'<span class="s">'+s+'</span>'})}).join("\n")}
function hl(code,lang){return lang==="sh"?hlSh(code):lang==="json"?hlJson(code):lang==="xml"?hlXml(code):lang==="http"?hlHttp(code):(lang==="txt"||lang==="bru")?esc(code):hlCs(code)}

  return '<ul class="steps">'+L.steps.map(function(s,i){var k=L.id+":"+i,on=!!P.steps[k];
    return '<li><button class="step" role="checkbox" aria-checked="'+on+'" data-act="step" data-k="'+k+'"><span class="bx">'+TICK+'</span><span class="tx">'+(s.lead?'<b>'+esc(s.lead)+'.</b> ':"")+esc(s.text)+'</span></button></li>'}).join("")+'</ul>';
}
function lessonBody(L){
  var t=L.type;
  if(t==="code"){
    return '<div class="lbody"><ul class="pts">'+L.points.map(function(p){return '<li>'+esc(p)+'</li>'}).join("")+'</ul>'+codeBlock(L.code,L.lang)+'</div>';
  }
  if(t==="cards")return cardsHtml(L);
  if(t==="table")return tableHtml(L.rows)+(L.note?'<div class="note warn">'+esc(L.note)+'</div>':"");
  if(t==="pyramid")return '<div class="pyr">'+L.levels.map(function(l){return '<div><b>'+esc(l.n)+'</b>'+esc(l.d)+'</div>'}).join("")+'</div><div class="cgrid">'+L.items.map(function(it){return '<div class="icard"><h4>'+esc(it.t)+'</h4>'+listOrP(it.d)+'</div>'}).join("")+'</div>';
  if(t==="layers")return '<div class="lbody"><div class="rings"><div class="ring r1"><span class="lb">'+esc(L.levels[0].n)+'</span><div class="ring r2" style="margin-top:6px"><span class="lb">'+esc(L.levels[1].n)+'</span><div class="ring r3" style="margin-top:6px;padding-top:34px"><b>'+esc(L.levels[2].n)+'</b><br>'+esc(L.levels[2].d)+'</div></div></div></div><ul class="pts">'+L.rules.map(function(p){return '<li>'+esc(p)+'</li>'}).join("")+'</ul></div>';
  if(t==="domain"){
    var e=L.entities;
    return '<div class="ents"><div class="ent"><b>'+e[0].n+'</b><span>'+esc(e[0].f)+'</span></div><span class="rel">'+L.rel[0]+' →</span><div class="ent"><b>'+e[1].n+'</b><span>'+esc(e[1].f)+'</span></div><span class="rel">'+L.rel[1]+' →</span><div class="ent"><b>'+e[2].n+'</b><span>'+esc(e[2].f)+'</span></div></div>'+exerciseBody(L);
  }
  if(t==="exercise")return exerciseBody(L);
  return "";
}
function exerciseBody(L){
  var o=stepsHtml(L);
  if(L.hint)o+='<div class="note">'+esc(L.hint)+'</div>';
  if(L.table)o+='<div class="blk" style="margin-top:14px">'+tableHtml(L.table)+'</div>';
  if(L.expected)o+='<div class="reveal"><button data-act="reveal" aria-expanded="false">Ver resultado esperado</button><div class="panel" hidden><pre class="term">'+esc(L.expected)+'</pre></div></div>';
  if(L.extra)o+='<div class="extra"><b>Extra.</b> '+esc(L.extra)+'</div>';
  return o;
}
function lessonHtml(L,i,ch){
  var key=regMore("l:"+L.id,L.t,L.more);
  var on=!!P.seen[L.id],isEx=L.type==="exercise"||L.type==="domain";
  var title=L.t;
  if(isEx)title=L.t;
  return '<article class="lesson'+(on?" seen":"")+(isEx?" exercise":"")+'" id="'+L.id+'">'+
   (isEx?'<span class="ex-badge">Exercício prático</span>':"")+
   '<div class="lh"><span class="ix">'+(i+1<10?"0":"")+(i+1)+'</span><h3>'+esc(title)+'</h3><button class="seenbtn" data-act="seen" data-k="'+L.id+'" aria-pressed="'+on+'">'+TICK+'<span>'+(on?"Visto":"Marcar como visto")+'</span></button></div>'+
   lessonBody(L)+
   (L.more?'<div class="lfoot">'+moreBtn(key)+'</div>':"")+'</article>';
}

/* ---------- pages ---------- */
function progBar(p){return '<div class="barrow"><div class="bar"><i style="width:'+p.pc+'%"></i></div><span>'+p.n+' de '+p.t+'</span></div>'}
function pager(id){
  var i=ROUTES.findIndex(function(r){return r.id===id}),a=ROUTES[i-1],b=ROUTES[i+1],o="";
  if(!a&&id!=="")o+='<a href="#"><small>Anterior</small><span>Início</span></a>';
  if(a)o+='<a href="#'+a.id+'"><small>Anterior</small><span>'+esc(a.t)+'</span></a>';
  if(b)o+='<a class="nx" href="#'+b.id+'"><small>Seguinte</small><span>'+esc(b.t)+'</span></a>';
  return '<nav class="pager" aria-label="Navegação entre páginas">'+o+'</nav>';
}
function crumb(m,last){return '<div class="crumb"><a href="#">Início</a><span>/</span><a href="#'+(m.kind==="intro"?"academia-what":m.id)+'">Módulo '+m.num+'</a>'+(last?'<span>/</span><span>'+esc(last)+'</span>':"")+'</div>'}

function pageHome(){
  var cont=P.last&&RT[P.last]&&P.last!==""?RT[P.last]:null;
  var o='<section class="hero"><p class="eyebrow">Backend · .NET 10</p><h1>Aprende .NET a escrever código.</h1><p>Cinco módulos, do primeiro programa em C# a uma API segura com Clean Architecture. Cada tema abre mais detalhe quando precisares dele.</p><div class="cta"><a class="btn pri" href="#academia-what">Começar pela Academia'+ARROW+'</a>'+(cont?'<a class="btn" href="#'+cont.id+'">Continuar: '+esc(cont.t)+'</a>':"")+'</div></section>';
  o+='<div class="mods">'+MODS.map(function(m){
    var p=modProg(m),first=m.kind==="intro"?"academia-what":m.id,meta="";
    if(m.kind==="course")meta=m.chapters.length+" capítulos · "+m.chapters.reduce(function(a,c){return a+c.lessons.length},0)+" temas";
    else if(m.kind==="intro")meta=m.sections.length+" secções · checklist de software";
    else meta=m.phases.length+" fases · 6 dias";
    return '<a class="mcard" href="#'+first+'" style="--mc:var(--c-'+m.id+')"><span class="k">Módulo '+m.num+'</span><h3>'+esc(m.title)+'</h3><p>'+esc(m.tagline)+'</p><span class="meta">'+meta+'</span><span class="go"><span class="bar"><i style="width:'+p.pc+'%;background:var(--mc)"></i></span><span>'+p.pc+'%</span></span></a>'}).join("")+'</div>';
  return o;
}

function pageIntroSection(m,secId){
  var s=m.sections.filter(function(x){return x.id===secId})[0];
  P.seen["sec:"+secId]=1;
  var o=crumb(m,s.title)+'<header class="ph" style="--mc:var(--c-academia)"><p class="eyebrow">Módulo 1 · '+esc(m.title)+'</p><h1>'+esc(s.title)+'</h1>'+(secId==="what"?'<p class="lead">'+esc(m.tagline)+'</p>':"")+progBar(modProg(m))+'</header>';
  o+='<div style="--mc:var(--c-academia)">'+s.blocks.map(function(b,bi){return blockHtml(b,m,secId+bi)}).join("")+'</div>';
  return o+pager("academia-"+secId);
}
function moreCard(it,key,cls){
  regMore(key,it.t,it.more);
  return '<button class="cardbtn" data-act="more" data-k="'+esc(key)+'"><h4>'+esc(it.t)+'</h4><p>'+esc(it.d)+'</p><span class="go">Saber mais'+ARROW+'</span></button>';
}
function blockHtml(b,m,uid){
  if(b.k==="p")return '<p class="blk prose">'+esc(b.t)+'</p>';
  if(b.k==="cards")return '<div class="blk">'+(b.title?'<h3>'+esc(b.title)+'</h3>':"")+'<div class="cgrid">'+b.items.map(function(it,i){return moreCard(it,"b:"+uid+i)}).join("")+'</div></div>';
  if(b.k==="steps")return '<div class="blk"><div class="cgrid">'+b.items.map(function(it,i){return moreCard(it,"b:"+uid+i)}).join("")+'</div></div>';
  if(b.k==="outcomes")return '<div class="blk">'+b.items.map(function(it,i){var mm=BYID[it.mod];regMore("b:"+uid+i,it.t,it.more);return '<div class="outc" style="--mc:var(--c-'+it.mod+')"><span class="n">'+mm.num+'</span><div><h4>'+esc(it.t)+'</h4><p>'+esc(it.d)+'</p><button class="more" data-act="more" data-k="b:'+uid+i+'">Saber mais'+ARROW+'</button> <a class="minibtn" style="display:inline-flex;align-items:center;margin-top:10px;text-decoration:none" href="#'+(mm.kind==="intro"?"academia-what":mm.id)+'">Ir para o módulo</a></div></div>'}).join("")+'</div>';
  if(b.k==="plan")return '<div class="plan blk">'+MODS.filter(function(x){return x.kind!=="intro"}).concat([MODS[0]]).sort(function(a,b){return a.num-b.num}).map(function(x){
    var links;
    if(x.kind==="intro")links=x.sections.map(function(s){return '<li><a href="#academia-'+s.id+'">'+esc(s.title)+'</a></li>'});
    else if(x.kind==="course")links=x.chapters.map(function(c,i){return '<li><a href="#'+c.id+'">'+(i+1)+' · '+esc(c.t)+'</a></li>'});
    else links=x.phases.map(function(p,i){return '<li><a href="#projeto-'+p.id+'">'+(i+1)+' · '+esc(p.title)+'</a></li>'});
    return '<div class="pm" style="--mc:var(--c-'+x.id+')"><h4><span class="n">'+x.num+'</span>'+esc(x.title)+'</h4><ul>'+links.join("")+'</ul></div>'}).join("")+'</div>';
  if(b.k==="software")return '<div class="blk sw">'+b.items.map(function(it,i){
    var key="sw:"+it.id,on=!!P.sw[it.id];regMore(key,it.name,it.more);
    return '<div class="swi'+(on?" ok":"")+'"><button class="chk" data-act="sw" data-k="'+it.id+'" aria-pressed="'+on+'" aria-label="Marcar '+esc(it.name)+' como instalado">'+TICK+'</button><div><h4>'+esc(it.name)+' <span class="chip '+it.need+'">'+(it.need==="req"?"necessário":it.need==="opt"?"opcional":"mais tarde")+'</span></h4><p>'+esc(it.why)+'</p>'+
      (it.check?'<div class="cmd"><code>'+esc(it.check)+'</code><button class="minibtn" data-act="copytxt" data-v="'+esc(it.check)+'">Copiar</button><span class="exp">→ '+esc(it.expect)+'</span></div>':(it.expect?'<div class="cmd"><span class="exp">Verificar: '+esc(it.expect)+'</span></div>':""))+
      '<p style="margin-top:6px"><b>Instalar:</b> '+esc(it.install)+'</p><div class="acts">'+moreBtn(key,"Saber mais")+'</div></div></div>'}).join("")+'</div>';
  return "";
}

function pageModuleOverview(m){
  var o=crumb(m)+'<header class="ph" style="--mc:var(--c-'+m.id+')"><p class="eyebrow">Módulo '+m.num+'</p><h1>'+esc(m.title)+'</h1><p class="lead">'+esc(m.tagline)+'</p>'+progBar(modProg(m))+'</header>';
  o+='<div class="chlist" style="--mc:var(--c-'+m.id+')">'+m.chapters.map(function(c,i){
    var p=chProg(c),ex=c.lessons.some(function(l){return l.type==="exercise"||l.type==="domain"});
    return '<a class="chcard" href="#'+c.id+'"><span class="num">'+(i+1)+'</span><div><h3>'+esc(c.t)+'</h3><p>'+esc(c.intro)+'</p><div style="margin-top:8px"><span class="tag">'+c.lessons.length+' temas</span>'+(ex?'<span class="tag ex">exercício</span>':"")+(c.quiz.length?'<span class="tag qz">quiz</span>':"")+'</div></div><span class="st">'+p.n+'/'+p.t+' vistos</span></a>'}).join("")+'</div>';
  return o+pager(m.id);
