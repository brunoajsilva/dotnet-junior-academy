= new CancellationTokenSource(1000);   // 1 s\n// cts.Cancel();   // or cancel manually\n\ntry { await GetBalanceAsync(\"AC-001\", cts.Token); }\ncatch (OperationCanceledException)\n{ Console.WriteLine(\"Cancelled\"); }\n\nstatic async Task<decimal> GetBalanceAsync(\n    string code, CancellationToken ct)\n{\n    await Task.Delay(200, ct);   // throws if cancelled\n    ct.ThrowIfCancellationRequested();\n    return 1.04m;\n}", "points": ["O token pede o cancelamento e viaja até quem executa.", "O .NET aceita o token e, ao cancelar, lança uma exceção.", "Em ciclos próprios, verificar o token.", "Numa API, o token do pedido HTTP já vem do ASP.NET."], "lang": "cs", "more": {"more": "O cancelamento é cooperativo: o CancellationToken só avisa. Quem executa tem de o receber e verificar (os métodos do .NET já o fazem e lançam OperationCanceledException). Passa o token a todas as chamadas async encadeadas.\n\nNuma API, o ASP.NET Core dá-te o token do pedido HTTP: se o cliente fechar a ligação, o trabalho é cancelado.", "tryit": "Reduz o tempo do CancellationTokenSource para 100 ms e confirma que o catch corre."}}, {"id": "m1-40", "t": "Saldos das contas", "type": "exercise", "steps": [{"lead": "Exceção própria", "text": "BalanceUnavailableException, com o número da conta."}, {"lead": "Saldo assíncrono", "text": "GetBalanceAsync demora 200 ms e lança a exceção se o número terminar em 9."}, {"lead": "Em paralelo", "text": "Pedir o saldo de todas as contas com Task.WhenAll."}, {"lead": "Falhas isoladas", "text": "Uma conta sem resposta não pode deitar abaixo as outras."}, {"lead": "LINQ", "text": "Somar os saldos obtidos e listar as contas sem resposta."}], "expected": "AC-001: 332,28\nAC-002: 332,28\nAC-009: indisponível\n\nTotal: 664,56\nSem resposta: AC-009", "extra": "Cancelar tudo ao fim de 150 ms com um CancellationToken e mostrar «Cancelado»."}], "quiz": [{"q": "Quando é que uma consulta LINQ é efetivamente executada?", "o": ["Quando é definida", "Quando é enumerada (ToList, foreach, Count...)", "Quando o programa arranca", "Nunca, é só uma descrição"], "a": 1, "w": "Execução diferida: a consulta corre quando enumeras."}, {"q": "Qual a diferença entre throw; e throw ex; dentro de um catch?", "o": ["Nenhuma", "throw; preserva a stack trace original", "throw ex; é mais rápido", "throw; só funciona em async"], "a": 1, "w": "throw ex; reescreve a stack trace e perdes o ponto onde o erro nasceu."}, {"q": "Como corres três chamadas async independentes ao mesmo tempo?", "o": ["await em cada uma, uma a seguir à outra", "Arrancar as Tasks e fazer await Task.WhenAll", "Usar async void", "Usar um ciclo for"], "a": 1, "w": "Primeiro arrancas as tarefas, depois esperas por todas."}, {"q": "O que faz o CancellationToken?", "o": ["Cancela sozinho qualquer operação", "Avisa quem executa; é este que tem de o verificar", "Apaga a Task", "Torna o método síncrono"], "a": 1, "w": "O cancelamento é cooperativo."}]}, {"id": "csharp-4", "t": "Mini-aplicação de consola", "intro": "O enunciado de uma aplicação de consola completa, para juntar tudo o que aprendeste.", "lessons": [{"id": "m1-42", "t": "Enunciado: gestão de contas", "type": "cards", "items": [{"t": "Contexto", "d": ["Um banco quer uma aplicação de consola para registar contas e consultar totais por cliente. Os dados ficam em memória enquanto o programa corre."], "code": "1) Criar conta\n2) Listar contas\n3) Total por cliente\n0) Sair"}, {"t": "Funcionalidades", "d": ["1 · Criar conta: pede o número, o nome e o NIF do cliente e o saldo inicial.", "2 · Listar contas: mostra número, cliente e saldo, do maior para o menor.", "3 · Total por cliente: mostra a soma dos saldos de cada cliente.", "0 · Sair: termina o programa."]}], "more": {"more": "Tudo fica em memória enquanto o programa corre: não há base de dados neste módulo. Decide tu a ordem em que implementas as opções do menu. Uma sugestão: começa pela 1 e pela 2, porque a 3 depende de ter contas criadas.", "tryit": "Antes de escreveres código, desenha as classes que vais precisar e a estrutura de dados onde guardas as contas."}}, {"id": "m1-43", "t": "Enunciado: regras e estrutura", "type": "cards", "items": [{"t": "Regras de validação", "d": ["O número da conta não pode estar vazio nem repetido.", "O NIF tem 9 dígitos.", "O saldo inicial é um número maior ou igual a zero.", "Uma opção inválida mostra uma mensagem e volta ao menu.", "Uma entrada inválida nunca faz o programa terminar."]}, {"t": "Estrutura obrigatória", "d": ["Uma class Customer e um record Account.", "As contas guardadas numa List<Account>.", "LINQ nas opções 2 e 3.", "Um método para cada opção do menu."]}]}, {"id": "m1-44", "t": "Enunciado: exemplo de execução", "type": "cards", "items": [{"t": "Exemplo de execução", "d": [], "code": "=== Contas ===\n1) Criar conta\n2) Listar contas\n3) Total por cliente\n0) Sair\n> 1\nNúmero: AC-001\nCliente: Ana Pereira\nNIF: 123456789\nSaldo inicial: 320,50\nConta criada.\n> 3\nAna Pereira: 320,50"}, {"t": "Extras (opcional)", "d": ["Pesquisar uma conta pelo número, com um Dictionary.", "Calcular os juros com a interface IInterestCalculator.", "Impedir dois clientes com o mesmo NIF."]}], "more": {"more": "Reproduz o exemplo exatamente, incluindo o formato do saldo com duas casas e vírgula decimal. Os extras são opcionais, mas o de impedir NIFs repetidos obriga-te a pensar num Dictionary."}}, {"id": "m1-45", "t": "Antes de terminar", "type": "cards", "items": [{"t": "Critérios de conclusão", "d": ["Compila sem avisos", "Cumpre todos os requisitos do enunciado", "Trata entradas inválidas sem rebentar", "O formando explica uma classe e uma consulta LINQ do seu código"], "check": true}, {"t": "Perguntas de «porquê»", "d": ["Porque usámos decimal e não double?", "Porque é que Account é um record?", "O que acontece se o e-mail for null?"]}], "more": {"more": "O critério de explicar uma classe e uma consulta LINQ do teu código é o mais importante: mostra que percebes o que escreveste."}}], "quiz": []}], "outro": {"done": ["Escrever C# com tipos, condições, ciclos e strings", "Modelar um domínio com classes, records e interfaces", "Consultar dados com LINQ", "Tratar erros e usar async/await", "Construir uma aplicação de consola"], "docs": [{"t": "Documentação oficial de C#", "u": "https://learn.microsoft.com/dotnet/csharp/"}, {"t": "Visita guiada ao C#", "u": "https://learn.microsoft.com/dotnet/csharp/tour-of-csharp/"}, {"t": "Referência da linguagem", "u": "https://learn.microsoft.com/dotnet/csharp/language-reference/"}], "practice": ["Acrescentar uma opção nova à aplicação de consola", "Reescrever um ciclo com LINQ", "Criar uma exceção própria para uma regra de negócio", "Paralelizar um pedido com Task.WhenAll"]}}, {"id": "dotnet", "num": 3, "kind": "course", "title": ".NET", "short": ".NET", "tagline": "A plataforma, a Web API, Dependency Injection, base de dados, testes e organização em camadas.", "chapters": [{"id": "dotnet-1", "t": "A plataforma .NET", "intro": "O que acontece entre escrever C# e ver o programa a correr, e como se organiza uma solução.", "lessons": [{"id": "m2-7", "t": "Como é que o .NET executa o teu código", "type": "cards", "items": [{"t": "Código C#", "d": ["ficheiros .cs"]}, {"t": "Compilador", "d": ["Roslyn"]}, {"t": "Intermediate Language", "d": ["ficheiro .dll"]}, {"t": "Runtime", "d": ["CLR e compilador JIT"]}, {"t": "Código máquina", "d": ["o processador executa"]}, {"t": "Multiplataforma", "d": ["Windows, Linux e macOS, incluindo containers."]}, {"t": "Biblioteca de classes", "d": ["Coleções, ficheiros, rede, JSON e muito mais, já incluídos."]}, {"t": "Memória gerida", "d": ["O garbage collector liberta a memória que já não é usada."]}], "more": {"more": "O compilador Roslyn transforma o teu C# em IL (Intermediate Language), guardado num ficheiro .dll. O IL não é código máquina e, por isso, é igual em Windows, Linux e macOS. Quando a aplicação arranca, o runtime (CLR) usa o compilador JIT para converter o IL em código máquina do processador onde está a correr.\n\nÉ isto que permite compilar uma vez e executar em vários sistemas, incluindo containers Linux."}, "flow": 5}, {"id": "m2-8", "t": "SDK, runtime e versões", "type": "cards", "items": [{"t": "SDK", "d": ["Para desenvolver: compilador, linha de comandos dotnet e templates de projetos."]}, {"t": "Runtime", "d": ["Para executar: é o que tem de existir no servidor onde a aplicação corre."]}, {"t": "Versões LTS", "d": ["As versões pares, como o .NET 10, têm suporte de longa duração (3 anos)."]}, {"t": ".NET Framework", "d": ["A plataforma antiga (4.x): só Windows e sem novas funcionalidades. Em projetos novos usa-se o .NET."]}], "more": {"more": "O SDK é o que instalas no teu computador para desenvolver: compilador, comando dotnet e templates. O runtime é o mínimo necessário para executar uma aplicação já compilada, e é o que o servidor precisa.\n\nAs versões pares (8, 10) são LTS. Em projetos novos escolhe sempre uma LTS ou superior, e nunca o .NET Framework 4.x.", "tryit": "No terminal, corre dotnet --list-sdks e dotnet --list-runtimes e vê o que tens instalado."}, "tryit_cmd": "dotnet --list-sdks"}, {"id": "m2-9", "t": "Soluções e Projetos", "type": "table", "rows": [["Tarefa", "Linha de comandos", "Visual Studio"], ["Criar um projeto", "dotnet new webapi", "File > New > Project"], ["Adicionar à solução", "dotnet sln add", "Botão direito na Solution > Add > New Project"], ["Referenciar um projeto", "dotnet add reference", "Botão direito em Dependencies > Add Project Reference"], ["Instalar um pacote", "dotnet add package", "Botão direito no projeto > Manage NuGet Packages"], ["Compilar", "dotnet build", "Build > Build Solution (Ctrl+Shift+B)"], ["Executar", "dotnet run", "F5 (com debugger) ou Ctrl+F5 (sem)"], ["Testar", "dotnet test", "Test > Run All Tests (Test Explorer)"]], "note": "", "more": {"more": "A linha de comandos e o Visual Studio fazem o mesmo. A linha de comandos é mais rápida de repetir, fica em scripts e funciona em qualquer IDE. Sabê-la é o que te permite ajudar num pipeline de Release, onde não há IDE."}}, {"id": "m2-10", "t": "Solução, projeto e NuGet", "type": "code", "code": "<Project Sdk=\"Microsoft.NET.Sdk.Web\">\n  <PropertyGroup>\n    <TargetFramework>net10.0<\/TargetFramework>\n    <Nullable>enable<\/Nullable>\n    <ImplicitUsings>enable<\/ImplicitUsings>\n  <\/PropertyGroup>\n  <ItemGroup>\n    <PackageReference Include=\"Serilog\" Version=\"4.2.0\" />\n    <ProjectReference Include=\"..\\Domain\\Domain.csproj\" />\n  <\/ItemGroup>\n<\/Project>", "points": [".sln agrupa projetos; .csproj descreve um projeto.", "TargetFramework indica a versão do .NET.", "PackageReference traz pacotes do NuGet.", "ProjectReference liga projetos entre si."], "lang": "xml", "more": {"more": "A solução (.sln) é só uma lista de projetos para o IDE abrir em conjunto. Cada projeto (.csproj) é um XML pequeno que diz o que é (Sdk), para que versão compila (TargetFramework), de que pacotes depende (PackageReference) e de que outros projetos depende (ProjectReference).\n\nAs referências entre projetos formam a arquitetura: se o Domain não referencia nada, é impossível usar o EF Core lá dentro por engano.", "pit": "Referências circulares entre projetos. O compilador recusa: é sinal de que as responsabilidades estão mal divididas."}}, {"id": "m2-11", "t": "A solução do banco", "type": "exercise", "steps": [{"lead": "Criar a solução", "text": "BankingApp, com o projeto Api (webapi)"}, {"lead": "Adicionar à solução", "text": "Domain (classlib) e Tests (xunit)"}, {"lead": "Referenciar", "text": "o Domain na Api e a Api nos Tests"}, {"lead": "", "text": "Instalar um pacote na Api via NuGet: Newtonsoft.Json"}, {"lead": "Compilar e correr", "text": "a Api e abrir o endereço indicado no terminal"}], "expected": "dotnet build\nBuild succeeded.\n    0 Warning(s)\n    0 Error(s)\n\ndotnet run\nNow listening on:\nhttp://localhost:5xxx", "extra": "Mostrar a estrutura de pastas com o comando tree e explicar o que cada projeto vai ter.", "more": {"more": "Faz tudo na linha de comandos, sem o assistente do IDE: assim ficas a saber exatamente o que cada comando cria. Tabela de equivalências com o Visual Studio está no tema «Soluções e Projetos».", "tryit": "Corre tree (ou tree /f) para ver a estrutura de pastas e explica o que cada projeto vai ter."}}], "quiz": [{"q": "O que contém um ficheiro .dll gerado pelo compilador?", "o": ["Código máquina para Windows", "IL (Intermediate Language)", "Código C# minificado", "Apenas metadados"], "a": 1, "w": "O IL é convertido em código máquina pelo JIT, na altura de executar."}, {"q": "Qual a diferença entre SDK e runtime?", "o": ["Nenhuma", "O SDK serve para desenvolver; o runtime para executar", "O runtime inclui o compilador", "O SDK só existe no Windows"], "a": 1, "w": "Num servidor basta o runtime; no teu computador instalas o SDK."}, {"q": "Que elemento do .csproj liga um projeto a outro?", "o": ["PackageReference", "ProjectReference", "TargetFramework", "ImplicitUsings"], "a": 1, "w": "PackageReference traz pacotes NuGet; ProjectReference liga projetos."}]}, {"id": "dotnet-2", "t": "ASP.NET Core e Web API", "intro": "Construir uma Web API: pipeline, controllers, códigos HTTP, DTOs, validação e documentação.", "lessons": [{"id": "m2-13", "t": "Program.cs: arrancar a aplicação", "type": "code", "code": "var builder = WebApplication.CreateBuilder(args);\n\nbuilder.Services.AddControllers();\nbuilder.Services.AddOpenApi();\n\nvar app = builder.Build();\n\napp.MapOpenApi();\napp.UseHttpsRedirection();\napp.MapControllers();\n\napp.Run();", "points": ["builder regista serviços.", "app define como os pedidos são tratados.", "Run arranca o servidor Kestrel.", "Tudo num só ficheiro, de cima para baixo."], "lang": "cs", "more": {"more": "O Program.cs tem duas fases. Primeiro o builder regista os serviços de que a aplicação precisa (controllers, OpenAPI, base de dados). Depois, com app = builder.Build(), configuras o pipeline: o que acontece a cada pedido, pela ordem em que escreves.\n\nO servidor web por baixo chama-se Kestrel e arranca com app.Run()."}}, {"id": "m2-14", "t": "Middleware: o pipeline de pedidos", "type": "cards", "items": [{"t": "Pedido", "d": ["HTTP"]}, {"t": "HTTPS", "d": ["redireciona para https"]}, {"t": "Autenticação", "d": ["quem és?"]}, {"t": "Autorização", "d": ["podes fazer isto?"]}, {"t": "Controller", "d": ["executa a ação"]}, {"t": "", "d": ["Cada middleware pode tratar o pedido, passá-lo ao seguinte ou terminá-lo.", "A ordem do registo no Program.cs é a ordem de execução.", "A resposta volta pelo mesmo caminho, em sentido contrário."], "note": true}], "flow": 5, "more": {"more": "O pipeline é uma cadeia: cada middleware pode responder logo (por exemplo, rejeitar um pedido sem autenticação) ou passar ao seguinte. Quando o controller devolve a resposta, esta volta pela mesma cadeia, ao contrário. É por isso que a ordem no Program.cs importa."}}, {"id": "m2-15", "t": "Middleware próprio", "type": "code", "code": "app.Use(async (context, next) =>\n{\n    var sw = Stopwatch.StartNew();\n\n    await next();\n\n    var ms = sw.ElapsedMilliseconds;\n    Console.WriteLine($\"{context.Request.Path}: {ms} ms\");\n});", "points": ["Use acrescenta um middleware ao pipeline.", "O código antes de next() corre à ida.", "O código depois corre à volta.", "Serve para logging, medição de tempos e tratamento de erros."], "lang": "cs", "more": {"more": "Um middleware é um passo do pipeline. Recebe o contexto do pedido e uma função next. O código antes de await next() corre à ida; o código depois corre à volta, já com a resposta construída.\n\nÉ o sítio certo para preocupações transversais: medir tempos, registar pedidos, converter exceções em respostas HTTP.", "pit": "Registar o middleware de erros depois dos controllers. A ordem do registo é a ordem de execução."}}, {"id": "m2-16", "t": "Configuração e ambientes", "type": "code", "code": "// appsettings.json\n{\n  \"ConnectionStrings\": {\n    \"BankingApp\": \"Server=...;Database=BankingApp\"\n  },\n  \"Interest\": { \"MaxBonus\": 0.02 }\n}\n\n// in code\nvar cs = builder.Configuration\n    .GetConnectionString(\"BankingApp\");\nvar max = builder.Configuration\n    .GetValue<decimal>(\"Interest:MaxBonus\");", "points": ["appsettings.json guarda a configuração.", "O ficheiro do ambiente sobrepõe-se ao base.", "Variáveis de ambiente têm prioridade.", "Segredos nunca vão para o repositório."], "lang": "cs", "more": {"more": "A configuração vem de várias fontes sobrepostas: appsettings.json, appsettings.{Environment}.json, variáveis de ambiente. A última a ser lida ganha. Assim o mesmo código usa uma base de dados em DEV e outra em PROD, sem recompilar.\n\nSegredos (passwords, chaves) nunca vão para o repositório; usam-se variáveis de ambiente, user-secrets em desenvolvimento ou um cofre."}}, {"id": "m2-17", "t": "Controllers e rotas", "type": "code", "code": "[ApiController]\n[Route(\"api/accounts\")]\npublic class AccountsController : ControllerBase\n{\n    [HttpGet]                     // GET api/accounts\n    public IActionResult List() { ... }\n\n    [HttpGet(\"{number}\")]         // GET api/accounts/AC-001\n    public IActionResult Get(string number) { ... }\n\n    [HttpPost]                    // POST api/accounts\n    public IActionResult Create(NewAccount r) { ... }\n}", "points": ["[ApiController] liga o binding e a validação automática.", "[Route] define o caminho base.", "Um atributo por verbo: HttpGet, HttpPost...", "{number} vem da rota; o corpo vem do JSON."], "lang": "cs", "more": {"more": "Um controller é uma classe que agrupa endpoints. [ApiController] ativa o binding automático e a validação; [Route] define o caminho base; cada método tem um atributo de verbo. Parâmetros como {number} vêm da rota, e o corpo JSON é convertido para o tipo do parâmetro."}}, {"id": "m2-18", "t": "Códigos de estado HTTP", "type": "table", "rows": [["Código", "Significado", "Quando"], ["200 OK", "Pedido bem-sucedido, com corpo", "GET que encontra o recurso"], ["201 Created", "Recurso criado (cabeçalho Location)", "POST que cria uma conta"], ["204 No Content", "Sucesso, sem corpo", "DELETE ou PUT bem-sucedidos"], ["400 Bad Request", "Pedido inválido", "Falha na validação"], ["404 Not Found", "O recurso não existe", "GET de uma conta inexistente"], ["409 Conflict", "Conflito com o estado atual", "Número de conta repetido"], ["500 Internal Server Error", "Erro no servidor", "Exceção não tratada"]], "note": "", "more": {"more": "Os códigos agrupam-se por centena: 2xx sucesso, 4xx erro do cliente (corrige o pedido), 5xx erro do servidor (a culpa não é do cliente). Escolher o código certo poupa horas de depuração a quem consome a tua API.", "tryit": "Antes de abrires a coluna «Quando», tenta adivinhar o código para cada situação."}}, {"id": "m2-19", "t": "Devolver o resultado certo", "type": "code", "code": "[HttpGet(\"{number}\")]\npublic ActionResult<AccountResponse> Get(string number)\n{\n    var account = _service.Get(number);\n    if (account is null)\n        return NotFound();\n\n    return Ok(account);\n}\n\n[HttpPost]\npublic ActionResult<AccountResponse> Create(NewAccount r)\n{\n    var created = _service.Create(r);\n    return CreatedAtAction(nameof(Get),\n        new { number = created.Number }, created);\n}", "points": ["Ok, NotFound, BadRequest...", "CreatedAtAction devolve 201 e o endereço do novo recurso.", "ActionResult<T> documenta o tipo devolvido."], "lang": "cs", "more": {"more": "O código de estado é parte do contrato da API. Os métodos auxiliares (Ok, NotFound, BadRequest, CreatedAtAction) devolvem o código certo. ActionResult<T> permite devolver tanto o objeto como um código de erro, e o OpenAPI percebe o tipo.", "tryit": "Faz GET de uma conta que não existe e confirma que recebes 404 e não 200 com corpo vazio."}}, {"id": "m2-20", "t": "DTOs e validação", "type": "code", "code": "public record NewAccount(\n    [Required, StringLength(20)] string Number,\n    [RegularExpression(@\"^\\d{9}$\")] string TaxId,\n    [Range(0, 1000000)] decimal Balance);\n\npublic record AccountResponse(\n    string Number, string Customer, decimal Balance);", "points": ["DTO é o formato do pedido ou da resposta, não da base de dados.", "Entrada e saída ficam separadas.", "Os atributos validam o pedido.", "Com [ApiController], um pedido inválido devolve 400 sozinho."], "lang": "cs", "more": {"more": "Um DTO descreve o formato do pedido ou da resposta, e não o da tabela. Separar entrada de saída (NewAccount vs AccountResponse) permite alterar a base de dados sem partir os clientes da API, e impede que o cliente defina campos que não deve (como o Id).\n\nOs atributos de validação ([Required], [Range], [StringLength]) são verificados antes de o controller correr; com [ApiController], um pedido inválido devolve 400 sozinho.", "pit": "Devolver a entidade da base de dados diretamente. Qualquer alteração à tabela passa a alterar o contrato público."}}, {"id": "m2-21", "t": "REST e RPC", "type": "cards", "items": [{"t": "REST", "d": ["Recursos e verbos HTTP", "O URL identifica o recurso; o verbo diz o que fazer."], "code": "GET    /api/accounts/AC-001\nPOST   /api/accounts\nDELETE /api/accounts/AC-001"}, {"t": "RPC", "d": ["Operações com nome", "O URL identifica a operação; quase tudo é POST."], "code": "POST /api/calculateInterest\nPOST /api/closeAccount\nPOST /api/sendEmail"}], "more": {"more": "Numa API REST, o URL é um substantivo (o recurso) e o verbo HTTP é a ação: GET lê, POST cria, PUT/PATCH altera, DELETE apaga. Em RPC, o URL é um verbo (calculateInterest) e quase tudo é POST. REST é a escolha por omissão para os recursos do domínio; RPC aparece em operações que não são um recurso, como «calcular»."}}, {"id": "m2-22", "t": "Documentar com OpenAPI e Swagger UI", "type": "code", "code": "// 1. the document: built into ASP.NET Core (the template already has it)\nbuilder.Services.AddOpenApi();\n\n// 2. the UI: a separate package\n// dotnet add package Swashbuckle.AspNetCore.SwaggerUI\n\nif (app.Environment.IsDevelopment())\n{\n    app.MapOpenApi();   // serves /openapi/v1.json\n    app.UseSwaggerUI(o =>\n        o.SwaggerEndpoint(\"/openapi/v1.json\", \"v1\"));   // /swagger\n}", "points": ["OpenAPI é o documento que descreve o contrato da API: endpoints, parâmetros e respostas.", "Desde o .NET 9, o ASP.NET Core gera esse documento sozinho (Microsoft.AspNetCore.OpenApi).", "O template deixou de incluir o Swashbuckle e, no .NET 10, o documento é OpenAPI 3.1.", "A página para experimentar é uma peça à parte: o pacote Swashbuckle.AspNetCore.SwaggerUI."], "lang": "cs", "more": {"more": "São duas peças diferentes. O documento OpenAPI (o JSON em /openapi/v1.json) é gerado pelo próprio ASP.NET Core com AddOpenApi e MapOpenApi. A página interativa (o Swagger UI) só desenha esse documento: não o gera.\n\nAntes do .NET 9, o template incluía o Swashbuckle, que fazia as duas coisas. Agora o documento é nativo e, se quiseres a página do Swagger UI, acrescentas o pacote Swashbuckle.AspNetCore.SwaggerUI e apontas-o para o documento. Existem outras interfaces que leem o mesmo documento (Scalar, ReDoc), por isso trocar de UI não mexe na API.\n\nO .NET 10 passou o documento para OpenAPI 3.1 por omissão. Se algum cliente ou ferramenta não o suportar, podes fixar a versão 3.0 nas opções do AddOpenApi.", "pit": "Abrir /swagger e receber 404. Sem o pacote SwaggerUI, ou fora do ambiente Development, a página não existe, mas o documento /openapi/v1.json continua a funcionar.", "tryit": "Abre primeiro /openapi/v1.json e depois /swagger. Executa um POST e vê o 201 com o cabeçalho Location."}}, {"id": "m2-23", "t": "API de contas", "type": "exercise", "steps": [{"lead": "Controller", "text": "AccountsController com uma lista de contas em memória"}, {"lead": "Listar", "text": "GET /api/accounts devolve todas as contas"}, {"lead": "Obter", "text": "GET /api/accounts/{number} devolve 404 se não existir"}, {"lead": "Criar", "text": "POST /api/accounts valida o pedido (400) e rejeita números repetidos (409)"}, {"lead": "Experimentar", "text": "testar todos os casos no Swagger UI"}], "extra": "Acrescentar DELETE /api/accounts/{number}, que devolve 204 ou 404.", "table": [["Pedido", "Sucesso", "Erros"], ["GET /api/accounts", "200 com a lista", "—"], ["GET /api/accounts/{number}", "200 com a conta", "404 se não existir"], ["POST /api/accounts", "201 com Location", "400 se inválido; 409 se repetida"]], "expected": null, "more": {"more": "Só passas ao capítulo seguinte quando o resultado esperado aparecer no teu computador. Se algo falhar, lê a mensagem de erro de baixo para cima: a última linha costuma dizer o que correu mal.", "tryit": "Acrescentar DELETE /api/accounts/{number}, que devolve 204 ou 404."}}], "quiz": [{"q": "Que código HTTP devolve um POST que criou uma conta?", "o": ["200 OK", "201 Created", "204 No Content", "202 Accepted"], "a": 1, "w": "201 Created, com o cabeçalho Location do novo recurso."}, {"q": "O que acontece à ordem dos middlewares no Program.cs?", "o": ["É irrelevante", "É a ordem de execução do pipeline", "Corre ao contrário", "O framework reordena-os"], "a": 1, "w": "Cada middleware corre pela ordem do registo; a resposta volta em sentido contrário."}, {"q": "Porque se usam DTOs em vez de devolver a entidade?", "o": ["Por exigência do EF Core", "Para separar o contrato da API do modelo da base de dados", "Para o JSON ficar mais pequeno", "Porque as entidades não são serializáveis"], "a": 1, "w": "Assim a base de dados pode mudar sem partir os clientes da API."}, {"q": "Qual o código para uma conta com número repetido?", "o": ["400", "404", "409", "500"], "a": 2, "w": "409 Conflict: o pedido conflita com o estado atual."}]}, {"id": "dotnet-3", "t": "Dependency Injection", "intro": "Deixar o container criar e entregar as dependências em vez de fazer new.", "lessons": [{"id": "m2-26", "t": "Porquê injetar dependências?", "type": "cards", "items": [{"t": "Sem injeção", "d": ["A classe escolhe e cria a sua dependência: fica presa a ela."], "code": "public class AccountService\n{\n    readonly StandardInterest _calc = new();\n\n    public decimal Interest(Account a)\n        => _calc.Calculate(a);\n}"}, {"t": "Com injeção", "d": ["A classe recebe-a pelo construtor: quem cria decide qual usar."], "code": "public class AccountService\n{\n    readonly IInterestCalculator _calc;\n\n    public AccountService(\n        IInterestCalculator calc)\n        => _calc = calc;\n}"}], "more": {"more": "À esquerda, AccountService cria StandardInterest com new: está presa a essa classe e não podes testá-la com outra. À direita recebe IInterestCalculator pelo construtor: quem cria o AccountService decide qual usar. É a mesma ideia da composição que viste em C#.", "tryit": "Cria um FakeInterest que devolve sempre 1 e passa-o ao AccountService num teste."}}, {"id": "m2-27", "t": "O container de DI", "type": "code", "code": "// Program.cs: register\nbuilder.Services.AddScoped<IInterestCalculator,\n    PromoInterest>();\nbuilder.Services.AddScoped<AccountService>();\n\n// the controller receives the service\npublic AccountsController(AccountService service)\n{\n    _service = service;\n}", "points": ["O container cria os objetos e entrega-os a quem os pede.", "AddScoped<TInterface, TImpl> diz qual implementar.", "O construtor declara o que a classe precisa.", "Nunca se faz new de um serviço."], "lang": "cs", "more": {"more": "O container de DI é uma fábrica configurável. No Program.cs dizes 'quando alguém pedir IInterestCalculator, entrega PromoInterest'. O ASP.NET Core cria o controller por cada pedido, olha para o construtor e resolve cada parâmetro recursivamente.\n\nTrocar de implementação é mudar uma linha de registo. O resto do código não se altera.", "pit": "Registar a classe mas esquecer-se de registar uma das suas dependências. O erro surge em execução, no primeiro pedido."}}, {"id": "m2-28", "t": "Tempos de vida", "type": "table", "rows": [["Tempo de vida", "Instância", "Exemplo típico"], ["Transient", "Nova de cada vez que é pedida", "Serviços leves e sem estado"], ["Scoped", "Uma por pedido HTTP", "DbContext e serviços de aplicação"], ["Singleton", "Uma para toda a aplicação", "Caches e clientes partilhados"]], "note": "Atenção: um Singleton não deve depender de um Scoped, porque viveria mais tempo do que a dependência e ficaria com um objeto já descartado.", "more": {"more": "Transient cria uma instância nova de cada vez. Scoped cria uma por pedido HTTP, e é o tempo de vida do DbContext. Singleton cria uma para toda a aplicação.\n\nUm Singleton nunca deve receber um Scoped no construtor: viveria mais do que a sua dependência, que já teria sido descartada.", "pit": "Singleton que depende do DbContext. Dá erro de validação do container, ou pior, partilha um DbContext entre pedidos."}}, {"id": "m2-29", "t": "Logging e opções também se injetam", "type": "code", "code": "public class AccountService\n{\n    private readonly ILogger<AccountService> _log;\n    private readonly InterestOptions _options;\n\n    public AccountService(\n        ILogger<AccountService> log,\n        IOptions<InterestOptions> options)\n    {\n        _log = log;\n        _options = options.Value;\n    }\n}", "points": ["ILogger<T> regista mensagens com nível e categoria.", "IOptions<T> dá acesso à configuração tipada.", "Mensagens com marcadores, como {Number}, ficam pesquisáveis.", "Os serviços do framework usam o mesmo mecanismo."], "lang": "cs", "more": {"more": "ILogger<T> regista mensagens com nível (Information, Warning, Error) e categoria (o tipo T). Usa marcadores nomeados, como {Number}, em vez de concatenar: o texto fica constante e os valores ficam pesquisáveis nos sistemas de logs.\n\nIOptions<T> liga uma secção do appsettings a uma classe tipada."}}, {"id": "m2-30", "t": "Boas práticas", "type": "cards", "items": [{"t": "Depender de interfaces", "d": ["Pedir IInterestCalculator e não PromoInterest: trocar a implementação não obriga a alterar a classe."]}, {"t": "Poucas dependências", "d": ["Um construtor com sete parâmetros é sinal de que a classe faz demasiado."]}, {"t": "Sem new nos serviços", "d": ["Se uma classe cria o que usa, não se consegue substituir nem testar sozinha."]}, {"t": "Sem GetService", "d": ["Pedir ao container dentro do código esconde as dependências. Usar o construtor."]}], "more": {"more": "Um construtor com sete parâmetros é um sinal: a classe provavelmente faz demasiado. GetService dentro do código (service locator) esconde as dependências e dificulta os testes. O construtor é o sítio honesto para declarar do que a classe precisa."}}, {"id": "m2-31", "t": "Juros injetados", "type": "exercise", "steps": [{"lead": "Contrato", "text": "IInterestCalculator, com as implementações StandardInterest e PromoInterest"}, {"lead": "Registar", "text": "a implementação no Program.cs com AddScoped"}, {"lead": "Injetar", "text": "o calculador num AccountService e usá-lo no POST para devolver os juros anuais"}, {"lead": "Configurar", "text": "a taxa em appsettings.json, lida com IOptions"}, {"lead": "Registar no log", "text": "o número da conta e os juros calculados com ILogger"}], "expected": "POST /api/accounts\n{ \"balance\": 1000.00 }\n\n201 Created\n{\n  \"number\": \"AC-001\",\n  \"annualInterest\": 20.00\n}", "extra": "Escolher a implementação por configuração (Standard ou Promo) sem recompilar.", "more": {"more": "Só passas ao capítulo seguinte quando o resultado esperado aparecer no teu computador. Se algo falhar, lê a mensagem de erro de baixo para cima: a última linha costuma dizer o que correu mal.", "tryit": "Escolher a implementação por configuração (Basic or Discounted) sem recompilar."}}], "quiz": [{"q": "Qual o tempo de vida do DbContext por omissão?", "o": ["Transient", "Scoped", "Singleton", "Static"], "a": 1, "w": "AddDbContext regista-o como Scoped: uma instância por pedido HTTP."}, {"q": "Porque é problemático um Singleton depender de um Scoped?", "o": ["Não compila", "O Singleton vive mais e fica com um objeto já descartado", "É mais lento", "O container recusa Singletons"], "a": 1, "w": "O Singleton vive durante toda a aplicação e o Scoped só durante o pedido."}, {"q": "Onde se escolhe a implementação de IInterestCalculator?", "o": ["No construtor do controller", "No registo do container, no Program.cs", "Na própria interface", "No appsettings"], "a": 1, "w": "O registo decide; a classe só declara o que precisa."}]}, {"id": "dotnet-4", "t": "Entity Framework Core", "intro": "Ligar a API a uma base de dados com classes C#, migrations e consultas LINQ.", "lessons": [{"id": "m2-33", "t": "O que é o Entity Framework Core", "type": "cards", "items": [{"t": "Classes C#", "d": ["Account, Customer"]}, {"t": "EF Core", "d": ["traduz e acompanha as alterações"]}, {"t": "Base de dados", "d": ["tabelas e linhas SQL"]}, {"t": "", "d": ["DbContext: a sessão com a base de dados.", "DbSet<T>: uma tabela, vista como coleção.", "Provider: o pacote que fala com cada base de dados (por exemplo, SQL Server).", "Migrations: o histórico versionado do esquema da base de dados."], "note": true}], "flow": 3}, {"id": "m2-34", "t": "Code-first: o modelo manda", "type": "cards", "items": [{"t": "Classes C#", "d": ["entidades e DbContext"]}, {"t": "Migration", "d": ["ficheiro C# gerado a partir do modelo"]}, {"t": "Base de dados", "d": ["esquema criado e atualizado"]}, {"t": "", "d": ["Code-first: escreves as classes e o EF gera o esquema da base de dados.", "Migrations: cada alteração ao modelo fica num ficheiro versionado com o código.", "Database-first: parte de uma base existente e gera as classes (dotnet ef dbcontext scaffold).", "Neste módulo: code-first. O código é a fonte de verdade do esquema."], "note": true}], "flow": 3}, {"id": "m2-35", "t": "Entidades", "type": "code", "code": "public class Customer\n{\n    public int Id { get; set; }\n    public string Name { get; set; } = \"\";\n    public List<Account> Accounts { get; } = new();\n}\n\npublic class Account\n{\n    public int Id { get; set; }\n    public string Number { get; set; } = \"\";\n    public decimal Balance { get; set; }\n    public int CustomerId { get; set; }\n    public Customer Customer { get; set; } = null!;\n}", "points": ["Cada classe é uma tabela; cada propriedade, uma coluna.", "Id é a chave primária, por convenção.", "CustomerId é a chave estrangeira.", "Customer e Accounts são propriedades de navegação."], "lang": "cs", "more": {"more": "As entidades são classes simples. Por convenção, uma propriedade chamada Id (ou ClassNameId) é a chave primária. CustomerId é a chave estrangeira para Customer, e as propriedades de navegação (Customer, Accounts) permitem percorrer a relação em C# sem escrever JOINs."}}, {"id": "m2-36", "t": "Configurar o EF Core: pacotes e ligação", "type": "code", "code": "// packages (Api project)\ndotnet add package Microsoft.EntityFrameworkCore.SqlServer\ndotnet add package Microsoft.EntityFrameworkCore.Design\n\n// CLI tool (once per machine)\ndotnet tool install --global dotnet-ef\n\n// appsettings.json\n\"ConnectionStrings\": {\n  \"BankingApp\": \"Server=...;Database=BankingApp\"\n}", "points": ["SqlServer é o provider: traduz o C# para SQL Server.", "Design dá ao dotnet ef o que precisa para gerar migrations.", "dotnet-ef é a ferramenta de linha de comandos.", "A connection string vive na configuração, nunca no código."], "lang": "cs", "more": {"more": "São precisos três elementos: o pacote do provider (Microsoft.EntityFrameworkCore.SqlServer), o pacote Design (para gerar migrations) e a ferramenta global dotnet-ef. A connection string fica no appsettings, e não no código.", "pit": "Instalar o pacote Design só no projeto errado. Os comandos dotnet ef precisam de o encontrar no projeto de arranque."}}, {"id": "m2-37", "t": "DbContext e ligação", "type": "code", "code": "public class BankingAppContext : DbContext\n{\n    public BankingAppContext(\n        DbContextOptions<BankingAppContext> options)\n        : base(options) { }\n\n    public DbSet<Customer> Customers => Set<Customer>();\n    public DbSet<Account> Accounts => Set<Account>();\n}\n\n// Program.cs\nbuilder.Services.AddDbContext<BankingAppContext>(o =>\n    o.UseSqlServer(cs));", "points": ["O DbContext agrupa as tabelas disponíveis.", "É registado no container, com tempo de vida Scoped.", "UseSqlServer escolhe o provider.", "A connection string vem da configuração."], "lang": "cs", "more": {"more": "O DbContext representa uma sessão com a base de dados. Cada DbSet<T> é uma tabela. É registado no container com AddDbContext, que o torna Scoped, e recebe as opções (provider e connection string) no construtor."}}, {"id": "m2-38", "t": "Configurar o modelo", "type": "code", "code": "protected override void OnModelCreating(ModelBuilder mb)\n{\n    mb.Entity<Account>(e =>\n    {\n        e.Property(a => a.Number).HasMaxLength(20);\n        e.HasIndex(a => a.Number).IsUnique();\n        e.Property(a => a.Balance).HasPrecision(18, 2);\n        e.HasOne(a => a.Customer)\n            .WithMany(c => c.Accounts)\n            .HasForeignKey(a => a.CustomerId);\n    });\n}", "points": ["As convenções resolvem o simples; a Fluent API resolve o resto.", "Tamanhos, índices e precisão decimal.", "A relação entre entidades.", "Fica no DbContext, fora das entidades."], "lang": "cs", "more": {"more": "As convenções cobrem o caso simples. Para o resto usa a Fluent API no OnModelCreating: tamanhos máximos, índices únicos (por exemplo, no número da conta), precisão de decimais e relações. Fica no DbContext, e as entidades continuam livres de detalhes de base de dados.", "pit": "Esquecer a precisão do decimal. O EF avisa, e o valor pode ser truncado na base de dados."}}, {"id": "m2-39", "t": "Migrations: criar a primeira", "type": "code", "code": "dotnet ef migrations add Initial\n\nMigrations/\n  20261022101500_Initial.cs\n  BankingAppContextModelSnapshot.cs\n\n// 20261022101500_Initial.cs (generated)\nprotected override void Up(MigrationBuilder mb)\n{\n    mb.CreateTable(\n        name: \"Accounts\",\n        columns: table => new { ... });\n}\n\nprotected override void Down(MigrationBuilder mb)\n    => mb.DropTable(name: \"Accounts\");", "points": ["migrations add compara o modelo com o snapshot e gera o código.", "Up aplica a alteração; Down desfaz.", "O snapshot guarda o último estado do modelo.", "Rever o ficheiro gerado antes de o aplicar."], "lang": "cs", "more": {"more": "dotnet ef migrations add compara o modelo atual com o snapshot da última migration e gera um ficheiro C# com os métodos Up (aplicar) e Down (desfazer). Lê sempre o ficheiro gerado antes de o aplicar: é aí que vês, por exemplo, uma coluna que ia ser apagada."}}, {"id": "m2-40", "t": "Migrations: atualizar a base de dados", "type": "code", "code": "dotnet ef database update\n// applies the pending migrations\n\n// the model changes: Customer gets TaxId\ndotnet ef migrations add AddTaxId\ndotnet ef database update\n\n// go back to a previous migration\ndotnet ef database update Initial\n\n// drop the last migration (not applied)\ndotnet ef migrations remove\n\n// SQL script for production\ndotnet ef migrations script --idempotent", "points": ["database update cria a base de dados, se faltar, e aplica o que está pendente.", "A tabela __EFMigrationsHistory regista o que já foi aplicado.", "Cada alteração ao modelo gera uma nova migration.", "Em produção usa-se um script SQL revisto."], "lang": "cs", "more": {"more": "dotnet ef database update cria a base de dados, se não existir, e aplica as migrations pendentes. A tabela __EFMigrationsHistory regista o que já foi aplicado, por isso podes correr o comando várias vezes. Em produção não se aplica diretamente: gera-se um script SQL, revê-se e executa-se com o processo normal de Release.", "tryit": "Acrescenta uma propriedade a Account, cria uma nova migration e abre o ficheiro gerado."}}, {"id": "m2-41", "t": "Consultar dados", "type": "code", "code": "var highBalance = await _ctx.Accounts\n    .Where(a => a.Balance > 300m)\n    .OrderBy(a => a.Number)\n    .ToListAsync();\n\nvar account = await _ctx.Accounts\n    .Include(a => a.Customer)\n    .FirstOrDefaultAsync(a => a.Number == number);\n\nvar total = await _ctx.Accounts\n    .Where(a => a.CustomerId == id)\n    .SumAsync(a => a.Balance);", "points": ["É o LINQ e o IQueryable que já conheces.", "Include carrega a relação na mesma consulta.", "Os métodos Async libertam a thread.", "AsNoTracking acelera as consultas só de leitura."], "lang": "cs", "more": {"more": "Consultar com o EF é usar o LINQ que já conheces sobre um DbSet. Include carrega a relação na mesma consulta (um JOIN). Os métodos Async (ToListAsync, FirstOrDefaultAsync) libertam a thread. AsNoTracking diz ao EF que não vais alterar os resultados, o que torna a consulta mais leve."}}, {"id": "m2-42", "t": "Gravar alterações", "type": "code", "code": "var c = new Customer { Name = \"Ana\" };\n_ctx.Customers.Add(c);           // new\nawait _ctx.SaveChangesAsync();  // INSERT\n\nc.Name = \"Ana Pereira\";         // changed\nawait _ctx.SaveChangesAsync();  // UPDATE\n\n_ctx.Customers.Remove(c);        // removed\nawait _ctx.SaveChangesAsync();  // DELETE", "points": ["O EF acompanha as entidades que carrega.", "Nada vai para a base de dados até SaveChangesAsync.", "Todas as alterações de um SaveChanges correm numa transação.", "Alterar a propriedade basta: não há «update» explícito."], "lang": "cs", "more": {"more": "O EF acompanha as entidades que carrega (change tracking). Alteras uma propriedade, chamas SaveChangesAsync, e o EF gera o UPDATE só dos campos alterados, tudo numa transação. Para inserir, Add + SaveChangesAsync.", "pit": "Esquecer o SaveChangesAsync. Não há erro e nada fica gravado."}}, {"id": "m2-43", "t": "Armadilhas comuns", "type": "cards", "items": [{"t": "Consulta em ciclo (N+1)", "d": ["Carregar a relação dentro de um ciclo faz uma consulta por linha. Usar Include."]}, {"t": "ToList cedo demais", "d": ["Chamar ToList antes do Where traz a tabela toda para memória."]}, {"t": "Esquecer o SaveChanges", "d": ["Sem SaveChangesAsync, nada é gravado e nenhum erro aparece."]}, {"t": "DbContext e threads", "d": ["O DbContext não é seguro entre threads: não o partilhar em tarefas paralelas."]}], "more": {"more": "O N+1 acontece quando carregas uma lista (1 consulta) e depois acedes a uma relação de cada item (N consultas). Include resolve com um JOIN. ToList antes do Where traz tudo para memória. Estes dois erros não dão exceção: só se notam na lentidão, por isso convém olhar para o SQL gerado (LogTo ou o log do EF)."}}, {"id": "m2-44", "t": "Persistir as contas", "type": "exercise", "steps": [{"lead": "Modelo", "text": "entidades Customer e Account e o BankingAppContext"}, {"lead": "Configurar", "text": "índice único em Number e precisão do Balance"}, {"lead": "Migration", "text": "criar a migration Initial e aplicá-la à base de dados"}, {"lead": "Substituir", "text": "a lista em memória pelo DbContext nos três endpoints"}, {"lead": "Devolver", "text": "o nome do cliente na resposta, com Include"}], "expected": "Accounts\nId Number  Balance CustomerId\n 1 AC-001  320.00 1\n 2 AC-002  150.00 1\n\nCustomers\nId Name\n 1 Ana Pereira", "extra": "Criar uma consulta que devolve o total de saldos por cliente, calculado na base de dados.", "more": {"more": "Só passas ao capítulo seguinte quando o resultado esperado aparecer no teu computador. Se algo falhar, lê a mensagem de erro de baixo para cima: a última linha costuma dizer o que correu mal.", "tryit": "Criar uma consulta que devolve o total de saldos por cliente, calculado na base de dados."}}], "quiz": [{"q": "Em code-first, qual é a fonte de verdade do esquema?", "o": ["A base de dados", "As classes C# e as migrations", "O SQL escrito à mão", "O Swagger"], "a": 1, "w": "Escreves o modelo e o EF gera o esquema."}, {"q": "Porque é perigoso chamar ToList antes do Where num DbSet?", "o": ["Não compila", "Traz a tabela toda para memória", "Apaga linhas", "Desativa o tracking"], "a": 1, "w": "O filtro passa a correr em memória e não na base de dados."}, {"q": "Alteraste uma propriedade de uma entidade carregada. Que falta para gravar?", "o": ["Chamar Update()", "Chamar SaveChangesAsync()", "Nada, grava sozinho", "Criar uma migration"], "a": 1, "w": "O EF deteta a alteração, mas só grava em SaveChangesAsync."}, {"q": "O que regista a tabela __EFMigrationsHistory?", "o": ["Os erros do EF", "As migrations já aplicadas", "Os dados apagados", "As connection strings"], "a": 1, "w": "É assim que o EF sabe o que ainda falta aplicar."}]}, {"id": "dotnet-5", "t": "Testes unitários", "intro": "Provar que o código funciona com testes rápidos e isolados.", "lessons": [{"id": "m2-46", "t": "A pirâmide de testes", "type": "pyramid", "items": [{"t": "Unitário", "d": ["Uma classe ou método isolado, sem base de dados nem rede."]}, {"t": "Integração", "d": ["Várias peças reais juntas, como a API e a base de dados."]}, {"t": "Ponta a ponta", "d": ["O sistema completo, como um utilizador o usa."]}], "levels": [{"n": "Ponta a ponta", "d": "poucos, lentos"}, {"n": "Integração", "d": "alguns"}, {"n": "Unitários", "d": "muitos, rápidos"}]}, {"id": "m2-47", "t": "O primeiro teste com xUnit", "type": "code", "code": "public class PromoInterestTests\n{\n    [Fact]\n    public void Calculate_Rate2Percent_Returns2PercentOfBalance()\n    {\n        // Arrange\n        var calc = new PromoInterest(0.02m);\n        var acc = new Account(\"AC-001\", ana, 200m);\n\n        // Act\n        var result = calc.Calculate(acc);\n\n        // Assert\n        Assert.Equal(4m, result);\n    }\n}", "points": ["[Fact] marca um teste.", "Arrange: preparar os objetos.", "Act: executar o que se testa.", "Assert: verificar o resultado."], "lang": "cs", "more": {"more": "Um teste unitário segue três passos: Arrange (preparar), Act (executar), Assert (verificar). [Fact] marca o método como teste. Um bom teste lê-se como uma frase: dado este contexto, quando fizer isto, então acontece aquilo."}}, {"id": "m2-48", "t": "Vários casos: Theory", "type": "code", "code": "[Theory]\n[InlineData(0, 200, 0)]\n[InlineData(2, 200, 4)]\n[InlineData(5, 200, 10)]\npublic void Calculate_AppliesRate(\n    int ratePercent, int balance, int expected)\n{\n    var calc = new PromoInterest(ratePercent / 100m);\n    var acc = new Account(\"AC-001\", ana, balance);\n\n    Assert.Equal(expected, calc.Calculate(acc));\n}", "points": ["[Theory] corre o mesmo teste com vários dados.", "[InlineData] fornece cada caso.", "Cada caso aparece como um teste separado.", "Bom para limites e valores especiais."], "lang": "cs", "more": {"more": "[Theory] corre o mesmo teste com vários dados fornecidos por [InlineData]. Cada caso aparece como teste separado no relatório. É a ferramenta certa para valores-limite: 0, 1, o máximo, o valor negativo."}}, {"id": "m2-49", "t": "Verificações úteis", "type": "code", "code": "Assert.Equal(180m, result);\nAssert.True(account.IsActive);\nAssert.False(list.Any());\nAssert.Null(result);\nAssert.Contains(\"AC-001\", numbers);\nAssert.Empty(list);\n\n// exceptions\nvar ex = Assert.Throws<InvalidAccountException>(\n    () => new Account(\"AC-001\", ana, -5m));\nAssert.Equal(\"AC-001\", ex.Number);", "points": ["Cada Assert verifica uma coisa.", "Throws confirma que a exceção certa é lançada.", "O teste falha à primeira verificação que falhar.", "Para exceções assíncronas, usar ThrowsAsync."], "lang": "cs", "more": {"more": "Assert.Equal, True, False, Null, Contains, Single... cada um verifica uma coisa. Assert.Throws<T> confirma que um código lança a exceção certa; para métodos async usa Assert.ThrowsAsync<T> com await."}}, {"id": "m2-50", "t": "Isolar dependências com mocks", "type": "code", "code": "var repo = Substitute.For<IAccountRepository>();\nrepo.GetAsync(\"AC-001\")\n    .Returns(new Account(\"AC-001\", ana, 200m));\n\nvar service = new AccountService(\n    repo, new PromoInterest(0.02m));\n\nvar interest = await service.CalculateAsync(\"AC-001\");\n\nAssert.Equal(4m, interest);\nawait repo.Received(1).GetAsync(\"AC-001\");", "points": ["Um mock é um objeto falso que substitui uma dependência.", "Define o que devolve e verifica como foi chamado.", "O serviço é testado sem base de dados.", "Só funciona porque a dependência é uma interface."], "lang": "cs", "more": {"more": "Um mock substitui uma dependência por um objeto falso que controlas: defines o que devolve e depois verificas como foi chamado. Com NSubstitute, Substitute.For<IAccountRepository>() cria o falso. Só funciona porque a dependência é uma interface, e é por isso que a Dependency Injection e os testes andam juntos."}}, {"id": "m2-51", "t": "Boas práticas", "type": "cards", "items": [{"t": "Nomes que explicam", "d": ["Method_Scenario_Result: ao ver o nome de um teste que falha, percebe-se o problema."]}, {"t": "Um comportamento por teste", "d": ["Se um teste falha, deve ser óbvio o que partiu. Evitar testes longos."]}, {"t": "Independentes e rápidos", "d": ["Sem ordem entre testes, sem base de dados e sem rede. Devem correr em segundos."]}, {"t": "Testar o teu código", "d": ["Não testar o framework: confiar que o EF e o ASP.NET Core fazem o que prometem."]}], "more": {"more": "Method_Scenario_Result, por exemplo Calculate_PromoRate_ReturnsInterest. Quando este teste falhar no CI, o nome já diz o que se partiu, sem abrir o código."}}, {"id": "m2-52", "t": "Testar o saldo", "type": "exercise", "steps": [{"lead": "Três testes", "text": "[Fact] para PromoInterest: taxa 0%, 2% e 5%"}, {"lead": "Um Theory", "text": "com [InlineData] para os mesmos cálculos"}, {"lead": "Uma exceção", "text": "InvalidAccountException para um saldo negativo"}, {"lead": "Um mock", "text": "do repositório para testar o AccountService"}], "expected": "dotnet test\n\nPassed!  - Failed:     0,\n           Passed:     8,\n           Skipped:    0,\n           Total:      8", "extra": "Gerar o relatório de cobertura de testes e identificar uma classe sem testes. Dica: nuget dotnet-reportgenerator", "more": {"more": "Só passas ao capítulo seguinte quando o resultado esperado aparecer no teu computador. Se algo falhar, lê a mensagem de erro de baixo para cima: a última linha costuma dizer o que correu mal.", "tryit": "Gerar o relatório de cobertura de testes e identificar uma classe sem testes. Dica: nuget dotnet-reportgenerator"}}], "quiz": [{"q": "O que representa o 'Arrange' num teste?", "o": ["Executar o código", "Preparar os objetos e os dados", "Verificar o resultado", "Limpar a base de dados"], "a": 1, "w": "Arrange, Act, Assert: preparar, executar, verificar."}, {"q": "Quando usar [Theory] em vez de [Fact]?", "o": ["Quando o teste é lento", "Quando o mesmo teste corre com vários dados", "Quando há exceções", "Quando há mocks"], "a": 1, "w": "[InlineData] fornece cada caso e cada um aparece como teste separado."}, {"q": "Porque é que um mock exige que a dependência seja uma interface?", "o": ["Por regra do xUnit", "Porque é preciso poder substituí-la por um falso", "Porque o EF o exige", "Não exige"], "a": 1, "w": "Sem interface (ou método virtual), não há como substituir a implementação."}]}, {"id": "dotnet-6", "t": "Organização do código", "intro": "Separar responsabilidades em camadas para o código poder crescer sem se complicar.", "lessons": [{"id": "m2-54", "t": "Porque organizar em camadas", "type": "cards", "items": [{"t": "O problema", "d": ["Controllers que validam, calculam e falam com a base de dados são difíceis de testar e de alterar."]}, {"t": "A ideia", "d": ["Cada parte tem uma responsabilidade: receber pedidos, aplicar regras, guardar dados."]}, {"t": "O ganho", "d": ["Mudar a base de dados ou a API não obriga a reescrever as regras de negócio."]}, {"t": "", "d": ["Neste capítulo, a API dos exercícios anteriores é reorganizada em camadas."], "note": true}], "more": {"more": "Um controller que valida, calcula os juros e fala com a base de dados faz três trabalhos. Para o testar tens de ter base de dados; para trocar a base de dados mexes no controller. Dividir em camadas dá a cada parte um motivo único para mudar."}}, {"id": "m2-55", "t": "Clean Architecture", "type": "layers", "items": [{"t": "TextBox 3", "d": ["As dependências apontam para dentro.", "O Domínio não conhece o EF Core nem o ASP.NET Core.", "As interfaces ficam dentro; as implementações, fora.", "Infraestrutura e API", "Aplicação"]}, {"t": "Domínio entidades e regras", "d": []}], "rules": ["As dependências apontam para dentro.", "O Domínio não conhece o EF Core nem o ASP.NET Core.", "As interfaces ficam dentro; as implementações, fora."], "levels": [{"n": "Infraestrutura e API", "d": "EF Core, HTTP"}, {"n": "Aplicação", "d": "casos de uso"}, {"n": "Domínio", "d": "entidades e regras"}], "more": {"more": "Imagina círculos concêntricos. No centro estão as regras do negócio, que mudam pouco. Nas camadas de fora estão os detalhes técnicos (base de dados, HTTP), que mudam mais. Uma camada só pode conhecer as que estão mais para dentro.\n\nO truque que torna isto possível é a inversão de dependência: a Application declara a interface IAccountRepository e a Infrastructure implementa-a. No Módulo 5 constróis exatamente isto.", "tryit": "Pergunta a ti próprio, para cada classe que escreves: em que círculo vive? E o que é que ela precisa de conhecer?"}}, {"id": "m2-56", "t": "Estrutura da solução", "type": "code", "code": "BankingApp.sln\n├─ BankingApp.Domain          entities and rules\n├─ BankingApp.Application     use cases\n├─ BankingApp.Infrastructure  EF Core\n├─ BankingApp.Api             controllers\n└─ BankingApp.Tests           tests\n\nApi            -> Application, Infrastructure\nInfrastructure -> Application\nApplication    -> Domain\nDomain         -> (nothing)", "points": ["Um projeto por camada.", "As referências impõem a regra das dependências.", "O Domínio não referencia nada.", "Só a Api conhece a Infrastructure, para a registar."], "lang": "cs", "more": {"more": "Cada camada é um projeto. As referências entre projetos impõem a regra: Domain não referencia nada; Application referencia Domain; Infrastructure referencia Application; Api referencia Application e Infrastructure (só para registar). Se alguém tentar usar o EF Core no Domain, o código não compila."}}, {"id": "m2-57", "t": "O repositório", "type": "code", "code": "// Application: the contract\npublic interface IAccountRepository\n{\n    Task<Account?> GetAsync(string number);\n    Task AddAsync(Account account);\n}\n\n// Infrastructure: the implementation\npublic class AccountRepository : IAccountRepository\n{\n    private readonly BankingAppContext _ctx;\n    public AccountRepository(BankingAppContext c)\n        => _ctx = c;\n\n    public Task<Account?> GetAsync(string number)\n        => _ctx.Accounts.FirstOrDefaultAsync(\n            a => a.Number == number);\n}", "points": ["O contrato fica na Aplicação.", "A implementação com EF Core fica na Infrastructure.", "O resto do código só conhece a interface.", "Trocar a base de dados é trocar a implementação."], "lang": "cs", "more": {"more": "O repositório é um contrato definido na Application (IAccountRepository) e implementado na Infrastructure com o EF Core. Os handlers só conhecem a interface. Para trocar de base de dados escreves outra implementação e mudas o registo no container."}}, {"id": "m2-58", "t": "CQRS: comandos e consultas", "type": "cards", "items": [{"t": "Comando", "d": ["Pede uma alteração de estado e não devolve dados de negócio. Exemplo: OpenAccount, CloseAccount."]}, {"t": "Consulta", "d": ["Lê dados e nunca altera o estado. Exemplo: GetAccount, ListCustomerAccounts."]}, {"t": "Handler", "d": ["Uma classe por comando ou consulta, com um só método. Recebe o pedido e devolve o resultado."]}, {"t": "", "d": ["Regra simples: se altera o estado, é um comando; se só lê, é uma consulta."], "note": true}], "more": {"more": "CQRS (Command Query Responsibility Segregation) separa quem altera de quem lê. Aqui aplica-se na forma simples: classes pequenas, uma por caso de uso. Não é preciso nenhuma biblioteca. Se um dia a equipa adotar uma biblioteca de mediação, confirma primeiro a licença."}}, {"id": "m2-59", "t": "Handlers", "type": "code", "code": "public record OpenAccountCommand(\n    string Number, int CustomerId, decimal Balance);\n\npublic class OpenAccountHandler\n{\n    private readonly IAccountRepository _repo;\n    public OpenAccountHandler(IAccountRepository repo)\n        => _repo = repo;\n\n    public async Task<string> Handle(OpenAccountCommand c)\n    {\n        var acc = new Account(\n            c.Number, c.CustomerId, c.Balance);\n        await _repo.AddAsync(acc);\n        return acc.Number;\n    }\n}", "points": ["O comando é um objeto só com dados.", "O handler contém a lógica do caso de uso.", "O controller só chama o handler.", "Cada handler é testável sozinho."], "lang": "cs", "more": {"more": "O comando é um objeto só com dados (por exemplo, um record OpenAccountCommand). O handler tem um método HandleAsync com a lógica do caso de uso. O controller só converte o DTO em comando e chama o handler. Como o handler depende de interfaces, testa-se sozinho com mocks.", "tryit": "Escreve um teste ao OpenAccountHandler com um IAccountRepository falso que diz que o número já existe."}}, {"id": "m2-60", "t": "O percurso de um pedido", "type": "cards", "items": [{"t": "Pedido", "d": ["POST /api/accounts"]}, {"t": "Controller", "d": ["valida o DTO"]}, {"t": "Handler", "d": ["aplica as regras"]}, {"t": "Repositório", "d": ["fala com o EF Core"]}, {"t": "Base de dados", "d": ["INSERT"]}, {"t": "", "d": ["O controller converte HTTP em comandos e consultas.", "O handler decide; o repositório guarda.", "A resposta faz o caminho inverso, com o código HTTP certo."], "note": true}], "flow": 5, "more": {"more": "Segue o pedido de um POST /api/accounts: o controller converte HTTP em comando, o handler decide, o repositório guarda e a resposta faz o caminho inverso. Cada passo tem uma só responsabilidade, por isso podes testar e alterar cada um sem mexer nos outros.", "tryit": "Abre o Módulo 5 e usa o explorador «Percurso de um pedido» para ver este caminho com código real."}}, {"id": "m2-61", "t": "A API em camadas", "type": "exercise", "steps": [{"lead": "Projetos", "text": "criar Domain, Application e Infrastructure e referenciá-los pela ordem certa"}, {"lead": "Mover", "text": "as entidades para o Domain e o DbContext para a Infrastructure"}, {"lead": "Repositório", "text": "IAccountRepository na Application, implementado na Infrastructure"}, {"lead": "Handlers", "text": "OpenAccount e GetAccount, injetados no controller"}, {"lead": "Verificar", "text": "que os testes continuam a passar e que o Domain não referencia o EF Core"}], "expected": "Api            -> Application\n               Infrastructure\nInfrastructure -> Application\nApplication    -> Domain\nDomain         -> (nothing)", "extra": "Acrescentar a consulta ListCustomerAccounts com o seu handler.", "more": {"more": "Só passas ao capítulo seguinte quando o resultado esperado aparecer no teu computador. Se algo falhar, lê a mensagem de erro de baixo para cima: a última linha costuma dizer o que correu mal.", "tryit": "Acrescentar a consulta ListCustomerAccounts com o seu handler."}}], "quiz": [{"q": "Que projeto não referencia nenhum outro numa Clean Architecture?", "o": ["Api", "Infrastructure", "Application", "Domain"], "a": 3, "w": "As dependências apontam para dentro, e o Domain está no centro."}, {"q": "Onde fica a interface IAccountRepository e onde a sua implementação?", "o": ["Ambas no Domain", "Interface na Application, implementação na Infrastructure", "Ambas na Api", "Interface na Infrastructure, implementação na Application"], "a": 1, "w": "Quem usa o contrato define-o; quem fala com o EF Core implementa-o."}, {"q": "Qual a regra simples do CQRS?", "o": ["Tudo é um comando", "Se altera o estado é comando; se só lê é consulta", "Comandos são sempre assíncronos", "Consultas usam sempre cache"], "a": 1, "w": "Comandos pedem alterações; consultas só leem."}, {"q": "Qual o papel do controller no percurso de um pedido?", "o": ["Aplicar as regras de negócio", "Converter HTTP em comandos e consultas", "Gerar SQL", "Guardar dados"], "a": 1, "w": "O handler decide, o repositório guarda e o controller traduz HTTP."}]}], "outro": {"done": ["Explicar como o .NET compila e executa o código", "Construir uma API com ASP.NET Core", "Usar Dependency Injection", "Aceder à base de dados com o EF Core", "Escrever testes unitários e organizar em camadas"], "docs": [{"t": "Documentação do .NET", "u": "https://learn.microsoft.com/dotnet/"}, {"t": "ASP.NET Core", "u": "https://learn.microsoft.com/aspnet/core/"}, {"t": "Entity Framework Core", "u": "https://learn.microsoft.com/ef/core/"}, {"t": "xUnit", "u": "https://xunit.net/"}], "practice": ["Acrescentar um endpoint novo à API", "Criar uma migration para um campo novo", "Escrever testes para um handler", "Trocar uma implementação só no Program.cs"]}}, {"id": "auth", "num": 4, "kind": "course", "title": "Autenticação e Autorização", "short": "Autenticação", "tagline": "A diferença entre Basic Auth e OAuth 2.0, como funciona um JWT e um hands-on onde emites, validas e proteges com tokens.", "chapters": [{"id": "auth-1", "t": "Autenticação e autorização", "intro": "Duas perguntas diferentes que se confundem: quem és? E o que podes fazer?", "lessons": [{"id": "au-1-1", "t": "Duas perguntas diferentes", "type": "cards", "items": [{"t": "Autenticação", "d": ["Quem és?", "Verificar a identidade com uma password, um token ou um certificado.", "Se falha: 401 Unauthorized."]}, {"t": "Autorização", "d": ["O que podes fazer?", "Decidir o que uma identidade já conhecida pode fazer.", "Se falha: 403 Forbidden."]}, {"t": "", "d": ["A autenticação vem sempre primeiro: só se decide o que alguém pode fazer depois de saber quem é.", "Num banco: o login autentica a Ana. Ver a conta da Ana é uma decisão de autorização."], "note": true}], "more": {"more": "Uma imagem útil: o seguro de um hotel. Na receção mostras o cartão de cidadão e recebes um cartão de quarto (autenticação). O cartão só abre a tua porta, e não a dos outros quartos nem a do cofre (autorização).\n\nEm inglês aparecem as abreviaturas AuthN (authentication) e AuthZ (authorization). Quando alguém diz «auth» sem mais, pergunta qual das duas.", "pit": "Chamar «não autorizado» ao 401. O nome do código HTTP é Unauthorized, mas significa «não autenticado». O 403 é que significa «sei quem és e não podes»."}}, {"id": "au-1-2", "t": "401 ou 403?", "type": "table", "rows": [["Situação", "Código", "Porquê"], ["Pedido sem token", "401", "Não sabemos quem é."], ["Token expirado ou com a assinatura alterada", "401", "A identidade não foi provada."], ["Cliente a chamar um endpoint só de gestores", "403", "Sabemos quem é, e o papel não chega."], ["Cliente a pedir a conta de outro cliente", "404", "Responder 404 em vez de 403 não revela que a conta existe."], ["Email ou password errados no login", "401", "A mesma resposta para os dois casos, para não revelar que emails existem."]], "note": "O 401 pede que te voltes a autenticar. O 403 não adianta voltar a tentar com as mesmas credenciais.", "more": {"more": "O 404 para recursos de outros utilizadores é uma decisão de segurança: com o 403 estás a confirmar que o recurso existe. Num banco, confirmar que um número de conta existe já é informação a mais."}}, {"id": "au-1-3", "t": "Onde entra no pipeline", "type": "code", "lang": "cs", "code": "var app = builder.Build();\n\napp.UseHttpsRedirection();\n\napp.UseAuthentication();   // 1. who are you?  Reads the credentials and builds the User\napp.UseAuthorization();    // 2. can you do this?  Checks [Authorize] against the User\n\napp.MapControllers();\napp.Run();", "points": ["UseAuthentication lê as credenciais e preenche o User.", "UseAuthorization decide, com o User já preenchido.", "A ordem importa: a autorização depende da autenticação.", "Ambos vêm antes do MapControllers."], "more": {"more": "Se trocares a ordem, a autorização corre com um utilizador anónimo e todos os endpoints protegidos respondem 401, mesmo com um token válido. É um erro clássico: o token está certo, o pipeline é que está pela ordem errada.", "pit": "Esquecer o UseAuthentication. O [Authorize] passa a responder sempre 401."}}, {"id": "au-1-4", "t": "Identidade, claims e papéis", "type": "cards", "items": [{"t": "Claim", "d": ["Uma afirmação sobre o utilizador.", "Par nome-valor: name = Ana Pereira."]}, {"t": "ClaimsPrincipal", "d": ["O User no ASP.NET Core.", "Agrupa as claims de uma identidade."]}, {"t": "Role (papel)", "d": ["Um grupo de permissões: Customer, Manager.", "É só uma claim especial."]}, {"t": "Policy", "d": ["Uma regra com nome.", "Combina papéis e claims: «gestor do departamento de crédito»."]}], "more": {"more": "Depois de a autenticação correr, o ASP.NET Core constrói um ClaimsPrincipal com as claims do token. Tudo o que se segue (papéis, políticas, o id do cliente) lê desse objeto.\n\nUm papel é uma claim com um tipo reconhecido como «role». Uma policy é uma regra com nome que podes reutilizar em vários endpoints."}}], "quiz": [{"q": "Um pedido chega sem token a um endpoint protegido. Que código devolve a API?", "o": ["200", "401", "403", "404"], "a": 1, "w": "Sem token não sabemos quem é: é um problema de autenticação, 401."}, {"q": "Um cliente autenticado chama um endpoint só para gestores. Que código?", "o": ["401", "403", "404", "500"], "a": 1, "w": "Sabemos quem é, mas o papel não chega: 403 Forbidden."}, {"q": "Qual é a ordem correta no Program.cs?", "o": ["UseAuthorization, UseAuthentication", "UseAuthentication, UseAuthorization", "Tanto faz", "Só é preciso UseAuthorization"], "a": 1, "w": "Primeiro identificas (autenticação), depois decides (autorização)."}, {"q": "Porque devolve o sistema 404 para a conta de outro cliente?", "o": ["Para poupar um pedido", "Para não revelar que a conta existe", "Porque o 403 não existe", "Porque a base de dados falhou"], "a": 1, "w": "Um 403 confirmaria que o recurso existe. O 404 trata-o como se não existisse."}]}, {"id": "auth-2", "t": "Basic Authentication", "intro": "O mecanismo mais simples: enviar o utilizador e a password em cada pedido. Percebe porque deixou de ser suficiente.", "lessons": [{"id": "au-2-1", "t": "Como funciona", "type": "cards", "flow": 3, "items": [{"t": "Pedido", "d": ["O cliente chama um endpoint protegido sem credenciais."]}, {"t": "Desafio", "d": ["A API responde 401 com o cabeçalho WWW-Authenticate: Basic."]}, {"t": "Credenciais", "d": ["O cliente repete o pedido com Authorization: Basic base64(user:password)."]}, {"t": "", "d": ["O servidor valida o utilizador e a password em todos os pedidos.", "Não há sessão nem token: as credenciais viajam sempre."], "note": true}], "more": {"more": "O Basic Auth faz parte do próprio protocolo HTTP (RFC 7617). É suportado por qualquer cliente HTTP sem código adicional, o que o torna útil em ferramentas internas e em testes rápidos."}}, {"id": "au-2-2", "t": "O cabeçalho por dentro", "type": "code", "lang": "sh", "code": "# the client joins \"user:password\" and encodes it in base64\necho -n 'ana@example.com:Passw0rd!' | base64\n# YW5hQGV4YW1wbGUuY29tOlBhc3N3MHJkIQ==\n\n# the header sent on EVERY request\nAuthorization: Basic YW5hQGV4YW1wbGUuY29tOlBhc3N3MHJkIQ==\n\n# base64 is an encoding, not encryption: anyone can reverse it\necho 'YW5hQGV4YW1wbGUuY29tOlBhc3N3MHJkIQ==' | base64 -d\n# ana@example.com:Passw0rd!\n\n# curl does the same with -u\ncurl -u 'ana@example.com:Passw0rd!' https://localhost:5001/api/dashboard", "points": ["O valor é «user:password» em base64.", "Base64 é uma codificação, não encriptação.", "Qualquer pessoa que veja o pedido recupera a password.", "O cabeçalho vai em todos os pedidos."], "more": {"more": "Por isso o Basic só é aceitável sobre HTTPS. Mesmo assim, a password sai do cliente em cada pedido e passa por proxies, logs e ferramentas de depuração que registam cabeçalhos.", "tryit": "Corre o primeiro comando com uma password tua e depois o segundo comando para a recuperar. Dá para sentir o problema."}}, {"id": "au-2-3", "t": "Os limites do Basic Auth", "type": "table", "rows": [["Problema", "Consequência"], ["A password viaja em todos os pedidos", "Mais oportunidades de ser intercetada ou registada em logs."], ["A API vê a password do utilizador", "Uma aplicação de terceiros teria de receber a tua password do banco."], ["Não expira", "Só deixa de funcionar se mudares a password."], ["Sem âmbito (scope)", "Quem tem as credenciais pode fazer tudo."], ["Sem revogação parcial", "Para cortar o acesso a uma aplicação tens de mudar a password, e todas as outras aplicações perdem acesso."], ["Sem autenticação multifator", "Não há onde encaixar um segundo fator."]], "more": {"more": "Estes limites são a razão de ser do OAuth 2.0: dar a uma aplicação um acesso limitado, temporário e revogável, sem lhe entregar a password."}}, {"id": "au-2-4", "t": "Descodificar um cabeçalho Basic", "type": "exercise", "steps": [{"lead": "Codificar", "text": "gerar o base64 de «rui@example.com:Passw0rd!» com o comando echo -n ... | base64"}, {"lead": "Descodificar", "text": "recuperar o texto original com base64 -d"}, {"lead": "Pedido", "text": "com curl -u, chamar https://httpbin.org/basic-auth/rui/pass e ver a resposta 401 ou 200"}, {"lead": "Concluir", "text": "escrever numa frase porque é que o Basic Auth não serve para uma aplicação móvel de um banco"}], "expected": "rui@example.com:Passw0rd!\n\n(a descodificação devolve exatamente o texto original)", "hint": "Se estiveres no Windows, usa o Git Bash ou o PowerShell: [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(\"rui@example.com:Passw0rd!\")).", "more": {"more": "O objetivo é sentires que o base64 não protege nada. Se conseguires descodificar em dois segundos, qualquer pessoa também consegue."}}], "quiz": [{"q": "O que protege o base64 do cabeçalho Basic?", "o": ["A password, porque é cifrada", "Nada: é só uma codificação reversível", "O utilizador, porque é anónimo", "O servidor, porque valida o tamanho"], "a": 1, "w": "Base64 não é segurança. Qualquer pessoa o descodifica."}, {"q": "Com que frequência são enviadas as credenciais no Basic Auth?", "o": ["Só no primeiro pedido", "Em todos os pedidos", "Uma vez por hora", "Nunca"], "a": 1, "w": "Não há sessão nem token: o cabeçalho vai em todos os pedidos."}, {"q": "Qual destes é um limite do Basic Auth?", "o": ["Não funciona em HTTPS", "A aplicação cliente tem de conhecer a password", "É demasiado lento", "Só funciona com .NET"], "a": 1, "w": "A aplicação cliente guarda e envia a password do utilizador, e não há acesso limitado nem revogável."}]}, {"id": "auth-3", "t": "OAuth 2.0 e OpenID Connect", "intro": "Delegar acesso sem partilhar a password: os papéis, os fluxos e os tipos de token.", "lessons": [{"id": "au-3-1", "t": "A ideia: delegar sem partilhar a password", "type": "cards", "items": [{"t": "Sem OAuth", "d": ["Uma aplicação de gestão de despesas pede o teu email e a password do banco.", "Fica com acesso a tudo, para sempre."]}, {"t": "Com OAuth", "d": ["A aplicação envia-te ao banco para te autenticares lá.", "Recebe um token com acesso só às contas, durante 15 minutos.", "Podes revogá-lo sem mudar a password."]}, {"t": "", "d": ["OAuth 2.0 é um protocolo de autorização (delegação de acesso). Não define como o utilizador se autentica."], "note": true}], "more": {"more": "A comparação clássica é a chave de manobrista: abre a porta e liga o carro, mas não abre a mala nem o porta-luvas, e podes recuperá-la a qualquer momento. O token OAuth é isso, para uma API."}}, {"id": "au-3-2", "t": "Os quatro papéis", "type": "cards", "items": [{"t": "Resource Owner", "d": ["O dono dos dados.", "O cliente do banco."]}, {"t": "Client", "d": ["A aplicação que quer aceder.", "A app móvel, um site, outro serviço."]}, {"t": "Authorization Server", "d": ["Autentica o utilizador e emite tokens.", "No projeto: a própria API. Num banco real: um servidor de identidade."]}, {"t": "Resource Server", "d": ["A API que guarda os dados e valida os tokens.", "A BankingApp."]}], "more": {"more": "Em projetos pequenos, o Authorization Server e o Resource Server são a mesma aplicação, como acontece na BankingApp: a mesma API emite e valida o token. Em sistemas maiores são separados (Microsoft Entra ID, Keycloak, Auth0, Duende IdentityServer), e a API só valida tokens que outro emitiu."}}, {"id": "au-3-3", "t": "Authorization Code com PKCE", "type": "cards", "flow": 6, "items": [{"t": "1. Pedido", "d": ["O cliente redireciona o utilizador para o Authorization Server."]}, {"t": "2. Login", "d": ["O utilizador autentica-se lá e dá consentimento."]}, {"t": "3. Código", "d": ["O servidor devolve um código de curta duração ao cliente."]}, {"t": "4. Troca", "d": ["O cliente troca o código por tokens, provando que foi ele que começou (PKCE)."]}, {"t": "5. Chamada", "d": ["O cliente chama a API com o access token no cabeçalho Authorization."]}, {"t": "6. Validação", "d": ["A API valida o token e responde."]}, {"t": "", "d": ["É o fluxo para aplicações com um utilizador: web, móvel e SPA.", "O PKCE protege o código de ser roubado e usado por outra aplicação."], "note": true}], "more": {"more": "O código passa pelo browser, onde pode ser intercetado. Por isso o cliente cria um segredo aleatório (code verifier), envia o seu hash no passo 1 (code challenge) e o segredo original no passo 4. Quem roubar o código não tem o segredo e não consegue trocá-lo por tokens.\n\nO PKCE é hoje recomendado para todos os clientes, e não só para as apps móveis."}}, {"id": "au-3-4", "t": "Que fluxo usar?", "type": "table", "rows": [["Cenário", "Fluxo", "Notas"], ["Site ou app com um utilizador a fazer login", "Authorization Code + PKCE", "O fluxo por omissão."], ["Um serviço a chamar outro, sem utilizador", "Client Credentials", "O cliente autentica-se com o seu id e segredo."], ["Dispositivo sem teclado (televisão)", "Device Code", "O utilizador autentica-se noutro dispositivo."], ["Aplicação própria que envia email e password", "Password (ROPC)", "Desaconselhado e removido do OAuth 2.1."]], "note": "Na BankingApp, a API recebe o email e a password e emite o token. É uma simplificação para aprender o JWT; num sistema real, o login seria feito por um servidor de identidade.", "more": {"more": "O Implicit Flow, usado antigamente por SPAs, também foi retirado: devolvia o token no URL. Hoje as SPAs usam o Authorization Code com PKCE."}}, {"id": "au-3-5", "t": "Os tokens", "type": "table", "rows": [["Token", "Para quê", "Duração", "Para quem"], ["Access token", "Chamar a API", "Curta (minutos)", "A API (Resource Server)"], ["Refresh token", "Pedir um novo access token sem novo login", "Longa (dias)", "O Authorization Server"], ["ID token (OpenID Connect)", "Dizer à aplicação quem é o utilizador", "Curta", "A aplicação cliente"]], "note": "O OpenID Connect (OIDC) é uma camada de identidade sobre o OAuth 2.0: acrescenta o ID token e o endpoint userinfo, para a aplicação saber quem fez login.", "more": {"more": "O access token pode ser opaco (uma referência que a API pergunta ao servidor) ou um JWT (a API valida sozinha). O formato dos access tokens neste curso é o JWT, tema do capítulo seguinte.", "pit": "Enviar o ID token à API. O ID token é para a aplicação cliente; a API só deve aceitar access tokens."}}, {"id": "au-3-6", "t": "Basic Auth vs OAuth 2.0", "type": "table", "rows": [["", "Basic Auth", "OAuth 2.0"], ["O que a API recebe", "A password do utilizador", "Um token"], ["Quem vê a password", "A API e todos os clientes", "Só o Authorization Server"], ["Duração do acesso", "Até a password mudar", "Limitada (minutos)"], ["Âmbito do acesso", "Tudo", "Limitado por scopes"], ["Revogação", "Mudar a password", "Revogar o token ou o refresh token"], ["Autenticação multifator", "Não suporta", "Suportada no servidor de identidade"], ["Complexidade", "Muito baixa", "Mais peças (servidor, fluxos, tokens)"], ["Quando usar", "Ferramentas internas, testes e serviços legados sobre HTTPS", "APIs expostas a aplicações e utilizadores"]], "more": {"more": "O custo do OAuth é a complexidade: mais peças, mais configuração. Em troca, a password nunca sai do Authorization Server e o acesso passa a ser limitado e revogável. Num banco, essa troca compensa sempre."}}], "quiz": [{"q": "O OAuth 2.0 é, sobretudo, um protocolo de...", "o": ["Autenticação", "Autorização (delegação de acesso)", "Encriptação", "Compressão"], "a": 1, "w": "Define como uma aplicação obtém acesso limitado em nome do utilizador. A identidade vem do OpenID Connect."}, {"q": "Que fluxo se usa por omissão numa aplicação com utilizador?", "o": ["Password", "Implicit", "Authorization Code com PKCE", "Basic"], "a": 2, "w": "Authorization Code com PKCE é o recomendado para web, móvel e SPA."}, {"q": "Que fluxo usa um serviço a chamar outro, sem utilizador?", "o": ["Client Credentials", "Authorization Code", "Device Code", "Implicit"], "a": 0, "w": "O cliente autentica-se com o seu próprio id e segredo."}, {"q": "Para que serve o refresh token?", "o": ["Chamar a API", "Obter um novo access token sem novo login", "Encriptar a password", "Identificar o utilizador à API"], "a": 1, "w": "Permite que o access token seja curto sem obrigar a um novo login."}, {"q": "O que acrescenta o OpenID Connect ao OAuth 2.0?", "o": ["Mais velocidade", "O ID token, para saber quem fez login", "Encriptação do tráfego", "Nada"], "a": 1, "w": "É a camada de identidade sobre o OAuth 2.0."}]}, {"id": "auth-4", "t": "JWT por dentro", "intro": "O formato do token que a BankingApp emite: três partes, claims e uma assinatura.", "lessons": [{"id": "au-4-1", "t": "Três partes", "type": "code", "lang": "sh", "code": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwibmFtZSI6IkFuYSJ9.kD3x...\n\n# 1. header (base64url)\n{ \"alg\": \"HS256\", \"typ\": \"JWT\" }\n\n# 2. payload = the claims (base64url)\n{\n  \"sub\": \"1\",\n  \"name\": \"Ana Pereira\",\n  \"role\": \"Customer\",\n  \"iss\": \"AuthLab\",\n  \"aud\": \"AuthLab.Clients\",\n  \"iat\": 1793690000,\n  \"exp\": 1793693600\n}\n\n# 3. signature\nHMACSHA256( base64url(header) + \".\" + base64url(payload), secretKey )", "points": ["Header, payload e assinatura, separados por pontos.", "Header e payload são JSON em base64url.", "Qualquer pessoa pode ler o payload.", "A assinatura impede que seja alterado."], "more": {"more": "Um JWT (JSON Web Token, pronuncia-se «jót») está assinado, não encriptado. A assinatura garante que o conteúdo não foi alterado e que foi emitido por quem tem a chave. Não esconde nada: podes colar o token em jwt.io e ler as claims.\n\nPor isso nunca se põem passwords, números de cartão ou outros segredos no payload.", "pit": "Achar que o JWT é secreto. Se um dado não pode ser lido pelo utilizador ou por quem intercete o token, não pertence ao payload.", "tryit": "Corre o Login do AuthLab (capítulo seguinte), cola o accessToken em jwt.io e vê as claims. Altera um carácter do payload e vê a assinatura ficar inválida."}}, {"id": "au-4-2", "t": "Claims registadas", "type": "table", "rows": [["Claim", "Nome", "Significado"], ["sub", "Subject", "Quem é o utilizador (o id do cliente)."], ["iss", "Issuer", "Quem emitiu o token."], ["aud", "Audience", "Para que API é o token."], ["exp", "Expiration", "Quando deixa de ser válido (segundos desde 1970, UTC)."], ["iat", "Issued at", "Quando foi emitido."], ["nbf", "Not before", "Só é válido a partir daqui."], ["name, email, role", "Personalizadas", "Dados úteis à API. Mantém-nas poucas: o token vai em todos os pedidos."]], "more": {"more": "O payload cresce com cada claim, e o token viaja em todos os pedidos. Por isso incluem-se apenas o identificador e o que a API usa em quase todos os pedidos (papel, nome). Os restantes dados vão-se buscar à base de dados com o id do sub."}}, {"id": "au-4-3"
