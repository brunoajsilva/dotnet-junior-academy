, "t": "Assinatura: simétrica ou assimétrica", "type": "table", "rows": [["", "HS256 (simétrica)", "RS256 (assimétrica)"], ["Chaves", "Uma só, partilhada", "Privada (assina) e pública (valida)"], ["Quem assina", "Quem tem a chave", "Só o dono da chave privada"], ["Quem valida", "Quem tem a chave (e por isso também podia assinar)", "Qualquer um com a chave pública"], ["Ideal para", "Uma API que emite e valida os seus tokens", "Um servidor de identidade e várias APIs"], ["Neste curso", "Usada", "Para saberes que existe"]], "more": {"more": "Com HS256, qualquer serviço que valide o token tem a chave que também permite assinar tokens. Para uma API que emite e valida os seus tokens, como a BankingApp, é adequado e simples. Quando várias APIs validam tokens de um servidor de identidade, usa-se RS256: as APIs só têm a chave pública e não conseguem fabricar tokens."}}, {"id": "au-4-4", "t": "O que a API valida", "type": "cards", "items": [{"t": "Assinatura", "d": ["O token foi emitido por quem tem a chave?", "Foi alterado?"]}, {"t": "Emissor (iss)", "d": ["Foi emitido por quem esperamos?"]}, {"t": "Audiência (aud)", "d": ["É um token para esta API?"]}, {"t": "Validade (exp)", "d": ["Ainda não expirou?"]}, {"t": "", "d": ["No ASP.NET Core, estas quatro verificações configuram-se no TokenValidationParameters.", "Se alguma falhar, a resposta é 401."], "note": true}], "more": {"more": "A audiência evita que um token emitido para a API A seja aceite pela API B. O ClockSkew é a tolerância entre relógios, por omissão cinco minutos; no AuthLab pomos zero para veres a expiração a acontecer à hora certa.", "pit": "Desligar ValidateIssuer, ValidateAudience ou ValidateLifetime para «fazer funcionar». O erro não desaparece: passa a ser uma falha de segurança."}}, {"id": "au-4-5", "t": "O token não se revoga", "type": "cards", "items": [{"t": "O problema", "d": ["A API valida o token sozinha, sem perguntar a ninguém.", "Um token roubado funciona até expirar."]}, {"t": "A resposta", "d": ["Access tokens curtos (minutos).", "Um refresh token para renovar, guardado no servidor e revogável."]}, {"t": "", "d": ["Expiração curta e refresh token são as duas metades da mesma solução."], "note": true}], "more": {"more": "A vantagem do JWT (a API não precisa de ir à base de dados) é também a sua limitação (a API não sabe se o token foi revogado). Quando é mesmo preciso revogar já, mantém-se uma lista de tokens revogados e verifica-se em cada pedido, o que reintroduz a consulta que o JWT queria evitar."}}], "quiz": [{"q": "O que garante a assinatura de um JWT?", "o": ["Que o conteúdo está encriptado", "Que o conteúdo não foi alterado", "Que o utilizador é maior de idade", "Que o token nunca expira"], "a": 1, "w": "A assinatura prova a integridade e a origem. Não esconde o conteúdo."}, {"q": "Qual destas informações NÃO deve estar no payload?", "o": ["O id do cliente", "O papel", "A password", "A hora de expiração"], "a": 2, "w": "O payload é legível por qualquer pessoa. Segredos nunca entram."}, {"q": "Para que serve a claim aud?", "o": ["Dizer para que API é o token", "Guardar a data de nascimento", "Identificar o utilizador", "Assinar o token"], "a": 0, "w": "A audiência impede que um token de uma API seja aceite por outra."}, {"q": "Porque se usam access tokens de curta duração?", "o": ["Para poupar memória", "Porque um token roubado deixa de servir quando expira", "Porque o JWT não aceita mais", "Para não precisar de HTTPS"], "a": 1, "w": "A API não consegue revogar o token, por isso a expiração curta limita o estrago."}]}, {"id": "auth-5", "t": "Hands-on I: gerar e validar um JWT", "intro": "Constróis de raiz uma Web API pequena, o AuthLab: configuras a autenticação JWT, crias no controller um método que gera o token e outro que só responde a quem o enviar. Não é a BankingApp: serve para perceberes cada peça antes do projeto.", "lessons": [{"id": "au-5-1", "t": "Criar o projeto", "type": "code", "lang": "sh", "code": "dotnet new webapi --use-controllers -n AuthLab\ncd AuthLab\n\ndotnet add package Microsoft.AspNetCore.Authentication.JwtBearer\n\n# remove the template sample (WeatherForecast) and keep only Program.cs", "points": ["dotnet new webapi --use-controllers cria uma Web API com controllers.", "O pacote JwtBearer valida tokens.", "A chave tem de ter pelo menos 32 caracteres para HS256."], "more": {"more": "Neste laboratório a chave fica no appsettings.json, para simplificar. Em produção, a mesma chave vem de uma variável de ambiente ou de um cofre (Azure Key Vault, por exemplo): o código lê sempre de builder.Configuration e não sabe a diferença.", "pit": "Copiar a chave do laboratório para um projeto real. Quem a tiver consegue fabricar tokens válidos."}}, {"id": "au-5-2", "t": "Configuração", "type": "code", "lang": "json", "code": "{\n  \"Jwt\": {\n    \"Issuer\": \"AuthLab\",\n    \"Audience\": \"AuthLab.Clients\",\n    \"Key\": \"a-random-text-with-at-least-32-characters-here\",\n    \"ExpiresMinutes\": 15\n  },\n  \"Logging\": { \"LogLevel\": { \"Default\": \"Information\", \"Microsoft.AspNetCore\": \"Warning\" } },\n  \"AllowedHosts\": \"*\"\n}", "points": ["Issuer e Audience identificam quem emite e quem recebe o token.", "A chave (Jwt:Key) assina o token e tem pelo menos 32 caracteres.", "ExpiresMinutes controla a validade do token.", "Tudo fica na secção Jwt, lida pelo builder.Configuration."]}, {"id": "au-5-3", "t": "Program.cs: configurar a autenticação", "type": "code", "lang": "cs", "code": "using System.Text;\nusing Microsoft.AspNetCore.Authentication.JwtBearer;\nusing Microsoft.IdentityModel.Tokens;\n\nvar builder = WebApplication.CreateBuilder(args);\n\n// the \"Jwt\" section (appsettings.json) becomes an object the controller can receive\nvar jwt = builder.Configuration.GetSection(\"Jwt\").Get<JwtSettings>()!;\nbuilder.Services.AddSingleton(jwt);\n\nbuilder.Services.AddControllers();\n\nbuilder.Services\n    .AddAuthentication(JwtBearerDefaults.AuthenticationScheme)\n    .AddJwtBearer(options =>\n    {\n        options.MapInboundClaims = false;                // keep \"sub\" as \"sub\"\n        options.TokenValidationParameters = new TokenValidationParameters\n        {\n            ValidateIssuer = true,           ValidIssuer = jwt.Issuer,\n            ValidateAudience = true,         ValidAudience = jwt.Audience,\n            ValidateIssuerSigningKey = true, IssuerSigningKey = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(jwt.Key)),\n            ValidateLifetime = true,         ClockSkew = TimeSpan.Zero\n        };\n    });\nbuilder.Services.AddAuthorization();\n\nvar app = builder.Build();\n\napp.UseHttpsRedirection();\napp.UseAuthentication();   // who are you?\napp.UseAuthorization();    // can you do this?\napp.MapControllers();\n\napp.Run();\n\n// JwtSettings.cs\npublic class JwtSettings\n{\n    public string Issuer { get; set; } = \"\";\n    public string Audience { get; set; } = \"\";\n    public string Key { get; set; } = \"\";\n    public int ExpiresMinutes { get; set; } = 15;\n}", "points": ["A secção Jwt passa a um objeto JwtSettings, registado no container.", "AddJwtBearer configura as quatro validações.", "UseAuthentication e UseAuthorization na ordem certa.", "MapControllers expõe os controllers."], "more": {"more": "O MapInboundClaims = false evita que o ASP.NET Core renomeie as claims do token (por exemplo, sub passaria a ser um nome comprido da Microsoft). Assim, o que vês no jwt.io é o que lês no código.\n\nRegistar o JwtSettings no container (AddSingleton) permite ao controller recebê-lo no construtor, tal como qualquer outro serviço. É a mesma Dependency Injection que já usaste.", "pit": "Trocar a ordem do UseAuthentication e do UseAuthorization. Todos os métodos protegidos passam a responder 401."}}, {"id": "au-5-4", "t": "AuthController: gerar o token e usá-lo", "type": "code", "lang": "cs", "code": "using System.IdentityModel.Tokens.Jwt;\nusing System.Security.Claims;\nusing System.Text;\nusing Microsoft.AspNetCore.Authorization;\nusing Microsoft.AspNetCore.Mvc;\nusing Microsoft.IdentityModel.Tokens;\n\n[ApiController]\n[Route(\"api/auth\")]\npublic class AuthController : ControllerBase\n{\n    // in-memory users: only for this lab (a real API stores a password HASH)\n    private static readonly List<User> Users =\n    [\n        new(1, \"ana@example.com\", \"Passw0rd!\", \"Ana Pereira\", \"Customer\"),\n        new(2, \"rui@example.com\", \"Passw0rd!\", \"Rui Costa\", \"Manager\")\n    ];\n\n    private readonly JwtSettings _jwt;\n\n    public AuthController(JwtSettings jwt) => _jwt = jwt;\n\n    // 1. generates the token: anonymous, because the caller does not have one yet\n    [AllowAnonymous]\n    [HttpPost(\"login\")]\n    public ActionResult<LoginResponse> Login(LoginRequest body)\n    {\n        var user = Users.FirstOrDefault(u => u.Email == body.Email && u.Password == body.Password);\n        if (user is null) return Unauthorized();   // same answer for unknown email and wrong password\n\n        var claims = new[]\n        {\n            new Claim(JwtRegisteredClaimNames.Sub, user.Id.ToString()),\n            new Claim(\"name\", user.Name),\n            new Claim(\"role\", user.Role)\n        };\n        var key = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(_jwt.Key));\n        var expires = DateTime.UtcNow.AddMinutes(_jwt.ExpiresMinutes);\n\n        var token = new JwtSecurityToken(_jwt.Issuer, _jwt.Audience, claims, expires: expires,\n            signingCredentials: new SigningCredentials(key, SecurityAlgorithms.HmacSha256));\n\n        return Ok(new LoginResponse(new JwtSecurityTokenHandler().WriteToken(token), expires));\n    }\n\n    // 2. authenticated: without a valid token the answer is 401\n    [Authorize]\n    [HttpGet(\"me\")]\n    public IActionResult Me() => Ok(new\n    {\n        id = User.FindFirstValue(\"sub\"),\n        name = User.FindFirstValue(\"name\"),\n        role = User.FindFirstValue(\"role\")\n    });\n}\n\npublic record LoginRequest(string Email, string Password);\npublic record LoginResponse(string AccessToken, DateTime ExpiresAtUtc);\npublic record User(int Id, string Email, string Password, string Name, string Role);", "points": ["Login é anónimo e gera o token, com as claims sub, name e role.", "Me tem [Authorize]: só responde com um token válido.", "A identidade vem do token: User.FindFirstValue(\"sub\").", "O Login devolve o mesmo 401 para email desconhecido e password errada."], "more": {"more": "Este exemplo guarda as passwords em texto dentro da lista, só para o laboratório ser pequeno. A BankingApp guarda um hash (capítulo 7), e a criação do token vive numa classe própria (JwtTokenService), em vez de estar no controller.\n\nO [AllowAnonymous] no Login é explícito de propósito: quando mais tarde protegeres o controller inteiro com [Authorize], o Login continua a funcionar.", "pit": "Pôr [Authorize] no Login. Ninguém consegue obter o primeiro token.", "tryit": "Acrescenta uma claim email ao token e devolve-a no Me."}}, {"id": "au-5-5", "t": "Bruno: o cabeçalho Authorization", "type": "cards", "items": [{"t": "O ambiente", "d": ["Cria o ambiente Local com a variável baseUrl.", "Usa o endereço https que o dotnet run escreve.", "Seleciona o ambiente no canto superior direito."]}, {"t": "Pedido de login", "d": ["Novo pedido POST para {{baseUrl}}/api/auth/login.", "Body em JSON com email e password.", "Separador Vars, Post Response: token = res.body.accessToken."]}, {"t": "Pedido autenticado", "d": ["GET {{baseUrl}}/api/auth/me.", "No separador Auth escolhe «Bearer Token» e escreve {{token}}.", "O Bruno envia o cabeçalho Authorization: Bearer <token>."]}, {"t": "Pedido sem token", "d": ["Duplica o pedido anterior e põe o separador Auth em «No Auth».", "A resposta é 401: prova que o [Authorize] está a funcionar."]}], "more": {"more": "O Bruno guarda as coleções em ficheiros de texto (.bru), que podes pôr no repositório e rever em Pull Requests. A variável token é preenchida automaticamente a cada Login, por isso não copias o token à mão.", "pit": "Deixar o separador Auth em «No Auth» no pedido protegido. A API responde 401 e parece um erro do servidor."}}, {"id": "au-5-6", "t": "Experimentar o AuthLab", "type": "exercise", "steps": [{"lead": "Arrancar", "text": "correr dotnet run e anotar o endereço https"}, {"lead": "Sem token", "text": "GET /api/auth/me devolve 401"}, {"lead": "Login", "text": "POST /api/auth/login com ana@example.com e Passw0rd! devolve o accessToken"}, {"lead": "Com token", "text": "GET /api/auth/me com o Bearer Token devolve 200 com o id, nome e papel"}, {"lead": "Descodificar", "text": "colar o token em jwt.io e identificar sub, name, role, iss, aud e exp"}, {"lead": "Adulterar", "text": "alterar um carácter do token e confirmar que o Me responde 401"}, {"lead": "Expirar", "text": "mudar ExpiresMinutes para 1, fazer login, esperar 61 segundos e confirmar o 401"}], "expected": "GET  /api/auth/me (sem token)      -> 401\nPOST /api/auth/login               -> 200 { accessToken, expiresAtUtc }\nGET  /api/auth/me (com token)      -> 200 { id: \"1\", name: \"Ana Pereira\", role: \"Customer\" }\nGET  /api/auth/me (token alterado) -> 401\nGET  /api/auth/me (token expirado) -> 401", "hint": "Se o Me responde sempre 401, confirma a ordem do UseAuthentication e do UseAuthorization e se a chave do appsettings.json não mudou entre arranques.", "extra": "Troca o ClockSkew por 5 minutos e vê o token continuar válido depois de expirar.", "more": {"more": "O passo «Adulterar» é o mais importante: mostra que a API não confia no conteúdo do token, confia na assinatura. Sem a chave, ninguém fabrica um token válido.", "tryit": "Troca uma letra no meio do payload (a segunda parte) e volta a chamar o Me."}}], "quiz": [{"q": "Onde fica a chave de assinatura durante o desenvolvimento?", "o": ["Num cofre ou numa variável de ambiente", "No código-fonte", "No nome do projeto", "Num comentário"], "a": 0, "w": "Fora do repositório. Num laboratório pode ficar no appsettings.json, mas em produção vem de variáveis de ambiente ou de um cofre."}, {"q": "O que devolve o método Me se o token tiver um carácter alterado?", "o": ["200", "401", "403", "500"], "a": 1, "w": "A assinatura deixa de bater certo e a autenticação falha: 401."}, {"q": "Porque tem o Login o atributo [AllowAnonymous]?", "o": ["Para ser mais rápido", "Porque quem faz login ainda não tem token", "Porque o JWT o exige", "Para devolver 403"], "a": 1, "w": "O Login é o método que gera o primeiro token, por isso não pode exigir um."}, {"q": "O que faz o atributo [Authorize] num método do controller?", "o": ["Valida a password", "Exige um utilizador autenticado", "Emite o token", "Encripta a resposta"], "a": 1, "w": "Sem utilizador autenticado, a resposta é 401."}]}, {"id": "auth-6", "t": "Hands-on II: autorização", "intro": "Com o token a funcionar, decide-se o que cada utilizador pode fazer: papéis, políticas e dados que só pertencem ao dono. Continuas no AuthLab.", "lessons": [{"id": "au-6-1", "t": "Papéis (roles)", "type": "code", "lang": "cs", "code": "// Program.cs, inside AddJwtBearer\noptions.TokenValidationParameters = new TokenValidationParameters\n{\n    // ...same as before, plus:\n    NameClaimType = \"name\",    // User.Identity.Name reads this claim\n    RoleClaimType = \"role\"     // [Authorize(Roles = ...)] and User.IsInRole read this claim\n};\n\n// AdminController.cs\n[ApiController]\n[Route(\"api/admin\")]\npublic class AdminController : ControllerBase\n{\n    [Authorize(Roles = \"Manager\")]\n    [HttpGet(\"customers\")]\n    public IActionResult ListCustomers() => Ok(new[] { \"Ana Pereira\", \"Rui Costa\" });\n}", "points": ["O token já leva a claim role.", "RoleClaimType diz ao ASP.NET Core qual claim é o papel.", "[Authorize(Roles = ...)] protege o método.", "Papel errado: 403."], "more": {"more": "Sem RoleClaimType = \"role\", o ASP.NET Core procura a claim com o nome comprido da Microsoft e nunca encontra o papel: todos os pedidos dão 403, mesmo para o gestor.", "pit": "Papéis a mais. Quando os papéis passam de três ou quatro, reparas que estás a combinar regras: é a altura de usar policies."}}, {"id": "au-6-2", "t": "Políticas (policies)", "type": "code", "lang": "cs", "code": "// Program.cs\nbuilder.Services.AddAuthorizationBuilder()\n    .AddPolicy(\"CanReviewLoans\", p => p\n        .RequireRole(\"Manager\")\n        .RequireClaim(\"department\", \"Credit\"))\n    .AddPolicy(\"VerifiedEmail\", p => p\n        .RequireClaim(\"email_verified\", \"true\"));\n\n// LoansController.cs\n[Authorize(Policy = \"CanReviewLoans\")]\n[HttpPost(\"{id}/approve\")]\npublic IActionResult Approve(int id) => NoContent();", "points": ["Uma policy tem nome e agrupa regras.", "RequireRole e RequireClaim combinam-se.", "Reutiliza-se em vários métodos.", "Muda-se num sítio só."], "more": {"more": "As policies também aceitam requisitos próprios (IAuthorizationRequirement e AuthorizationHandler), para regras que não são «tem esta claim», por exemplo «só entre as 9h e as 18h». Para as regras deste curso, RequireRole e RequireClaim chegam."}}, {"id": "au-6-3", "t": "O recurso é teu?", "type": "code", "lang": "cs", "code": "[Authorize]\n[HttpGet(\"{number}\")]\npublic IActionResult GetAccount(string number)\n{\n    var customerId = int.Parse(User.FindFirstValue(\"sub\")!);\n    var account = Accounts.FirstOrDefault(a => a.Number == number);\n\n    // the account is not yours? Answer exactly as if it did not exist\n    if (account is null || account.CustomerId != customerId)\n        return NotFound();\n\n    return Ok(account);\n}", "points": ["O id vem do token, nunca do pedido.", "Verifica que o recurso pertence ao utilizador.", "Se não pertence: 404, como se não existisse.", "Papéis e policies não chegam para isto."], "more": {"more": "Papéis dizem «os clientes podem consultar contas». Não dizem «esta conta é tua». A verificação de propriedade faz-se no código, depois de carregar o recurso. É a falha de segurança mais frequente em APIs (a OWASP chama-lhe Broken Object Level Authorization): trocar o número na URL e ver a conta de outra pessoa.", "pit": "Receber o customerId no corpo ou na URL. Quem faz o pedido pode pôr lá qualquer valor."}}, {"id": "au-6-4", "t": "Refresh token: renovar sem novo login", "type": "code", "lang": "http", "code": "POST /login\n  -> { \"accessToken\": \"eyJ...\", \"expiresAtUtc\": \"...in 15 min\",\n       \"refreshToken\": \"a1b2c3...\" }                      # long-lived, random, stored hashed on the server\n\n# 15 minutes later the access token expires: the API answers 401\n\nPOST /refresh   { \"refreshToken\": \"a1b2c3...\" }\n  -> { \"accessToken\": \"eyJ...(new)\", \"refreshToken\": \"d4e5f6...(new)\" }\n     # the old refresh token is now invalid (rotation)\n\nPOST /logout    { \"refreshToken\": \"d4e5f6...\" }\n  -> 204                                                  # the server deletes it: the session is over", "points": ["Access token curto, refresh token longo.", "O refresh token é aleatório e guardado no servidor (com hash).", "Cada renovação troca o refresh token por um novo (rotation).", "O logout apaga-o no servidor."], "more": {"more": "Guardar o refresh token no servidor é o que permite revogar: apagas a linha e a sessão acaba. O access token continua válido até expirar, e é por isso que é curto.\n\nGuarda o refresh token com hash, tal como as passwords: se alguém ler a base de dados, não consegue usá-los."}}, {"id": "au-6-5", "t": "Papéis e dados do dono no AuthLab", "type": "exercise", "steps": [{"lead": "Claims", "text": "configurar NameClaimType e RoleClaimType no TokenValidationParameters"}, {"lead": "Gestores", "text": "criar o AdminController com GET /api/admin/customers só para o papel Manager"}, {"lead": "Policy", "text": "criar a policy CanReviewLoans (papel Manager) e usá-la em POST /api/loans/{id}/approve"}, {"lead": "Dono", "text": "criar uma lista de contas com CustomerId e GET /api/accounts/{number} que devolve 404 às contas de outros"}, {"lead": "Testar", "text": "repetir os pedidos como ana (Customer) e como rui (Manager) e preencher a tabela de resultados"}], "table": [["Pedido", "Sem token", "Ana (Customer)", "Rui (Manager)"], ["GET /api/admin/customers", "401", "403", "200"], ["POST /api/loans/1/approve", "401", "403", "204"], ["GET /api/accounts/AC-001 (conta da Ana)", "401", "200", "404"], ["GET /api/accounts/AC-002 (conta do Rui)", "401", "404", "200"]], "expected": "Sem token -> 401 em todos\nCustomer num método de gestor -> 403\nConta de outro utilizador -> 404", "extra": "Acrescenta uma claim email_verified e uma policy VerifiedEmail.", "more": {"more": "Se a tabela de resultados te sair diferente, é quase sempre uma de três causas: o RoleClaimType em falta (tudo 403), a ordem UseAuthentication/UseAuthorization (tudo 401) ou o id lido do sítio errado."}}], "quiz": [{"q": "Um Customer chama um método só para Manager. Que código recebe?", "o": ["401", "403", "404", "200"], "a": 1, "w": "Está autenticado, mas o papel não chega: 403."}, {"q": "De onde deve vir o id do cliente numa consulta às suas contas?", "o": ["Do corpo do pedido", "Da URL", "Do token", "De um cabeçalho personalizado"], "a": 2, "w": "Do token assinado. Tudo o que vem no pedido pode ser forjado."}, {"q": "Para que serve uma policy?", "o": ["Guardar a password", "Agrupar regras de autorização com um nome reutilizável", "Emitir tokens", "Encriptar a ligação"], "a": 1, "w": "Combina papéis e claims numa regra com nome, usada em vários métodos."}, {"q": "Porque se guarda o refresh token no servidor?", "o": ["Para o poder revogar", "Para o tornar mais curto", "Porque o JWT o exige", "Para poupar espaço"], "a": 0, "w": "Apagar o refresh token termina a sessão. Um access token não se consegue revogar."}]}, {"id": "auth-7", "t": "Segurança na prática", "intro": "O que separa um exemplo que funciona de uma API que se pode pôr em produção: passwords, segredos, HTTPS e os erros comuns.", "lessons": [{"id": "au-7-1", "t": "Passwords: hash, nunca encriptação", "type": "code", "lang": "cs", "code": "using Microsoft.AspNetCore.Identity;\n\nvar hasher = new PasswordHasher<object>();\n\n// at registration: store ONLY the hash\nstring hash = hasher.HashPassword(null!, \"Passw0rd!\");\n// \"AQAAAAIAAYagAAAAE...\"  (random salt included, different every time)\n\n// at login: compare the typed password with the stored hash\nvar result = hasher.VerifyHashedPassword(null!, hash, \"Passw0rd!\");\nbool ok = result != PasswordVerificationResult.Failed;", "points": ["Guarda-se o hash, nunca a password.", "O hash tem sal aleatório: o mesmo texto dá hashes diferentes.", "Verifica-se com VerifyHashedPassword.", "O hash é lento de propósito."], "more": {"more": "Encriptar é reversível: quem tiver a chave recupera a password. O hash não tem volta; o login compara o hash da password escrita com o hash guardado. O sal evita que duas pessoas com a mesma password tenham o mesmo hash e inutiliza as tabelas de hashes pré-calculados.\n\nO PasswordHasher de ASP.NET Core Identity já faz isto bem (PBKDF2 com sal e muitas iterações). Não inventes o teu algoritmo.", "pit": "Guardar um hash simples (SHA256 ou MD5) de uma password. São rápidos, e um atacante testa milhares de milhões de palpites por segundo."}}, {"id": "au-7-2", "t": "Checklist de uma API protegida", "type": "cards", "items": [{"t": "Transporte", "check": true, "d": ["HTTPS sempre, com redirecionamento", "O token só no cabeçalho Authorization, nunca no URL"]}, {"t": "Segredos", "check": true, "d": ["Chave do JWT em variáveis de ambiente ou num cofre", "Nenhum segredo em ficheiros do Git"]}, {"t": "Tokens", "check": true, "d": ["Access token curto (minutos)", "Validar emissor, audiência, validade e assinatura", "Poucas claims, nenhum segredo"]}, {"t": "Passwords", "check": true, "d": ["Só o hash, com PasswordHasher", "Mínimo de 8 caracteres", "Mesma resposta para email desconhecido e password errada"]}, {"t": "Autorização", "check": true, "d": ["Todos os endpoints protegidos por omissão", "Id do utilizador sempre do token", "404 para recursos de outros utilizadores"]}, {"t": "Operação", "check": true, "d": ["Não registar passwords nem tokens", "Limitar tentativas de login", "Mensagens de erro sem detalhes internos"]}], "more": {"more": "Uma boa prática é inverter a lógica: protege tudo e abre só o que é público. No ASP.NET Core faz-se com uma FallbackPolicy que exige utilizador autenticado, e [AllowAnonymous] nos endpoints públicos. Assim, um endpoint novo esquecido fica protegido e não aberto."}}, {"id": "au-7-3", "t": "Onde guardar o token no cliente", "type": "table", "rows": [["Local", "Risco", "Nota"], ["localStorage", "Qualquer script na página lê o token (XSS)", "Simples, mas exposto."], ["Cookie HttpOnly + Secure + SameSite", "Scripts não conseguem lê-lo", "Exige proteção contra CSRF."], ["Memória da aplicação", "Perde-se ao recarregar", "Mais seguro, com refresh token para recuperar."], ["Cofre do sistema (apps móveis)", "Protegido pelo sistema operativo", "Keychain no iOS, Keystore no Android."]], "more": {"more": "Não há uma resposta única. Cada opção troca um risco por outro. O importante é saberes qual escolheste e porquê. Este tema pertence ao cliente (web ou móvel), mas quem desenha a API precisa de o conhecer, porque define como o token é enviado."}}, {"id": "au-7-4", "t": "Rever o AuthLab com olhos de atacante", "type": "exercise", "steps": [{"lead": "Hash", "text": "substituir as passwords em texto por hashes com PasswordHasher"}, {"lead": "Por omissão", "text": "exigir autenticação em todos os endpoints com uma FallbackPolicy e abrir o Login e os endpoints públicos com AllowAnonymous"}, {"lead": "Limite", "text": "bloquear o login durante 1 minuto após 5 tentativas falhadas do mesmo email"}, {"lead": "Logs", "text": "confirmar que nenhum log escreve a password nem o token"}, {"lead": "Explicar", "text": "escrever três frases sobre o que acontece se alguém roubar o access token e o que limita o estrago"}], "expected": "Tentativa 6 do mesmo email -> 429 Too Many Requests (ou 401 com mensagem genérica)\nEndpoint novo sem atributo -> 401", "extra": "Acrescenta um endpoint /refresh com rotation, como no capítulo anterior.", "more": {"more": "Rever com olhos de atacante é perguntar: se eu fosse mal-intencionado, o que tentava? Trocar o id na URL, repetir uma password mil vezes, reutilizar um token expirado, ler o payload à procura de segredos. A checklist do início do capítulo responde às mesmas perguntas."}}], "quiz": [{"q": "O que se guarda na base de dados em vez da password?", "o": ["A password encriptada", "O hash com sal", "A password em base64", "Nada"], "a": 1, "w": "O hash é irreversível e o sal evita hashes iguais para passwords iguais."}, {"q": "Onde NÃO deve ir o token de acesso num pedido?", "o": ["No cabeçalho Authorization", "No URL", "Num cookie HttpOnly", "Na memória do cliente"], "a": 1, "w": "URLs ficam em logs, histórico e referers."}, {"q": "O que faz uma FallbackPolicy que exige autenticação?", "o": ["Abre todos os endpoints", "Protege por omissão os endpoints sem atributo", "Gera tokens", "Desliga o HTTPS"], "a": 1, "w": "Um endpoint novo esquecido fica protegido, e não aberto."}, {"q": "Porque se limitam as tentativas de login?", "o": ["Para poupar CPU", "Para travar ataques de adivinhação de passwords", "Porque o JWT o exige", "Para expirar o token"], "a": 1, "w": "Sem limite, um atacante testa passwords à vontade."}]}], "outro": {"done": ["Distinguir autenticação de autorização e escolher entre 401, 403 e 404", "Explicar as diferenças entre Basic Auth e OAuth 2.0", "Identificar os papéis e os fluxos do OAuth 2.0", "Ler um JWT e perceber o que a API valida", "Emitir e validar um JWT em ASP.NET Core", "Proteger endpoints com papéis, policies e verificação de propriedade"], "docs": [{"t": "Autenticação e autorização no ASP.NET Core", "u": "https://learn.microsoft.com/aspnet/core/security/"}, {"t": "Autenticação JWT Bearer", "u": "https://learn.microsoft.com/aspnet/core/security/authentication/"}, {"t": "OAuth 2.0 e OpenID Connect", "u": "https://oauth.net/2/"}, {"t": "Bruno", "u": "https://www.usebruno.com/"}], "practice": ["Acrescentar um endpoint /refresh ao AuthLab", "Criar uma policy com um requisito próprio", "Mudar a assinatura de HS256 para RS256", "Ler o OWASP API Security Top 10"]}}, {"id": "projeto", "num": 5, "kind": "project", "title": "Projeto final: BankingApp", "short": "Projeto final", "tagline": "Uma API de um banco, em 6 dias: montas a base com os passos guiados e depois decides, planeias e constróis sozinho.", "brief": {"context": "A BankingApp é uma Web API para um banco: clientes que se registam, fazem login e gerem as suas contas. Constróis a solução de raiz, com Clean Architecture, usando tudo o que aprendeste. No primeiro dia segues um guia. A partir do segundo, recebes um enunciado com muitas funcionalidades e tens de planear o que consegues entregar.", "cards": [{"t": "Como está organizado", "d": "Um dia guiado, uma introdução com o formador, quatro dias de funcionalidades e um dia de fecho.", "more": {"more": "No dia 1 segues o guia: a solução já funcional, com base de dados e Swagger, e a autenticação JWT. A introdução ao projeto, com o planeamento, é uma sessão à parte, conduzida pelo formador, que acontece antes de começares a construir. Nos dias 2 a 5 constróis as funcionalidades que planeaste, sem código de apoio. O dia 6 é para fechar o projeto, rever e demonstrar."}}, {"t": "Mais trabalho do que tempo", "d": "O enunciado propõe mais funcionalidades do que cabem em 6 dias. É de propósito.", "more": {"more": "Numa equipa real, o que está no backlog é sempre mais do que a capacidade. A competência que se treina aqui é escolher: estimar, priorizar e dizer «isto fica de fora». Ninguém espera que acabes tudo. Espera-se que entregues o que escolheste, bem feito, e que saibas explicar as tuas decisões."}}, {"t": "Como sabes que acabaste", "d": "As funcionalidades do teu plano estão prontas, os testes passam e explicas o percurso de um pedido.", "more": {"more": "No dia 6 tens a lista de critérios de aceitação. Marca cada um quando o conseguires demonstrar. Também comparas o plano com o que realmente aconteceu: onde estimaste bem, onde falhaste e porquê."}}]}, "days": [{"d": "Dia 1", "t": "Montar a solução e autenticação JWT", "g": "Estrutura, EF Core, repositório e Swagger; depois Register e Login anónimos, RetrieveDashboard autenticado e a coleção do Bruno.", "link": "projeto-p1"}, {"d": "Dia 2", "t": "Funcionalidades", "g": "Executas o plano, começando pelas funcionalidades mais arriscadas. Uma funcionalidade só está pronta com testes e um pedido no Bruno.", "link": "projeto-p3"}, {"d": "Dia 3", "t": "Funcionalidades", "g": "Continuas a executar o plano, sem código de apoio.", "link": "projeto-p3"}, {"d": "Dia 4", "t": "Funcionalidades", "g": "Continuas a executar o plano e a ajustá-lo quando a realidade o contradiz.", "link": "projeto-p3"}, {"d": "Dia 5", "t": "Funcionalidades e revisão do plano", "g": "A meio do dia revês o plano: o que atrasou? O que cortas? Atualizas e comunicas.", "link": "projeto-p3"}, {"d": "Dia 6", "t": "Fecho do projeto", "g": "Testes, logging, README, plano contra realidade e demonstração.", "link": "projeto-check"}], "layers": [{"id": "domain", "name": "BankingApp.Domain", "role": "Regras do negócio", "color": "domain", "has": ["Customer, Account e AccountStatus", "Transaction e as entidades das tuas funcionalidades", "DomainException"], "refs": [], "never": "EF Core, ASP.NET Core, ou qualquer outro projeto.", "why": "É o centro. As regras do banco (saldo, estado da conta, validações) vivem aqui. Como não referencia nada, é rápido de testar e impossível de contaminar com detalhes técnicos."}, {"id": "application", "name": "BankingApp.Application", "role": "Casos de uso", "color": "application", "has": ["Commands, queries e handlers", "ICustomerRepository, IPasswordHasher, ITokenService", "Request, Response, Error e IHandler", "AddApplication()"], "refs": ["BankingApp.Domain"], "never": "EF Core e ASP.NET Core.", "why": "Orquestra o Domain: por exemplo, o RegisterHandler verifica o email, cria o cliente e a primeira conta. As interfaces vivem aqui porque quem as usa é que define o contrato."}, {"id": "infrastructure", "name": "BankingApp.Infrastructure", "role": "Detalhes técnicos", "color": "infra", "has": ["BankingAppContext, configurations e migrations", "Repositórios", "JwtTokenService e PasswordHasherService", "AddInfrastructure()"], "refs": ["BankingApp.Application"], "never": "A camada Api.", "why": "Implementa os contratos da Application com o EF Core e com as bibliotecas de segurança. Trocar de base de dados é escrever outra implementação aqui."}, {"id": "api", "name": "BankingApp.Api", "role": "HTTP", "color": "api", "has": ["Controllers e DTOs", "ExceptionMiddleware", "Configuração do JWT", "Program.cs e appsettings.json"], "refs": ["BankingApp.Application", "BankingApp.Infrastructure"], "never": "Lógica de negócio.", "why": "Traduz HTTP em comandos e consultas, valida o token e devolve sempre um Response (HTTP 200). Referencia a Infrastructure só para a registar no container."}, {"id": "tests", "name": "BankingApp.Tests", "role": "Verificação", "color": "tests", "has": ["Testes do Domain", "Testes dos handlers com mocks"], "refs": ["BankingApp.Domain", "BankingApp.Application"], "never": "Base de dados real.", "why": "Testa as regras e os handlers sem base de dados nem HTTP. Corre em segundos."}], "flow": [{"layer": "api", "t": "Pedido com token", "d": "POST /api/dashboard/retrieve com o cabeçalho Authorization: Bearer <token>. O pedido entra no pipeline do ASP.NET Core."}, {"layer": "api", "t": "Middleware de autenticação", "d": "UseAuthentication lê o token, valida a assinatura, o emissor, a audiência e a validade, e preenche o User com os claims. Se o token for inválido, [Authorize] responde 200 com o erro unauthorized e o pedido para aqui."}, {"layer": "api", "t": "Controller", "d": "O RetrieveDashboard lê o claim sub (o id do cliente), cria a RetrieveDashboardQuery e chama o handler."}, {"layer": "application", "t": "Handler", "d": "O RetrieveDashboardHandler pede o cliente com as contas ao repositório e calcula o saldo total. Se o cliente não existir, devolve Response.Fail com o erro not_found."}, {"layer": "infrastructure", "t": "Repositório", "d": "O CustomerRepository faz a consulta com Include e AsNoTracking, e o EF Core gera o SELECT com o JOIN."}, {"layer": "api", "t": "Resposta", "d": "O controller converte os dados do Response em DashboardResponse (Map) e devolve-o, sempre com HTTP 200. Se os dados faltarem, vão os errors. Se uma exceção subir, o ExceptionMiddleware também responde 200, com um erro validation ou unexpected."}], "phases": [{"id": "p4", "day": "", "kind": "plan", "title": "Introdução ao Projeto Final", "goal": "Perceber que não vais conseguir fazer tudo e decidir, com critérios, o que entra. Entregas um plano e defendes-o ao formador.", "uses": ["academia-how"], "sections": [{"t": "O choque de realidade", "intro": "O enunciado tem muito mais funcionalidades do que cabem nos dias que tens. Não é engano: na vida real há sempre mais trabalho do que tempo, e escolher bem faz parte do trabalho. Antes de escreveres código, vais decidir o que entra.", "steps": ["Ler todas as funcionalidades do enunciado, até ao fim", "Apontar as dúvidas de negócio para perguntares ao formador", "Somar, de cabeça, quanto tempo achas que demora tudo. Guarda este número."]}, {"t": "Estimar", "intro": "Dá a cada funcionalidade uma estimativa em horas. Inclui tudo o que a torna pronta: regra, caso de uso, migration, controller, testes e pedido no Bruno. Uma estimativa é uma aposta informada, e não uma promessa: o importante é ser honesto.", "steps": ["Estimar cada funcionalidade em horas (números inteiros)", "Anotar o risco: o que nunca fizeste é mais arriscado", "Anotar as dependências (a F7 precisa da F5, que precisa da F4)", "Dar um valor de negócio, de acordo com o que está no enunciado"], "files": [{"name": "Tabela de planeamento (modelo)", "lang": "txt", "code": "| ID  | Funcionalidade        | Valor | Estimativa (h) | Depende de | Risco | Decisão |\n|-----|-----------------------|-------|----------------|------------|-------|---------|\n| F1  | Abrir conta adicional | Alto  | 2              | -          | Baixo | Must    |\n| F7  | Transferência         | Alto  | 4              | F4, F5     | Alto  | Should  |\n| F16 | Pedido de empréstimo  | Médio | 6              | F4, F15    | Alto  | Won't   |\n\n# exemplo ilustrativo: os números e as decisões são teus"}]}, {"t": "Calcular a capacidade", "intro": "Quantas horas tens realmente? A conta é simples, mas as pessoas esquecem-se do tempo que se gasta em dúvidas, erros e reuniões.", "steps": ["Contar os dias de construção (o Dia 6 é para fechar, e não para construir)", "Descontar uma margem para imprevistos", "Comparar a capacidade com a soma das estimativas"], "files": [{"name": "Exemplo de cálculo", "lang": "txt", "code": "horas por dia          = 6\ndias para construir    = Dia 2 + Dia 3 + Dia 4 + Dia 5\nmargem para imprevistos = 20 %\n\ncapacidade = (6 + 6 + 6 + 6) x 0,8 = 19,2 h\n\n# se a soma das estimativas dos Must passar da capacidade, algo tem de sair"}]}, {"t": "Escolher e sequenciar", "intro": "Com a capacidade à vista, escolhe. Usa quatro etiquetas: Must (sem isto, o projeto não faz sentido), Should (devia entrar), Could (se sobrar tempo), Won't (fica de fora, agora). Os Must têm de caber na capacidade.", "steps": ["Marcar Must, Should, Could e Won't", "Verificar que os Must cabem na capacidade", "Ordenar pelas dependências e pelo risco: o que é arriscado faz-se cedo", "Escrever, para cada Won't, uma frase a explicar porque fica de fora"]}, {"t": "Definir o que é «pronto»", "intro": "Uma funcionalidade a 90 % não vale nada: ou está pronta, ou não está. Define já o critério, para não discutires a meio.", "steps": ["As regras de negócio estão no código e testadas", "A migration está criada e revista", "Os erros respondem como no enunciado", "Há um pedido no Bruno que a demonstra", "Os testes todos passam"]}, {"t": "Apresentar o plano ao formador", "intro": "Tens 15 minutos para defender o plano. O formador vai questionar as estimativas, as dependências e o que ficou de fora. Podes alterar o plano depois da conversa.", "steps": ["Levar a tabela com estimativas, riscos e decisões", "Mostrar a capacidade e como a calculaste", "Explicar o que ficou de fora e porquê", "Rever o plano com o que ouviste e arrancar"]}], "more": {"more": "Estimar mal é normal: a maioria das pessoas subestima. O objetivo não é só acertar, mas também aprender a estimar e a ajustar o plano quando a realidade o contradiz. Por isso, no dia 5 revês o plano e, no dia 6, comparas o estimado com o real.\n\nUm plano bom diz também o que não vai ser feito. Quem promete tudo desilude no fim.", "pit": "Contar só o código e esquecer migrations, testes e o pedido no Bruno. É a causa mais comum de estimativas curtas.", "tryit": "Antes de somares as estimativas, olha para o total e pergunta: se eu tivesse de apostar dinheiro, apostava que cabia em 12 horas?"}}, {"id": "p1", "day": "Dia 1", "kind": "build", "title": "Montar a solução", "goal": "Deixar a aplicação funcional: estrutura de pastas, Entity Framework, ligação à base de dados, a primeira entidade, o repositório, o Swagger e o primeiro teste.", "uses": ["dotnet-1", "dotnet-2", "dotnet-4", "dotnet-6"], "trees": [{"title": "Estrutura de pastas e ficheiros", "note": "Escolhe um ficheiro para ver o que faz e o código que lhe corresponde.", "root": {"n": "BankingApp/", "d": "Pasta raiz do repositório. Tem a solução e duas pastas: src (código) e tests (testes).", "c": [{"n": "BankingApp.sln", "d": "A solução. Só lista os cinco projetos, para o IDE os abrir em conjunto.", "f": null, "tag": null}, {"n": "src/", "d": "Todo o código que vai para produção.", "c": [{"n": "BankingApp.Domain/", "d": "Camada 1, o centro. Regras do negócio. Não referencia nada.", "c": [{"n": "Common/", "d": "Tipos partilhados por todo o Domain.", "c": [{"n": "DomainException.cs", "d": "Exceção base das regras do negócio. O ExceptionMiddleware converte-a num erro validation.", "f": "BankingApp.Domain/Common/DomainException.cs", "tag": null}]}, {"n": "Customers/", "d": "Tudo o que diz respeito a clientes.", "c": [{"n": "Customer.cs", "d": "A primeira entidade. Valida nome e NIF na criação; setters privados.", "f": "BankingApp.Domain/Customers/Customer.cs", "tag": null}]}]}, {"n": "BankingApp.Application/", "d": "Camada 2. Casos de uso e contratos. Só referencia o Domain.", "c": [{"n": "Abstractions/", "d": "Interfaces que a Application precisa mas não implementa.", "c": [{"n": "IHandler.cs", "d": "O contrato de todos os casos de uso: Request entra, Response sai.", "f": "BankingApp.Application/Abstractions/IHandler.cs", "tag": null}, {"n": "ICustomerRepository.cs", "d": "O contrato do repositório. A implementação vive na Infrastructure.", "f": "BankingApp.Application/Abstractions/ICustomerRepository.cs", "tag": null}]}, {"n": "Common/", "d": "A abstração de entrada e de saída (a base da API RPC).", "c": [{"n": "Request.cs", "d": "Classe base de todos os comandos e consultas.", "f": "BankingApp.Application/Common/Request.cs", "tag": null}, {"n": "Response.cs", "d": "Response<T>: success, errors e data.", "f": "BankingApp.Application/Common/Response.cs", "tag": null}, {"n": "Empty.cs", "d": "Os dados de um caso de uso que não devolve nada.", "f": "BankingApp.Application/Common/Empty.cs", "tag": null}, {"n": "Error.cs", "d": "Um erro: código e mensagem, com uma fábrica por tipo.", "f": "BankingApp.Application/Common/Error.cs", "tag": null}]}, {"n": "Handlers/", "d": "Os casos de uso, separados em comandos (alteram dados) e consultas (só leem).", "c": [{"n": "CommandHandlers/", "d": "Um caso de uso por pasta, com tudo o que lhe diz respeito: comando, resultado e handler.", "c": [{"n": "CreateCustomer/", "d": "O caso de uso CreateCustomer.", "c": [{"n": "CreateCustomerCommand.cs", "d": "Os dados de entrada de CreateCustomer.", "f": "BankingApp.Application/Handlers/CommandHandlers/CreateCustomer/CreateCustomerCommand.cs", "tag": null}, {"n": "CustomerResult.cs", "d": "O resultado: um cliente.", "f": "BankingApp.Application/Handlers/CommandHandlers/CreateCustomer/CustomerResult.cs", "tag": null}, {"n": "CreateCustomerHandler.cs", "d": "O caso de uso CreateCustomer.", "f": "BankingApp.Application/Handlers/CommandHandlers/CreateCustomer/CreateCustomerHandler.cs", "tag": null}]}]}, {"n": "QueryHandlers/", "d": "O mesmo para as consultas, que só leem dados.", "c": [{"n": "ListCustomers/", "d": "O caso de uso ListCustomers.", "c": [{"n": "ListCustomersQuery.cs", "d": "A consulta ListCustomers.", "f": "BankingApp.Application/Handlers/QueryHandlers/ListCustomers/ListCustomersQuery.cs", "tag": null}, {"n": "ListCustomersHandler.cs", "d": "O caso de uso ListCustomers.", "f": "BankingApp.Application/Handlers/QueryHandlers/ListCustomers/ListCustomersHandler.cs", "tag": null}]}]}]}, {"n": "DependencyInjection.cs", "d": "AddApplication(): regista os handlers no container.", "f": "BankingApp.Application/DependencyInjection.cs", "tag": null}]}, {"n": "BankingApp.Infrastructure/", "d": "Camada 3. Detalhes técnicos: EF Core e base de dados. Referencia a Application.", "c": [{"n": "Persistence/", "d": "Tudo o que é EF Core.", "c": [{"n": "BankingAppContext.cs", "d": "O DbContext. Um DbSet por tabela.", "f": "BankingApp.Infrastructure/Persistence/BankingAppContext.cs", "tag": null}, {"n": "Configurations/", "d": "Uma classe IEntityTypeConfiguration por entidade (Fluent API).", "c": [{"n": "CustomerConfiguration.cs", "d": "Tamanhos, obrigatoriedade e índice único do NIF.", "f": "BankingApp.Infrastructure/Persistence/Configurations/CustomerConfiguration.cs", "tag": null}]}, {"n": "Migrations/", "d": "Gerada pelo comando dotnet ef. Não se escreve à mão: revê-se.", "c": [{"n": "(ficheiros gerados)", "d": "InitialCreate, o snapshot do modelo e o Designer.", "f": null, "tag": null}]}]}, {"n": "Repositories/", "d": "Implementações dos contratos da Application.", "c": [{"n": "CustomerRepository.cs", "d": "Implementa ICustomerRepository com o EF Core.", "f": "BankingApp.Infrastructure/Repositories/CustomerRepository.cs", "tag": null}]}, {"n": "DependencyInjection.cs", "d": "AddInfrastructure(): DbContext, connection string e repositórios.", "f": "BankingApp.Infrastructure/DependencyInjection.cs", "tag": null}]}, {"n": "BankingApp.Api/", "d": "Camada 4. HTTP. Referencia a Application e a Infrastructure (só para a registar).", "c": [{"n": "Contracts/", "d": "DTOs: o formato dos pedidos e das respostas.", "c": [{"n": "Customers/", "d": "Contratos dos endpoints de clientes.", "c": [{"n": "NewCustomer.cs", "d": "O pedido, com validação.", "f": "BankingApp.Api/Contracts/Customers/NewCustomer.cs", "tag": null}, {"n": "CustomerResponse.cs", "d": "A resposta.", "f": "BankingApp.Api/Contracts/Customers/CustomerResponse.cs", "tag": null}]}]}, {"n": "Controllers/", "d": "Um controller por recurso.", "c": [{"n": "CustomersController.cs", "d": "Operações de clientes (create e list), todas POST. Converte o pedido num comando e devolve um Response.", "f": "BankingApp.Api/Controllers/CustomersController.cs", "tag": null}]}, {"n": "Responses/", "d": "Respostas fora do controller.", "c": [{"n": "ValidationResponse.cs", "d": "DTO inválido: responde 200 com a lista de erros.", "f": "BankingApp.Api/Responses/ValidationResponse.cs", "tag": null}]}, {"n": "Middleware/", "d": "Componentes do pipeline.", "c": [{"n": "ExceptionMiddleware.cs", "d": "Converte exceções em Response com erro, sempre com HTTP 200.", "f": "BankingApp.Api/Middleware/ExceptionMiddleware.cs", "tag": null}]}, {"n": "Properties/", "d": "Gerada pelo template.", "c": [{"n": "launchSettings.json", "d": "Portas e URL de arranque. Põe \"launchUrl\": \"swagger\".", "f": "BankingApp.Api/Properties/launchSettings.json", "tag": null}]}, {"n": "appsettings.json", "d": "Configuração: connection string e logging.", "f": "BankingApp.Api/appsettings.json", "tag": null}, {"n": "Program.cs", "d": "Ponto de entrada: serviços, pipeline e Swagger UI.", "f": "BankingApp.Api/Program.cs", "tag": null}]}]}, {"n": "tests/", "d": "Projetos de teste.", "c": [{"n": "BankingApp.Tests/", "d": "xUnit. Referencia o Domain e a Application.", "c": [{"n": "Domain/", "d": "Testes às regras do Domain.", "c": [{"n": "CustomerTests.cs", "d": "O primeiro teste: valida o NIF e o nome.", "f": "BankingApp.Tests/Domain/CustomerTests.cs", "tag": null}]}, {"n": "Application/", "d": "Testes à Application.", "c": [{"n": "ResponseTests.cs", "d": "Testa o Response: Ok, Fail e Map.", "f": "BankingApp.Tests/Application/ResponseTests.cs", "tag": null}]}]}]}]}}], "sections": [{"t": "Criar a solução, os projetos e as referências", "intro": "Convenção do projeto inteiro: tudo são classes (sem records), uma classe por ficheiro, e cada classe com uma única responsabilidade. A solução e os projetos criam-se no IDE (Visual Studio ou Rider), sem linha de comandos. As referências entre projetos são a arquitetura: se o Domain não referencia nada, ninguém o consegue contaminar com EF Core. Os únicos comandos deste passo instalam dependências.", "steps": ["Criar a solução BankingApp, com as pastas src e tests", "Criar os cinco projetos: Domain, Application e Infrastructure (Class Library), Api (ASP.NET Core Web API com controllers, .NET 10) e Tests (xUnit)", "Configurar as Project References segundo a regra das dependências", "Apagar os ficheiros de exemplo dos templates (Class1, WeatherForecast e UnitTest1)", "Instalar os pacotes NuGet, a UI do Swagger e a ferramenta dotnet-ef", "Compilar a solução (Build Solution)"], "files": [{"name": "Project References", "lang": "txt", "code": "BankingApp.Domain          (sem referências)\nBankingApp.Application     -> BankingApp.Domain\nBankingApp.Infrastructure  -> BankingApp.Application\nBankingApp.Api             -> BankingApp.Application, BankingApp.Infrastructure\nBankingApp.Tests           -> BankingApp.Domain, BankingApp.Application"}, {"name": "Instalar dependências", "lang": "sh", "code": "# NuGet packages (or use the NuGet window of the IDE)\ndotnet add src/BankingApp.Application    package Microsoft.Extensions.DependencyInjection.Abstractions\ndotnet add src/BankingApp.Infrastructure package Microsoft.EntityFrameworkCore.SqlServer\ndotnet add src/BankingApp.Api            package Microsoft.EntityFrameworkCore.Design\ndotnet add src/BankingApp.Api            package Swashbuckle.AspNetCore.SwaggerUI\ndotnet add tests/BankingApp.Tests        package NSubstitute\n\n# the EF Core command-line tool, once per machine\ndotnet tool install --global dotnet-ef"}], "check": "Build succeeded.\n    0 Warning(s)\n    0 Error(s)"}, {"t": "Domain: a primeira entidade", "intro": "Customer é a primeira entidade. A validação vive dentro da própria classe, e os setters são privados para o estado só mudar por métodos da classe.", "files": [{"name": "BankingApp.Domain/Common/DomainException.cs", "lang": "cs", "code": "namespace BankingApp.Domain.Common;\n\npublic class DomainException : Exception\n{\n    public DomainException(string message) : base(message) { }\n}"}, {"name": "BankingApp.Domain/Customers/Customer.cs", "lang": "cs", "code": "using BankingApp.Domain.Common;\n\nnamespace BankingApp.Domain.Customers;\n\npublic class Customer\n{\n    private Customer() { }   // required by EF Core\n\n    public Customer(string name, string taxId)\n    {\n        if (string.IsNullOrWhiteSpace(name))\n            throw new DomainException(\"Name is required.\");\n        if (taxId.Length != 9 || !taxId.All(char.IsDigit))\n            throw new DomainException($\"Invalid tax id: {taxId}\");\n\n        Name = name.Trim();\n        TaxId = taxId;\n    }\n\n    public int Id { get; private set; }\n    public string Name { get; private set; } = \"\";\n    public string TaxId { get; private set; } = \"\";\n}"}]}, {"t": "Application: a abstração de entrada e de saída (API RPC)", "intro": "Esta API é RPC: o HTTP é só o transporte. Todos os pedidos são POST, para /api/<área>/<ação> (por exemplo, /api/accounts/deposit), e os parâmetros vão sempre no corpo JSON, nunca na rota nem na query string. Se o pedido chegou ao servidor e foi processado, a resposta é sempre 200 OK, e o resultado vem no corpo. Para isso, todos os casos de uso recebem um Request e devolvem um Response, que tem uma lista de erros. Quem chama lê success e errors em vez do código HTTP. Criamos já estas peças, porque tudo o que vem a seguir as usa.", "steps": ["Criar o Error, com uma fábrica por tipo (validation, not_found, conflict, unauthorized, forbidden)", "Criar a classe base Request, de onde herdam todos os comandos e consultas", "Criar o Response<T>: success é «não há erros»; Data guarda o resultado; Empty é para os casos de uso sem dados", "Criar o IHandler<TRequest, TData>, o contrato de qualquer caso de uso"], "files": [{"name": "BankingApp.Application/Common/Error.cs", "lang": "cs", "code": "namespace BankingApp.Application.Common;\n\n// RPC: errors are data. Every use case answers with a list of Error, never with an HTTP code.\npublic class Error\n{\n    public Error(string code, string message)\n    {\n        Code = code;\n        Message = message;\n    }\n\n    public string Code { get; }\n    public string Message { get; }\n\n    public static Error Validation(string message)   => new(\"validation\", message);\n    public static Error NotFound(string message)     => new(\"not_found\", message);\n    public static Error Conflict(string message)     => new(\"conflict\", message);\n    public static Error Unauthorized(string message) => new(\"unauthorized\", message);\n    public static Error Forbidden(string message)    => new(\"forbidden\", message);\n    public static Error Unexpected()                 => new(\"unexpected\", \"Unexpected error.\");\n}"}, {"name": "BankingApp.Application/Common/Request.cs", "lang": "cs", "code": "namespace BankingApp.Application.Common;\n\n// every input of a use case (command or query) derives from Request\npublic abstract class Request\n{\n}"}, {"name": "BankingApp.Application/Common/Response.cs", "lang": "cs", "code": "namespace BankingApp.Application.Common;\n\n// the output of EVERY use case: success is just \"no errors\"\npublic class Response<T>\n{\n    public bool Success => Errors.Count == 0;\n    public T? Data { get; init; }\n    public IReadOnlyList<Error> Errors { get; init; } = [];\n\n    public static Response<T> Ok(T data) => new() { Data = data };\n\n    public static Response<T> Fail(params IEnumerable<Error> errors)\n        => new() { Errors = errors.ToList() };\n\n    // convert the data (for example, a result into a DTO) and keep the errors\n    public Response<TOut> Map<TOut>(Func<T, TOut> map)\n        => Success ? Response<TOut>.Ok(map(Data!)) : Response<TOut>.Fail(Errors);\n}"}, {"name": "BankingApp.Application/Common/Empty.cs", "lang": "cs", "code": "namespace BankingApp.Application.Common;\n\n// the data of a use case that returns nothing: Response<Empty>\npublic sealed class Empty\n{\n}"}, {"name": "BankingApp.Application/Abstractions/IHandler.cs", "lang": "cs", "code": "using BankingApp.Application.Common;\n\nnamespace BankingApp.Application.Abstractions;\n\n// one handler per use case: a Request goes in, a Response comes out\npublic interface IHandler<in TRequest, TData> where TRequest : Request\n{\n    Task<Response<TData>> HandleAsync(TRequest request, CancellationToken ct);\n}"}]}, {"t": "Application: contratos e o primeiro caso de uso", "intro": "A Application define o que precisa (ICustomerRepository) e escreve cada caso de uso em três classes pequenas, cada uma no seu ficheiro: ficam todas juntas na pasta do caso de uso, dentro de Handlers/CommandHandlers (comandos) ou de Handlers/QueryHandlers (consultas), por exemplo Handlers/CommandHandlers/CreateCustomer. A pasta Handlers agrupa os dois. Um handler recebe um Request e devolve um Response: os erros de negócio devolvem-se, não se lançam. Não sabe nada de EF Core nem de HTTP.", "files": [{"name": "BankingApp.Application/Abstractions/ICustomerRepository.cs", "lang": "cs", "code": "using BankingApp.Domain.Customers;\n\nnamespace BankingApp.Application.Abstractions;\n\npublic interface ICustomerRepository\n{\n    Task<bool> ExistsByTaxIdAsync(string taxId, CancellationToken ct);\n    Task<IReadOnlyList<Customer>> ListAsync(CancellationToken ct);\n    Task AddAsync(Customer customer, CancellationToken ct);\n    Task SaveChangesAsync(CancellationToken ct);\n}"}, {"name": "BankingApp.Application/Handlers/CommandHandlers/CreateCustomer/CreateCustomerCommand.cs", "lang": "cs", "code": "using BankingApp.Application.Common;\n\nnamespace BankingApp.Application.Handlers.CommandHandlers.CreateCustomer;\n\n// command: only data\npublic class CreateCustomerCommand : Request\n{\n    public string Name { get; init; } = \"\";\n    public string TaxId { get; init; } = \"\";\n}"}, {"name": "BankingApp.Application/Handlers/CommandHandlers/CreateCustomer/CustomerResult.cs", "lang": "cs", "code": "using BankingApp.Domain.Customers;\n\nnamespace BankingApp.Application.Handlers.CommandHandlers.CreateCustomer;\n\npublic class CustomerResult\n{\n    public int Id { get; init; }\n    public string Name { get; init; } = \"\";\n    public string TaxId { get; init; } = \"\";\n\n    public static CustomerResult From(Customer customer) => new()\n    {\n        Id = customer.Id,\n        Name = customer.Name,\n        TaxId = customer.TaxId\n    };\n}"}, {"name": "BankingApp.Application/Handlers/CommandHandlers/CreateCustomer/CreateCustomerHandler.cs", "lang": "cs", "code": "using BankingApp.Application.Abstractions;\nusing BankingApp.Application.Common;\nusing BankingApp.Domain.Customers;\n\nnamespace BankingApp.Application.Handlers.CommandHandlers.CreateCustomer;\n\n// handler: the use case. Business errors come back in the Response, they are not thrown\npublic class CreateCustomerHandler : IHandler<CreateCustomerCommand, CustomerResult>\n{\n    private readonly ICustomerRepository _customers;\n\n    public CreateCustomerHandler(ICustomerRepository customers) => _customers = customers;\n\n    public async Task<Response<CustomerResult>> HandleAsync(CreateCustomerCommand request, CancellationToken ct)\n    {\n        if (await _customers.ExistsByTaxIdAsync(request.TaxId, ct))\n            return Response<CustomerResult>.Fail(\n                Error.Conflict($\"A customer with tax id {request.TaxId} already exists.\"));\n\n        var customer = new Customer(request.Name, request.TaxId);\n\n        await _customers.AddAsync(customer, ct);\n        await _customers.SaveChangesAsync(ct);\n\n        return Response<CustomerResult>.Ok(CustomerResult.From(customer));\n    }\n}"}, {"name": "BankingApp.Application/Handlers/QueryHandlers/ListCustomers/ListCustomersQuery.cs", "lang": "cs", "code": "using BankingApp.Application.Common;\n\nnamespace BankingApp.Application.Handlers.QueryHandlers.ListCustomers;\n\npublic class ListCustomersQuery : Request\n{\n}"}, {"name": "BankingApp.Application/Handlers/QueryHandlers/ListCustomers/ListCustomersHandler.cs", "lang": "cs", "code": "using BankingApp.Application.Abstractions;\nusing BankingApp.Application.Common;\nusing BankingApp.Application.Handlers.CommandHandlers.CreateCustomer;\n\nnamespace BankingApp.Application.Handlers.QueryHandlers.ListCustomers;\n\npublic class ListCustomersHandler : IHandler<ListCustomersQuery, IReadOnlyList<CustomerResult>>\n{\n    private readonly ICustomerRepository _customers;\n\n    public ListCustomersHandler(ICustomerRepository customers) => _customers = customers;\n\n    public async Task<Response<IReadOnlyList<CustomerResult>>> HandleAsync(ListCustomersQuery request, CancellationToken ct)\n    {\n        var all = await _customers.ListAsync(ct);\n        return Response<IReadOnlyList<CustomerResult>>.Ok(all.Select(CustomerResult.From).ToList());\n    }\n}"}, {"name": "BankingApp.Application/DependencyInjection.cs", "lang": "cs", "code": "using BankingApp.Application.Abstractions;\nusing BankingApp.Application.Handlers.CommandHandlers.CreateCustomer;\nusing BankingApp.Application.Handlers.QueryHandlers.ListCustomers;\nusing Microsoft.Extensions.DependencyInjection;\n\nnamespace BankingApp.Application;\n\npublic static class DependencyInjection\n{\n    public static IServiceCollection AddApplication(this IServiceCollection services)\n    {\n        services.AddScoped<IHandler<CreateCustomerCommand, CustomerResult>, CreateCustomerHandler>();\n        services.AddScoped<IHandler<ListCustomersQuery, IReadOnlyList<CustomerResult>>, ListCustomersHandler>();\n        return services;\n    }\n}"}]}, {"t": "Infrastructure: Entity Framework Core, repositório e ligação à base de dados", "intro": "O DbContext, a configuração da entidade com a Fluent API, o repositório que implementa o contrato da Application e a connection string. No fim, a primeira migration cria a base de dados.", "steps": ["Criar o BankingAppContext e a CustomerConfiguration", "Implementar o CustomerRepository", "Criar AddInfrastructure() com o DbContext e o repositório", "Pôr a connection string no appsettings.json da Api", "Criar a migration InitialCreate e aplicá-la"], "files": [{"name": "BankingApp.Infrastructure/Persistence/BankingAppContext.cs", "lang": "cs", "code": "using BankingApp.Domain.Customers;\nusing Microsoft.EntityFrameworkCore;\n\nnamespace BankingApp.Infrastructure.Persistence;\n\npublic class BankingAppContext : DbContext\n{\n    public BankingAppContext(DbContextOptions<BankingAppContext> options) : base(options) { }\n\n    public DbSet<Customer> Customers => Set<Customer>();\n\n    protected override void OnModelCreating(ModelBuilder modelBuilder)\n        => modelBuilder.ApplyConfigurationsFromAssembly(typeof(BankingAppContext).Assembly);\n}"}, {"name": "BankingApp.Infrastructure/Persistence/Configurations/CustomerConfiguration.cs", "lang": "cs", "code": "using BankingApp.Domain.Customers;\nusing Microsoft.EntityFrameworkCore;\nusing Microsoft.EntityFrameworkCore.Metadata.Builders;\n\nnamespace BankingApp.Infrastructure.Persistence.Configurations;\n\npublic class CustomerConfiguration : IEntityTypeConfiguration<Customer>\n{\n    public void Configure(EntityTypeBuilder<Customer> builder)\n    {\n        builder.Property(c => c.Name).HasMaxLength(100).IsRequired();\n        builder.Property(c => c.TaxId).HasMaxLength(9).IsRequired();\n        builder.HasIndex(c => c.TaxId).IsUnique();\n    }\n}"}, {"name": "BankingApp.Infrastructure/Repositories/CustomerRepository.cs", "lang": "cs", "code": "using BankingApp.Application.Abstractions;\nusing BankingApp.Domain.Customers;\nusing BankingApp.Infrastructure.Persistence;\nusing Microsoft.EntityFrameworkCore;\n\nnamespace BankingApp.Infrastructure.Repositories;\n\npublic class CustomerRepository : ICustomerRepository\n{\n    private readonly BankingAppContext _db;\n\n    public CustomerRepository(BankingAppContext db) => _db = db;\n\n    public Task<bool> ExistsByTaxIdAsync(string taxId, CancellationToken ct)\n        => _db.Customers.AnyAsync(c => c.TaxId == taxId, ct);\n\n    public async Task<IReadOnlyList<Customer>> ListAsync(CancellationToken ct)\n        => await _db.Customers.AsNoTracking().OrderBy(c => c.Name).ToListAsync(ct);\n\n    public async Task AddAsync(Customer customer, CancellationToken ct)\n        => await _db.Customers.AddAsync(customer, ct);\n\n    public Task SaveChangesAsync(CancellationToken ct)\n        => _db.SaveChangesAsync(ct);\n}"}, {"name": "BankingApp.Infrastructure/DependencyInjection.cs", "lang": "cs", "code": "using BankingApp.Application.Abstractions;\nusing BankingApp.Infrastructure.Persistence;\nusing BankingApp.Infrastructure.Repositories;\nusing Microsoft.EntityFrameworkCore;\nusing Microsoft.Extensions.Configuration;\nusing Microsoft.Extensions.DependencyInjection;\n\nnamespace BankingApp.Infrastructure;\n\npublic static class DependencyInjection\n{\n    public static IServiceCollection AddInfrastructure(\n        this IServiceCollection services, IConfiguration configuration)\n    {\n        services.AddDbContext<BankingAppContext>(options =>\n            options.UseSqlServer(configuration.GetConnectionString(\"BankingApp\")));\n\n        services.AddScoped<ICustomerRepository, CustomerRepository>();\n        return services;\n    }\n}"}, {"name": "BankingApp.Api/appsettings.json", "lang": "json", "code": "{\n  \"ConnectionStrings\": {\n    \"BankingApp\": \"Server=(localdb)\\\\MSSQLLocalDB;Database=BankingApp;Trusted_Connection=True;TrustServerCertificate=True\"\n  },\n  \"Logging\": {\n    \"LogLevel\": { \"Default\": \"Information\", \"Microsoft.AspNetCore\": \"Warning\" }\n  },\n  \"AllowedHosts\": \"*\"\n}"}, {"name": "Terminal (migrations)", "lang": "sh", "code": "dotnet ef migrations add InitialCreate -p src/BankingApp.Infrastructure -s src/BankingApp.Api -o Persistence/Migrations\ndotnet ef database update            -p src/BankingApp.Infrastructure -s src/BankingApp.Api"}], "check": "Applying migration '20261103100000_InitialCreate'.\nDone."}, {"t": "Api: controller, DTOs, tratamento de erros e Swagger", "intro": "O controller só converte o pedido num comando e devolve o Response do handler. Há três caminhos para um erro, e os três acabam em 200 com a lista de errors: o handler devolve-o, o ValidationResponse apanha os DTOs inválidos, e o ExceptionMiddleware apanha as exceções. O Swagger UI fica disponível em /swagger, em desenvolvimento.", "steps": ["Criar os DTOs com validação", "Criar o CustomersController", "Criar o ValidationResponse", "Criar o ExceptionMiddleware", "Montar o Program.cs com o OpenAPI e o Swagger UI", "Em Properties/launchSettings.json, pôr o launchUrl a swagger"], "files": [{"name": "BankingApp.Api/Contracts/Customers/NewCustomer.cs", "lang": "cs", "code": "using System.ComponentModel.DataAnnotations;\n\nnamespace BankingApp.Api.Contracts.Customers;\n\npublic class NewCustomer\n{\n    [Required, StringLength(100)]\n    public string Name { get; set; } = \"\";\n\n    [Required, RegularExpression(@\"^\\d{9}$\")]\n    public string TaxId { get; set; } = \"\";\n}"}, {"name": "BankingApp.Api/Contracts/Customers/CustomerResponse.cs", "lang": "cs", "code": "using BankingApp.Application.Handlers.CommandHandlers.CreateCustomer;\n\n\nnamespace BankingApp.Api.Contracts.Customers;\n\npublic class CustomerResponse\n{\n    public int Id { get; init; }\n    public string Name { get; init; } = \"\";\n    public string TaxId { get; init; } = \"\";\n\n    public static CustomerResponse From(CustomerResult result) => new()\n    {\n        Id = result.Id,\n        Name = result.Name,\n        TaxId = result.TaxId\n    };\n}"}, {"name": "BankingApp.Api/Controllers/CustomersController.cs", "lang": "cs", "code": "using BankingApp.Api.Contracts.Customers;\nusing BankingApp.Application.Abstractions;\nusing BankingApp.Application.Common;\nusing BankingApp.Application.Handlers.CommandHandlers.CreateCustomer;\nusing BankingApp.Application.Handlers.QueryHandlers.ListCustomers;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace BankingApp.Api.Controllers;\n\n[ApiController]\n[Route(\"api/[controller]\")]\npublic class CustomersController : ControllerBase\n{\n    private readonly IHandler<CreateCustomerCommand, CustomerResult> _create;\n    private readonly IHandler<ListCustomersQuery, IReadOnlyList<CustomerResult>> _list;\n\n    public CustomersController(\n        IHandler<CreateCustomerCommand, CustomerResult> create,\n        IHandler<ListCustomersQuery, IReadOnlyList<CustomerResult>> list)\n    {\n        _create = create;\n        _list = list;\n    }\n\n    // RPC: every operation is a POST to /api/<area>/<action>, and the answer is always 200 OK.\n    // Read \"success\" and \"errors\" in the body.\n    [HttpPost(\"list\")]\n    public async Task<Response<IEnumerable<CustomerResponse>>> List(CancellationToken ct)\n    {\n        var result = await _list.HandleAsync(new ListCustomersQuery(), ct);\n        return result.Map(items => items.Select(CustomerResponse.From));\n    }\n\n    [HttpPost(\"create\")]\n    public async Task<Response<CustomerResponse>> Create(NewCustomer body, CancellationToken ct)\n    {\n        var result = await _create.HandleAsync(new CreateCustomerCommand { Name = body.Name, TaxId = body.TaxId }, ct);\n        return result.Map(CustomerResponse.From);\n    }\n}"}, {"name": "BankingApp.Api/Responses/ValidationResponse.cs", "lang": "cs", "code": "using BankingApp.Application.Common;\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace BankingApp.Api.Responses;\n\npublic static class ValidationResponse\n{\n    // [ApiController] would answer 400 + ProblemDetails when the DTO is invalid.\n    // In an RPC API, we answer 200 and put every invalid field in the errors list.\n    public static IActionResult Create(ActionContext context)\n    {\n        var errors = context.ModelState\n            .Where(entry => entry.Value is { Errors.Count: > 0 })\n            .SelectMany(entry => entry.Value!.Errors\n                .Select(e => Error.Validation($\"{entry.Key}: {e.ErrorMessage}\")))\n            .ToList();\n\n        return new OkObjectResult(Response<object>.Fail(errors));\n    }\n}"}, {"name": "BankingApp.Api/Middleware/ExceptionMiddleware.cs", "lang": "cs", "code": "using BankingApp.Application.Common;\nusing BankingApp.Domain.Common;\n\nnamespace BankingApp.Api.Middleware;\n\npublic class ExceptionMiddleware\n{\n    private readonly RequestDelegate _next;\n    private readonly ILogger<ExceptionMiddleware> _logger;\n\n    public ExceptionMiddleware(RequestDelegate next, ILogger<ExceptionMiddleware> logger)\n    {\n        _next = next;\n        _logger = logger;\n    }\n\n    public async Task InvokeAsync(HttpContext context)\n    {\n        try\n        {\n            await _next(context);\n        }\n        catch (Exception ex)\n        {\n            Error error;\n\n            if (ex is DomainException)\n            {\n                error = Error.Validation(ex.Message);   // a rule of the Domain refused the data\n            }\n            else\n            {\n                _logger.LogError(ex, \"Unhandled error on {Path}\", context.Request.Path);\n                error = Error.Unexpected();              // never leak the details to the client\n            }\n\n            // RPC: the call reached the server, so the HTTP answer is always 200\n            context.Response.StatusCode = StatusCodes.Status200OK;\n            await context.Response.WriteAsJsonAsync(Response<object>.Fail(error));\n        }\n    }\n}\n\n// An exception is for the unexpected. Expected errors (not found, conflict)\n// are returned by the handlers, as Response.Fail(...)."}, {"name": "BankingApp.Api/Program.cs", "lang": "cs", "code": "using BankingApp.Api.Middleware;\nusing BankingApp.Api.Responses;\nusing BankingApp.Application;\nusing BankingApp.Infrastructure;\n\nvar builder = WebApplication.CreateBuilder(args);\n\nbuilder.Services.AddControllers()\n    .ConfigureApiBehaviorOptions(o =>\n        o.InvalidModelStateResponseFactory = ValidationResponse.Create);   // invalid DTO -> 200 + errors\nbuilder.Services.AddOpenApi();\nbuilder.Services.AddApplication();\nbuilder.Services.AddInfrastructure(builder.Configuration);\n\nvar app = builder.Build();\n\napp.UseMiddleware<ExceptionMiddleware>();   // first: catches everything below\n\nif (app.Environment.IsDevelopment())\n{\n    app.MapOpenApi();                        // /openapi/v1.json\n    app.UseSwaggerUI(o => o.SwaggerEndpoint(\"/openapi/v1.json\", \"v1\"));   // /swagger\n}\n\napp.UseHttpsRedirection();\napp.MapControllers();\n\napp.Run();"}, {"name": "BankingApp.Api/Properties/launchSettings.json", "lang": "json", "code": "\"launchUrl\": \"swagger\","}]}, {"t": "Testes: os primeiros testes", "intro": "O projeto de testes já existe. Escreve-se o primeiro teste ao Domain para ficar o padrão (Theory para os casos inválidos, Fact para o caso feliz) e os testes ao Response, que é a peça de que tudo depende.", "files": [{"name": "BankingApp.Tests/Domain/CustomerTests.cs", "lang": "cs", "code": "using BankingApp.Domain.Common;\nusing BankingApp.Domain.Customers;\n\nnamespace BankingApp.Tests.Domain;\n\npublic class CustomerTests\n{\n    [Theory]\n    [InlineData(\"123\")]\n    [InlineData(\"12345678a\")]\n    [InlineData(\"1234567890\")]\n    public void Constructor_InvalidTaxId_Throws(string taxId)\n        => Assert.Throws<DomainException>(() => new Customer(\"Ana Pereira\", taxId));\n\n    [Fact]\n    public void Constructor_ValidData_TrimsTheName()\n    {\n        var customer = new Customer(\"  Ana Pereira \", \"123456789\");\n\n        Assert.Equal(\"Ana Pereira\", customer.Name);\n    }\n}"}, {"name": "BankingApp.Tests/Application/ResponseTests.cs", "lang": "cs", "code": "using BankingApp.Application.Common;\n\nnamespace BankingApp.Tests.Application;\n\npublic class ResponseTests\n{\n    [Fact]\n    public void Ok_HasDataAndNoErrors()\n    {\n        var response = Response<int>.Ok(42);\n\n        Assert.True(response.Success);\n        Assert.Equal(42, response.Data);\n        Assert.Empty(response.Errors);\n    }\n\n    [Fact]\n    public void Fail_IsNotSuccessAndKeepsAllErrors()\n    {\n        var response = Response<int>.Fail(Error.Validation(\"a\"), Error.Conflict(\"b\"));\n\n        Assert.False(response.Success);\n        Assert.Equal(2, response.Errors.Count);\n    }\n\n    [Fact]\n    public void Map_OnFailure_KeepsTheErrors()\n    {\n        var response = Response<int>.Fail(Error.NotFound(\"x\")).Map(n => n.ToString());\n\n        Assert.False(response.Success);\n        Assert.Equal(\"not_found\", response.Errors[0].Code);\n    }\n}"}], "check": "Test Explorer\n7 passed, 0 failed, 0 skipped"}, {"t": "Correr e verificar", "intro": "A aplicação está funcional quando consegues criar e listar clientes pelo Swagger UI e ver a linha na base de dados. Repara que todas as respostas são 200: o que muda é o corpo.", "steps": ["Correr a BankingApp.Api no IDE (F5) e abrir /swagger", "POST /api/customers/create com um cliente válido: 200 com success true", "Repetir o POST: 200 com success false e o erro conflict", "POST com NIF \"123\": 200 com success false e o erro validation", "POST /api/customers/list e confirmar a linha na tabela Customers (cliente SQL)"], "files": [{"name": "Pedido de exemplo", "lang": "http", "code": "POST https://localhost:5001/api/customers/create\nContent-Type: application/json\n\n{ \"name\": \"Ana Pereira\", \"taxId\": \"123456789\" }\n\n# 200 OK\n# { \"success\": true, \"errors\": [], \"data\": { \"id\": 1, \"name\": \"Ana Pereira\", \"taxId\": \"123456789\" } }\n#\n# repeat the same request -> still 200 OK, but the body says it failed\n# { \"success\": false,\n#   \"errors\": [ { \"code\": \"conflict\", \"message\": \"A customer with tax id 123456789 already exists.\" } ],\n#   \"data\": null }"}], "check": "HTTP 200  success: true   (cliente criado)\nHTTP 200  success: false  errors: conflict    (NIF repetido)\nHTTP 200  success: false  errors: validation  (NIF inválido)\nHTTP 200  success: true   (lista com 1 cliente)"}], "more": {"more": "Ao fim do dia 1 tens uma aplicação pequena mas completa, de ponta a ponta: pedido HTTP, caso de uso, regra no Domain, gravação na base de dados e resposta. Tudo o que vem a seguir é repetir esta receita.\n\nOs três ficheiros mais importantes para perceber são o Program.cs (liga tudo), a DependencyInjection de cada camada (cada camada regista o que é seu) e o ExceptionMiddleware (traduz as exceções inesperadas em Response com erro).", "pit": "Esquecer de registar um handler ou um repositório. O erro só aparece no primeiro pedido, quando o container não consegue criar o controller.", "tryit": "Apaga a linha do AddScoped do CreateCustomerHandler, corre o POST e lê a mensagem de erro. Depois volta a pô-la."}}, {"id": "p2", "day": "Dia 1", "kind": "build", "title": "Autenticação JWT", "goal": "Configurar o token JWT, um método anónimo (Register e Login), um método autenticado (RetrieveDashboard) e a coleção do Bruno com o cabeçalho Authorize.", "uses": ["auth-4", "auth-5", "dotnet-3", "dotnet-4"], "trees": [{"title": "O que muda na estrutura", "note": "Cada ficheiro tem uma etiqueta: novo, alterado ou apagar.", "root": {"n": "BankingApp/", "d": "Só aparecem as pastas e ficheiros que mudam neste passo.", "c": [{"n": "src/", "d": "Código.", "c": [{"n": "BankingApp.Domain/", "d": "Ganha a entidade Account e as credenciais no Customer.", "c": [{"n": "Accounts/", "d": "Contas bancárias.", "c": [{"n": "Account.cs", "d": "Entidade Account e Account.Open.", "f": "BankingApp.Domain/Accounts/Account.cs", "tag": "novo"}, {"n": "AccountStatus.cs", "d": "O estado da conta: Active ou Closed.", "f": "BankingApp.Domain/Accounts/AccountStatus.cs", "tag": "novo"}]}, {"n": "Customers/", "d": "Clientes.", "c": [{"n": "Customer.cs", "d": "Passa a ter Email, PasswordHash e a lista de contas.", "f": "BankingApp.Domain/Customers/Customer.cs", "tag": "alterado"}]}]}, {"n": "BankingApp.Application/", "d": "Casos de uso de autenticação e dashboard.", "c": [{"n": "Abstractions/", "d": "Contratos.", "c": [{"n": "ICustomerRepository.cs", "d": "Ganha os métodos de email e de leitura com contas.", "f": "BankingApp.Application/Abstractions/ICustomerRepository.cs", "tag": "alterado"}, {"n": "IPasswordHasher.cs", "d": "Contrato do hash das passwords.", "f": "BankingApp.Application/Abstractions/IPasswordHasher.cs", "tag": "novo"}, {"n": "ITokenService.cs", "d": "Contrato que cria o token.", "f": "BankingApp.Application/Abstractions/ITokenService.cs", "tag": "novo"}, {"n": "TokenResult.cs", "d": "O token e a data de expiração.", "f": "BankingApp.Application/Abstractions/TokenResult.cs", "tag": "novo"}]}, {"n": "Handlers/", "d": "Os casos de uso, separados em comandos e consultas.", "c": [{"n": "CommandHandlers/", "d": "Um caso de uso por pasta. Entram o Register e o Login; sai o CreateCustomer.", "c": [{"n": "Register/", "d": "Caso de uso anónimo.", "c": [{"n": "RegisterCommand.cs", "d": "Os dados de entrada do Register.", "f": "BankingApp.Application/Handlers/CommandHandlers/Register/RegisterCommand.cs", "tag": "novo"}, {"n": "RegisterResult.cs", "d": "O resultado: id do cliente e número da conta.", "f": "BankingApp.Application/Handlers/CommandHandlers/Register/RegisterResult.cs", "tag": "novo"}, {"n": "RegisterHandler.cs", "d": "Cria o cliente e a primeira conta.", "f": "BankingApp.Application/Handlers/CommandHandlers/Register/RegisterHandler.cs", "tag": "novo"}]}, {"n": "Login/", "d": "Caso de uso anónimo.", "c": [{"n": "LoginCommand.cs", "d": "Os dados de entrada do Login.", "f": "BankingApp.Application/Handlers/CommandHandlers/Login/LoginCommand.cs", "tag": "novo"}, {"n": "LoginResult.cs", "d": "O resultado: o token.", "f": "BankingApp.Application/Handlers/CommandHandlers/Login/LoginResult.cs", "tag": "novo"}, {"n": "LoginHandler.cs", "d": "Valida as credenciais e devolve o token.", "f": "BankingApp.Application/Handlers/CommandHandlers/Login/LoginHandler.cs", "tag": "novo"}]}, {"n": "CreateCustomer/", "d": "Apaga esta pasta: serviu só para validar o Passo 1.", "c": [{"n": "(apagar)", "d": "CreateCustomerCommand, CustomerResult e CreateCustomerHandler.", "f": null, "tag": "apagar"}]}]}, {"n": "QueryHandlers/", "d": "Entra o RetrieveDashboard; sai o ListCustomers.", "c": [{"n": "RetrieveDashboard/", "d": "Caso de uso autenticado.", "c": [{"n": "RetrieveDashboardQuery.cs", "d": "A consulta: o id do cliente.", "f": "BankingApp.Application/Handlers/QueryHandlers/RetrieveDashboard/RetrieveDashboardQuery.cs", "tag": "novo"}, {"n": "DashboardAccount.cs", "d": "Uma conta no resumo.", "f": "BankingApp.Application/Handlers/QueryHandlers/RetrieveDashboard/DashboardAccount.cs", "tag": "novo"}, {"n": "DashboardResult.cs", "d": "O resumo: cliente, saldo total e contas.", "f": "BankingApp.Application/Handlers/QueryHandlers/RetrieveDashboard/DashboardResult.cs", "tag": "novo"}, {"n": "RetrieveDashboardHandler.cs", "d": "Calcula o resumo das contas ativas.", "f": "BankingApp.Application/Handlers/QueryHandlers/RetrieveDashboard/RetrieveDashboardHandler.cs", "tag": "novo"}]}, {"n": "ListCustomers/", "d": "Apaga esta pasta: serviu só para validar o Passo 1.", "c": [{"n": "(apagar)", "d": "ListCustomersQuery e ListCustomersHandler.", "f": null, "tag": "apagar"}]}]}]}]}, {"n": "BankingApp.Infrastructure/", "d": "Implementa o token, o hash e as novas tabelas.", "c": [{"n": "Authentication/", "d": "Tudo o que é segurança.", "c": [{"n": "JwtOptions.cs", "d": "As opções lidas da secção \"Jwt\".", "f": "BankingApp.Infrastructure/Authentication/JwtOptions.cs", "tag": "novo"}, {"n": "JwtTokenService.cs", "d": "Cria e assina o token.", "f": "BankingApp.Infrastructure/Authentication/JwtTokenService.cs", "tag": "novo"}, {"n": "PasswordHasherService.cs", "d": "Faz o hash e a verificação das passwords.", "f": "BankingApp.Infrastructure/Authentication/PasswordHasherService.cs", "tag": "novo"}]}, {"n": "Persistence/", "d": "EF Core.", "c": [{"n": "BankingAppContext.cs", "d": "Ganha DbSet<Account>.", "f": "BankingApp.Infrastructure/Persistence/BankingAppContext.cs", "tag": "alterado"}, {"n": "Configurations/", "d": "Fluent API.", "c": [{"n": "CustomerConfiguration.cs", "d": "Email e PasswordHash.", "f": "BankingApp.Infrastructure/Persistence/Configurations/CustomerConfiguration.cs", "tag": "alterado"}, {"n": "AccountConfiguration.cs", "d": "Número único, precisão e relação.", "f": "BankingApp.Infrastructure/Persistence/Configurations/AccountConfiguration.cs", "tag": "novo"}]}]}, {"n": "Repositories/", "d": "Implementações.", "c": [{"n": "CustomerRepository.cs", "d": "Novos métodos de leitura.", "f": "BankingApp.Infrastructure/Repositories/CustomerRepository.cs", "tag": "alterado"}]}, {"n": "DependencyInj
